<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3bb3a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Health">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Health Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#3bb3a8; --teal-d:#23867d; --teal-dd:#165e58; --teal-l:#dff4f1; --teal-ll:#f1faf8;
  --bg:#e6f6f3; --card:#ffffff; --ink:#1f2d33; --ink2:#4f6168; --muted:#7f9096; --line:#d5e7e4;
  --good:#2f9e5b; --warn:#c98a12; --bad:#d0463b; --info:#3a7bd5;
  /* Sleep: one accent for sleep data; --good/--ok/--short only to judge a night against the goal (always with a ✓ ~ ! mark) */
  --sleep:#5b5fc7; --sleep-d:#3d3a8c; --sleep-soft:#eceafb; --ok:#c98a12; --short:#d0463b;
  --r:16px; --shadow:0 2px 10px rgba(30,90,85,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100%;background:var(--teal-ll);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(30,90,85,.12)}
header.top{position:sticky;top:0;z-index:20;background:var(--teal-l);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;flex:1;text-align:center;font-weight:800;letter-spacing:.2px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.ghost{background:transparent;box-shadow:none}
main{flex:1;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
.sync{font-size:12px;color:var(--muted);text-align:center;margin:-4px 0 10px}
.sync.warn{color:var(--warn)}
/* nav */
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;font-weight:700;padding:4px 0}
nav.bottom a svg{width:22px;height:22px}
nav.bottom a.on{color:var(--teal-d)}
nav.bottom a.center .bub{width:54px;height:54px;border-radius:50%;background:var(--teal);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px rgba(59,179,168,.45);border:4px solid #fff}
nav.bottom a.center .bub svg{width:28px;height:28px;color:#fff}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.link{color:var(--teal-d);font-weight:700;font-size:13px;background:none;border:0;cursor:pointer;padding:0;text-decoration:none}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.hello .t{font-size:13px;color:var(--muted)} .hello .n{font-size:19px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:13px;text-align:center}
.tile:hover{border-color:var(--teal)}
.tile .ic{width:44px;height:44px;border-radius:14px;background:var(--teal-l);display:grid;place-items:center;color:var(--teal-d)}
.tile .ic svg{width:24px;height:24px}
.tile.hot{background:var(--teal);border-color:var(--teal);color:#fff}
.tile.hot .ic{background:rgba(255,255,255,.2);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--teal-ll);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:17px;font-weight:800}
.stat span{font-size:11px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--muted)}
.row.click{cursor:pointer}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--teal-l);color:var(--teal-dd)}
.pill.bad{background:#fbe3e1;color:#9b2c23}.pill.warn{background:#fbf0d9;color:#7d5608}.pill.good{background:#dff3e6;color:#1d6b3c}.pill.grey{background:#eef1f2;color:#5b6b70}
.medic{width:40px;height:40px;border-radius:12px;background:var(--teal-l);display:grid;place-items:center;color:var(--teal-d);flex:none}
.medic svg{width:22px;height:22px}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--teal);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none;color:#fff}
.chk.on{background:var(--teal)}
.chk svg{width:18px;height:18px}
.bar{height:8px;background:var(--teal-l);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 6px}
.btn{border:0;background:var(--teal);color:#fff;font-weight:800;border-radius:999px;padding:11px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.3px}
.btn:hover{background:var(--teal-d)}
.btn.block{width:100%}
.btn.sec{background:var(--teal-l);color:var(--teal-dd)}
.btn.out{background:#fff;color:var(--teal-dd);border:2px solid var(--teal)}
.btn.danger{background:#fbe3e1;color:#9b2c23}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;margin-bottom:12px;box-shadow:var(--shadow);overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--teal);color:#fff}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.search input{border:0;outline:0;flex:1;background:none}
.search svg{width:18px;height:18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.alert.bad{background:#fbe3e1;color:#7a221b;border:1px solid #f1bdb7}
.alert.warn{background:#fbf0d9;color:#6b4a07;border:1px solid #efd9a6}
.alert.good{background:#dff3e6;color:#1a5c34;border:1px solid #b9e2c7}
.alert.info{background:var(--teal-l);color:var(--teal-dd);border:1px solid #bfe6e0}
.alert b{display:block;margin-bottom:3px}
.small{font-size:12px;color:var(--muted)}
/* forms */
.sheet-bg{position:fixed;inset:0;background:rgba(20,45,45,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:440px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:44px;height:5px;background:var(--line);border-radius:9px;margin:4px auto 10px}
.sheet h2{font-size:18px;margin:0 0 12px;font-weight:800;display:flex;align-items:center;position:sticky;top:-8px;z-index:3;background:#fff;padding:6px 0;margin-top:-6px;box-shadow:0 1px 0 transparent;transition:box-shadow .15s}
.sheet.scrolled h2{box-shadow:0 1px 0 var(--line)}
.sheet:focus{outline:none}
.sheet h2 span{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
label.f{display:block;margin-bottom:10px;font-size:12.5px;font-weight:700;color:var(--ink2)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;border:2px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--teal-ll);outline:0;font-weight:600;font-size:14.5px}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--teal);background:#fff}
label.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.times input{width:auto!important;display:inline-block!important;margin:0!important}
.switch{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.switch .main{flex:1}
.tog{width:46px;height:28px;border-radius:99px;background:#cfdcdb;position:relative;cursor:pointer;border:0;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.tog.on{background:var(--teal)}
.tog.on::after{left:21px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;position:relative}
.cal .d.o{color:#b9c6c8}
.cal .d.today{outline:2px solid var(--teal)}
.cal .d.sel{background:var(--teal);color:#fff}
.cal .dots{display:flex;gap:2px;height:5px;margin-top:2px}
.cal .dots i{width:5px;height:5px;border-radius:50%}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead b{flex:1;text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
/* chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding:6px 2px 0;border-bottom:1px solid var(--line);position:relative}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:default}
.chart .col .b{width:60%;max-width:26px;background:var(--teal);border-radius:4px 4px 0 0;min-height:2px}
.chart .col:hover .b{background:var(--teal-d)}
.chart .col .tip{position:absolute;bottom:calc(100% - 4px);background:var(--ink);color:#fff;font-size:11px;padding:3px 6px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateY(-4px)}
.chart .col:hover .tip{opacity:1}
.chart .tline{position:absolute;left:0;right:0;border-top:1.5px dashed #9fb7b4;pointer-events:none}
.chart .tline span{position:absolute;right:0;top:-16px;font-size:10.5px;color:var(--muted)}
.xl{display:flex;gap:8px;padding:4px 2px 0}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.chart.dense,.xl.dense{gap:2px}
.chart .col:nth-last-child(-n+3) .tip{right:0;left:auto}
.chart .col:nth-child(-n+3) .tip{left:0;right:auto}
.chart .col,.xl span{min-width:0}
.chart.dense .col .b{width:80%}
.xl.dense span{overflow:visible;white-space:nowrap;font-size:10px}
/* files */
.thumb{width:48px;height:48px;border-radius:10px;background:var(--teal-l);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--teal-d)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:24px;height:24px}
.viewer img{max-width:100%;border-radius:12px;display:block;margin:0 auto 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0}
/* toast */
#toasts{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:416px;z-index:80;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none}
.toast{pointer-events:auto}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s}
.toast .main{flex:1;font-size:14px}
.toast button{background:var(--teal);color:#fff;border:0;border-radius:99px;padding:6px 10px;font-weight:800;cursor:pointer;font-size:12.5px}
.toast button.x{background:transparent;color:#cfe;padding:4px 6px}
.menu .row{cursor:pointer}
.menu .row svg{width:22px;height:22px;color:var(--teal-d)}
.disclaimer{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.ocrbox{border:2px dashed var(--teal);border-radius:14px;padding:14px;text-align:center;background:var(--teal-ll);margin-bottom:12px}
.hidden{display:none!important}
:root{--cy:#d4517e}
.cyhead{display:flex;gap:14px;align-items:center}
.cyring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex:none}
.cyring>div{width:88px;height:88px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cyring b{font-size:19px;color:#8c2343}.cyring span{font-size:11px;color:var(--muted)}
.cyinfo{display:flex;flex-direction:column;gap:6px;font-size:13px}.cyinfo span{display:block;color:var(--muted);font-size:11.5px;font-weight:700}
.cybtn{background:var(--cy)}.cybtn:hover{background:#b23d66}
.cal .d.cy-period{background:var(--cy);color:#fff}
.cal .d.cy-predicted{background:#fbe3ea;color:#8c2343;outline:1.5px dashed var(--cy);outline-offset:-3px}
.cal .d.cy-fertile{background:#e3eefc;color:#2b4f8f}
.cal .d.cy-ovulation{background:#5b7fd6;color:#fff}
.cal .d.cy-period.today,.cal .d.cy-ovulation.today{outline:2px solid var(--ink)}
.cyclealert{background:#fbe9ef;border-color:#f3c3d3;color:#7a2141}
.avatar.sm{width:40px;height:40px;font-size:15px}
.avatar.xs{width:30px;height:30px;font-size:12px;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800}
.pbanner{display:flex;align-items:center;gap:8px;color:#fff;border-radius:14px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.pbanner button{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:99px;padding:5px 10px;font-weight:800;cursor:pointer}
.rule{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--teal-ll);border:2px solid var(--line);border-radius:12px;padding:6px 8px;margin-bottom:6px;font-size:13.5px;font-weight:700}
.rule input,.rule select{border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;font-weight:700;font-size:13px}
.tmr.ready .ttl{color:var(--good)}
.tmr.ready .bar i{background:var(--good)}
.timers{border:2px solid #cfe9e5}
.grp{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;color:var(--teal-dd);background:var(--teal-ll);border-radius:10px;padding:6px 10px;margin:10px 0 2px}
.grp.warn{color:#7d4c08;background:#fdf3e1}
.grp:first-child{margin-top:0}
.chip.sm{padding:4px 10px;font-size:12px}
.scrollchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scrollchips::-webkit-scrollbar{display:none}
.scrollchips .chip{flex:none}
ol.steps{padding-left:20px;margin:0 0 14px}ol.steps li{margin-bottom:14px;font-size:14px}
.pill.rep{background:#ece8f8;color:#4b3a8c}
.prnrow .btn{white-space:nowrap}
.skipb{border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer}
.skipb:hover{border-color:var(--bad);color:var(--bad)}
h3 .pill{white-space:nowrap}
.row.dimmed .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.optcard{border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.optcard h4{margin:0 0 6px;font-size:14.5px}
.pill.food{background:#e4f3e9;color:#1d6b3c}.pill.food.pre{background:#fdf0dc;color:#7d4c08}.pill.food.any{background:#eef1f2;color:#4b5b60}
.pill.foodq{border:1.5px dashed #c98a12;background:#fffaf0;color:#7d5608;cursor:pointer;font:inherit;font-size:11px;font-weight:800}
.foodbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.foodbtns .btn{padding:12px 8px}
.pill.case{background:#e7eefc;color:#2b4f8f}
.casehead{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff}
.casehead h3{color:#fff;font-size:18px}
.casehead .small{color:rgba(255,255,255,.85)}
.casehead .stat{background:rgba(255,255,255,.16)}
.casehead .stat span{color:rgba(255,255,255,.85)}
.sect{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 2px 6px}
.medgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.medgrid input,.medgrid select{display:block;margin-top:3px;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--teal-ll);width:100%;font-size:13.5px;font-weight:600}
.rxmed{border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.rxmed.off{opacity:.5}
/* Timer + Hide taken, under the Meds calendar */
.daytools{display:flex;align-items:center;gap:6px}
.takentog{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:800;padding:5px 10px;min-height:30px}
.takentog:focus-visible,.timerbtn:focus-visible{outline:2px solid #2e7d70;outline-offset:2px}
.timerbtn{width:34px;height:34px;border-radius:50%;font-size:17px;line-height:1;background:var(--teal-ll);box-shadow:none}
.timerbtn:hover{background:var(--teal-l)}
[data-csum] b{display:block;margin-bottom:2px}
/* Settings → Dose times: each part of the day as start – end */
.slots{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.slotname{font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:5px}
.slotin{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.slotin span{font-weight:800;color:var(--muted)}
.slotin input{width:100%;min-width:0;height:46px;border:2px solid var(--line);border-radius:12px;padding:0 10px;background:var(--teal-ll);font-weight:700;font-size:14.5px;outline:0}
.slotin input:focus{border-color:var(--teal);background:#fff}
.slotin input[aria-invalid=true]{border-color:var(--bad);background:#fff}
.slotnote{margin-top:4px}
.slotnote.bad{color:var(--bad);font-weight:700}
.slotnote:empty{display:none}
.orline{display:flex;align-items:center;gap:10px;margin:14px 0 12px;color:var(--muted);font-size:12px;font-weight:700}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}
/* Cycle tracker */
.cycal button.d{border:0;background:none;font:inherit;font-weight:700;font-size:13px;color:inherit;padding:0}
.cycal .d.fut{cursor:default}
.cycal .d:focus-visible{outline:2px solid #2e7d70;outline-offset:1px}
.cal .d.cy-period.cyf-light{background:#e993b1;color:#fff}
.cal .d.cy-period.cyf-heavy{background:#a82c58;color:#fff}
.cal .d.cy-spotting{background:#fde8ef;color:#8c2343;box-shadow:inset 0 0 0 1.5px var(--cy)}
.cycal .d .lg{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:#8a9a9f}
.cycal .d.cy-period .lg,.cycal .d.cy-ovulation .lg{background:#fff}
.cyinfo b+span{display:block;font-weight:600;font-size:11.5px;color:var(--muted)}
.cypat{font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.cypat:first-of-type{border-top:0}
.cypat b{color:#8c2343}
.tchart{width:100%;height:auto;display:block;margin:4px 0 6px}
.tchart .tline2{fill:none;stroke:var(--cy);stroke-width:2;stroke-linejoin:round}
.tchart .tdot{fill:#fff;stroke:var(--cy);stroke-width:2}
.tchart .tdot.fert{fill:#5b7fd6;stroke:#5b7fd6}
.tchart .tcover{stroke:#8a9a9f;stroke-width:1.5;stroke-dasharray:4 3}
/* Notes */
.hntog{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 6px 4px 0;margin:-4px 0;font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;border-radius:10px}
.hntog .pill{margin-left:2px}
.hntog:focus-visible{outline:2px solid #2e7d70;outline-offset:2px}
.hnchev{width:8px;height:8px;border-right:2px solid var(--teal-d);border-bottom:2px solid var(--teal-d);transform:rotate(45deg);margin:0 0 3px 4px;transition:transform .15s}
.hntog[aria-expanded=true] .hnchev{transform:rotate(-135deg);margin:3px 0 0 4px}
.hnadd{display:flex;gap:8px;align-items:flex-end;margin:4px 0 6px}
.hnadd textarea{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--teal-ll);font-weight:600;font-size:14.5px;resize:vertical;min-height:46px;outline:0}
.hnadd textarea:focus{border-color:var(--teal);background:#fff}
.hnadd .btn{height:46px}
.row.note .ttl{white-space:normal;display:flex;align-items:center;gap:5px}
.noteprev{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notepin{display:inline-grid;color:var(--teal-d)}
.notepin svg{width:14px;height:14px}
/* Health → Meds (medicine information) */
.misearch{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.misearch .search{height:46px}
.misearch input{font-size:15px;min-width:0}
.misearch .btn{height:46px}
.mihead{display:flex;gap:12px;align-items:flex-start}
.mihead .main{flex:1;min-width:0}
.misec{border-top:1px solid var(--line);padding:2px 0}
.misec:first-child{border-top:0}
.misec summary{cursor:pointer;font-weight:800;font-size:14px;padding:10px 0;list-style:none;display:flex;align-items:center;gap:8px}
.misec summary::-webkit-details-marker{display:none}
.misec summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--teal-d);border-bottom:2px solid var(--teal-d);transform:rotate(45deg);transition:transform .15s}
.misec[open] summary::after{transform:rotate(-135deg)}
.misec summary:focus-visible{outline:2px solid #2e7d70;outline-offset:2px;border-radius:6px}
.mitext{white-space:pre-line;font-size:13.5px;line-height:1.5;color:var(--ink2);padding:0 0 12px}
#miResult:focus{outline:0}
.miplain{margin-top:12px;background:var(--teal-ll);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.miplain a{color:var(--teal-dd);font-weight:800;white-space:nowrap}
.mitag{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--teal-dd);margin-bottom:3px}
.mivia{font-size:12.5px;color:var(--ink2);background:#fdf3e1;border-radius:10px;padding:7px 10px;margin-bottom:10px}
.misrc{font-size:11.5px;color:#5b6b70;margin-top:6px}
/* Pregnancy */
.pgsetup{text-align:center;padding:28px 18px 22px}
.pgsetup h2{margin:0 0 6px;font-size:20px;font-weight:800}
.pgsetup p{color:var(--ink2);font-size:14px;margin:0 auto 16px;max-width:280px;line-height:1.45}
.pgroles{display:flex;flex-direction:column;gap:10px}
.pghead{background:linear-gradient(135deg,#fbe3ea,#fff 70%)}
.pgtop{display:flex;align-items:center;gap:14px}
.pgemoji{width:64px;height:64px;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:36px;box-shadow:var(--shadow);flex:none}
.pgweek{font-size:24px;font-weight:800;color:#8c2343;line-height:1.15}
.pgbar{margin-top:14px;height:10px;background:#f6d5df}
.pgbar i{background:var(--cy)}
.pgcount{font-size:13.5px;color:var(--ink2);margin-top:6px}
.pgcount b{font-size:16px;color:var(--ink)}
.pgsize{display:flex;align-items:center;gap:10px;background:#fdf1f5;border-radius:12px;padding:10px 12px;margin:4px 0 10px;font-size:14px}
.pgsize span{font-size:28px}
.pgsec{font-size:14px;line-height:1.5;padding:8px 0;border-top:1px solid var(--line)}
.pgsec .mitag{color:#8c2343}
.pgbig{padding:18px;font-size:16px}
.pgrow{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.pgrow span{flex:1}
.pgrow span:last-child{text-align:right}
.pgkick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pgkick div{background:#fdf1f5;border-radius:12px;padding:10px;text-align:center}
.pgkick b{display:block;font-size:24px;color:#8c2343}
.pgkick span{font-size:12px;color:var(--ink2)}
.pgform{display:flex;gap:8px;align-items:center;margin:8px 0}
.pgform input{flex:1;min-width:0;height:44px;border:2px solid var(--line);border-radius:12px;padding:0 10px;background:var(--teal-ll);font-weight:600;font-size:14.5px;outline:0}
.pgform input:focus{border-color:var(--teal);background:#fff}
.pgform span{font-weight:800;color:var(--muted)}
.pgform .btn{height:44px}
.pgchk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.pgchk input{width:20px;height:20px;accent-color:var(--teal);flex:none}
.pgchk input:checked+span{color:var(--muted);text-decoration:line-through}
.pgul{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.5}
.chip.pgdchip{border-color:#f1bdb7;color:#9b2c23}
.chip.pgdchip.on{background:#9b2c23;border-color:#9b2c23;color:#fff}
.pghome{background:#fdf1f5;border-color:#f6d5df;color:#7a2141}
.pgquick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pgquick .tile{padding:12px 6px;font:inherit;font-weight:700;font-size:12.5px;color:var(--ink)}
.pgquick .tile .ic{font-size:22px;background:#fdf1f5}
.cal .d.pgwk::before{content:"";position:absolute;top:3px;left:50%;width:14px;margin-left:-7px;height:2px;border-radius:2px;background:#e8a6bd}
.bumpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bumpcell{border:0;padding:0;background:#fdf1f5;border-radius:12px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:3/4;display:grid;place-items:center;font-size:24px}
.bumpcell img{width:100%;height:100%;object-fit:cover;display:block}
.bumpcell b{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:12px;padding:14px 6px 5px;text-align:left}
.bumpcell:focus-visible{outline:2px solid #2e7d70;outline-offset:2px}
/* Sleep — sleep data in --sleep; teal only for actions; --good/--ok/--short only to judge a night, always with ✓ ~ ! */
.slask{text-align:center;padding:24px 16px 18px;background:linear-gradient(160deg,var(--sleep-soft),#fff 70%)}
.slask h2{margin:0 0 4px;font-size:20px;font-weight:800}
.slmoon{font-size:40px;line-height:1;margin-bottom:6px}
.slqrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
/* one "selected" look across Sleep: mood faces, chips, goal options, the calendar's chosen day */
.slqb{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 2px;font-size:24px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;min-height:60px}
.slqb span{font-size:10.5px;font-weight:800;color:var(--ink2)}
.slqb.on,.slgopt.on,[data-mod=sleep] .chip.on{border-color:var(--sleep);background:var(--sleep-soft);color:var(--sleep-d)}
.slqb.on span{color:var(--sleep-d)}
[data-mod=sleep] .homecal .cal .d.sel{background:var(--sleep-soft);color:var(--sleep-d);box-shadow:inset 0 0 0 2px var(--sleep);outline:0}
[data-mod=sleep] .homecal .cal .d.today:not(.sel){outline-color:#b9b7ea}
.slqb:active,.slgopt:active{transform:scale(.97)}
.slqb:focus-visible,.slgopt:focus-visible,.slrow:focus-visible{outline:2px solid #2e7d70;outline-offset:2px}
/* Last night (hero) */
.slhero{background:linear-gradient(160deg,var(--sleep-soft),#fff 62%)}
.slhero-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.slhero-hd h3{margin:0;flex:1}
.pill.slsrc{background:var(--sleep-soft);color:var(--sleep-d)}
.slbig{display:flex;align-items:center;justify-content:space-between;gap:10px}
.slbig b.slnum{display:block;font-size:40px;font-weight:800;color:var(--sleep-d);line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.5px;white-space:nowrap}
.slbig b.slnum small{font-size:18px;font-weight:800;margin-left:2px;letter-spacing:0}
.slbig>div>span{font-size:13px;color:var(--ink2)}
.slq{text-align:center;font-size:34px;line-height:1.1;flex:none}
.slq span{display:block;font-size:11px;font-weight:800;color:var(--ink2)}
.slprog{position:relative;height:10px;border-radius:99px;background:#e2e0f5;margin:12px 0 6px}
.slprog i{display:block;height:100%;border-radius:99px;background:var(--sleep)}
.slprog span{position:absolute;top:-3px;width:2px;height:16px;background:var(--sleep-d);border-radius:2px;margin-left:-1px}
.slgoalrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2)}
.sljudge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:99px;padding:2px 8px 2px 3px;white-space:nowrap}
.sljudge i{font-style:normal;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10.5px;line-height:1}
.sljudge.good{background:#e3f4e9;color:#1f7a44}.sljudge.good i{background:var(--good)}
.sljudge.ok{background:#fbf0d9;color:#7a5408}.sljudge.ok i{background:var(--ok)}
.sljudge.short{background:#fbe3e1;color:#9b2c23}.sljudge.short i{background:var(--short)}
.slcontrib{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;padding-top:10px;border-top:1px solid #e4e2f6;font-size:13px;color:var(--ink2)}
.slcontrib b{color:var(--ink);font-variant-numeric:tabular-nums}
.slstages{display:flex;height:12px;border-radius:99px;overflow:hidden;margin-top:12px}
.slstages i{display:block;height:100%}
/* stat tiles: same height, one line, tabular figures */
.sltiles .stat{display:flex;flex-direction:column;justify-content:center;min-height:62px;background:var(--sleep-soft);padding:8px 3px}
.sltiles .stat b{font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--sleep-d);letter-spacing:-.2px}
.sltiles .stat b small,.slsum b small{font-size:10.5px;font-weight:700;margin-left:1px;letter-spacing:0}
.sltiles .stat span{color:var(--ink2)}
/* Tonight */
.slcount{font-size:21px;font-weight:800;color:var(--ink);line-height:1.25}
.slcount b{color:var(--sleep-d);font-variant-numeric:tabular-nums}
.slcue{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.4}
.sltonight .sltiles{margin-top:12px}
/* week summary + empty chart card */
.slsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.slsum>div{display:flex;flex-direction:column}
.slsum span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.slsum b{font-size:18px;font-weight:800;color:var(--sleep-d);white-space:nowrap;font-variant-numeric:tabular-nums}
.slnote{margin:2px 0 10px;font-size:12px}
.slneed{text-align:center;padding:16px 8px 6px}
.slneed-ic{width:48px;height:48px;border-radius:14px;background:var(--sleep-soft);color:var(--sleep);display:grid;place-items:center;margin:0 auto 10px}
.slneed-ic svg{width:26px;height:26px}
.slneed b{display:block;font-size:15.5px;margin-bottom:4px}
.slneed .btn{margin-top:12px}
.slcons{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px 12px;background:var(--sleep-soft);border-radius:12px;font-size:13.5px}
.slcons>div:first-child{font-size:12px;color:var(--ink2);text-align:center;flex:none}
.slcons>div:first-child b{display:block;font-size:24px;color:var(--sleep-d);font-variant-numeric:tabular-nums}
.sltip{background:var(--sleep-soft);font-size:14px;line-height:1.5}
.sltip .mitag{color:var(--sleep-d)}
/* charts */
.slchart{width:100%;height:auto;display:block;overflow:visible}
.slchart .slgrid{stroke:#e9ebf3;stroke-width:1}
.slchart .slbase{stroke:#c9cde0;stroke-width:1}
.slchart .slaxis{font-size:10px;fill:var(--muted);font-family:inherit;font-variant-numeric:tabular-nums}
.slchart .slaxis.goal{fill:var(--sleep-d);font-weight:800}
.slchart .slaxis.now{fill:var(--ink);font-weight:800}
.slchart .slval,.slchart .slaxis.goal{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.slchart .slval{font-size:9.5px;font-weight:800;fill:var(--sleep-d);font-family:inherit;font-variant-numeric:tabular-nums}
[data-mod=sleep] [data-slsum]{background:var(--sleep-soft);border-color:#d6d4f3;color:var(--sleep-d)}
.slchart .sltarget{stroke:#7d80b8;stroke-width:1.2;stroke-dasharray:4 3}
.slchart .slline{fill:none;stroke:var(--sleep);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.slchart .sldot{fill:var(--sleep);stroke:#fff;stroke-width:1.5}
.slchart .slband{fill:var(--good);opacity:.08}
.slchart .slinbed{fill:var(--sleep-soft);stroke:#cfcdf0;stroke-width:1}
.slchart .slnone{fill:#c9cde0}
.slchart [data-act]{cursor:pointer}
.slchart .slhitg:hover rect:nth-child(2),.slchart .slhit:hover{opacity:.85}
.slview{display:flex;gap:6px;margin-bottom:10px}
.slview .chip{min-height:36px}
.sllegend{gap:6px 12px}
.sllegend b{color:var(--ink)}
.slmk{display:inline-grid!important;place-items:center;width:15px!important;height:15px!important;color:#fff;font-style:normal;font-size:9.5px;font-weight:800;line-height:1}
.slmk.good{background:var(--good)}.slmk.ok{background:var(--ok)}.slmk.short{background:var(--short)}
.slkey{border-radius:3px!important}
.slkey.dash{width:16px!important;height:0!important;border-top:2px dashed #7d80b8;border-radius:0!important;background:none!important}
/* diary list */
.sllist{padding:4px 6px}
.slrow{width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;border-radius:12px;align-items:center}
.slrow .main{display:flex;flex-direction:column;min-width:0}
.slrow .main>span{display:block}
.slrow .sub b{color:var(--sleep-d)}
.slrow:hover{background:#f6f5fd}
.slrow:active{background:var(--sleep-soft)}
.slface{background:var(--sleep-soft)!important;color:var(--sleep-d);font-size:20px}
.slchev{flex:none;color:#a7abc4;display:grid;place-items:center}
.slchev svg{width:18px;height:18px}
/* Devices */
.slhic{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--sleep-soft);color:var(--sleep-d);margin-right:8px;vertical-align:middle;flex:none}
.slhic svg{width:17px;height:17px}
.slprovs summary{display:flex;align-items:center;gap:10px}
.slprov{flex:none;width:36px;height:36px;border-radius:11px;background:var(--sleep-soft);color:var(--sleep-d);display:grid;place-items:center}
.slprov svg{width:21px;height:21px}
.slprovt{flex:1;min-width:0}
.slprovt b{display:block;font-size:14.5px}
.slprovt span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.slbul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink2);line-height:1.45}
.slbul li{margin:0 0 6px}
.slbul li::marker{color:var(--sleep)}
/* goals */
.slgoal{cursor:pointer}
.slgh{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.slgh b{font-size:15px}
.slgdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.slgdays span{font-weight:800;font-size:14px;color:#b9c6c8;background:#f4f6f7;border-radius:10px;padding:4px 0 2px}
.slgdays span i{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted)}
.slgdays span.y{background:#dff3e6;color:var(--good)}
.slgdays span.n{background:#fbe3e1;color:var(--bad)}
.slgpick{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;max-height:46vh;overflow:auto}
.slgopt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.slgopt b{display:block;font-size:14px}
.slgopt span{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
/* Workout / Food / Sleep placeholders */
.soon{text-align:center;padding:34px 20px 26px}
.soon-ic{width:72px;height:72px;border-radius:22px;background:var(--teal-l);color:var(--teal-d);display:grid;place-items:center;margin:0 auto 14px}
.soon-ic svg{width:36px;height:36px}
.soon h2{margin:0 0 8px;font-size:20px;font-weight:800}
.soon p{color:var(--ink2);font-size:14px;margin:12px auto 18px;max-width:260px;line-height:1.45}
/* Home calendar */
.homecal .calhead{margin-top:2px}
.cal .d.sel.cy-period,.cal .d.sel.cy-predicted{background:var(--teal);color:#fff;outline:0}
.hcday{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.hchd{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.hchd b{font-size:14.5px}
.hchd .sp{flex:1}
/* Meds title dropdown */
.modebtn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font:inherit;font-size:18px;font-weight:800;letter-spacing:.2px;color:var(--ink);padding:6px 10px 6px 14px;border-radius:999px;cursor:pointer;max-width:100%}
.modebtn svg{width:16px;height:16px;color:var(--teal-d);transform:rotate(-90deg);transition:transform .15s}
.modebtn[aria-expanded=true] svg{transform:rotate(90deg)}
.modebtn:hover,.modebtn[aria-expanded=true]{background:rgba(255,255,255,.75)}
.modebtn:focus-visible{outline:2px solid #2e7d70;outline-offset:2px}
.modemenu{position:absolute;top:calc(100% - 4px);left:50%;transform:translateX(-50%);width:min(290px,calc(100% - 32px));background:#fff;border-radius:18px;box-shadow:0 14px 36px rgba(20,45,45,.22),0 0 0 1px rgba(20,45,45,.05);padding:6px;z-index:40;animation:menuin .14s ease-out}
@keyframes menuin{from{opacity:0;transform:translate(-50%,-6px)}}
.modeitem{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px;border-radius:13px;cursor:pointer;text-align:left;color:var(--ink)}
.modeitem+.modeitem{margin-top:2px}
.modeitem:hover,.modeitem:focus-visible{background:var(--teal-ll);outline:0}
.modeitem:focus-visible{box-shadow:inset 0 0 0 2px #2e7d70}
.modeitem[aria-checked=true]{background:var(--teal-l)}
.mi-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--teal-l);color:var(--teal-d);flex:none}
.mi-ic svg{width:22px;height:22px}
.modeitem[aria-checked=true] .mi-ic{background:#2e7d70;color:#fff}
.mi-t{flex:1;min-width:0}
.mi-t b{display:block;font-size:15px;font-weight:800}
.mi-t span{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.mi-ck{width:20px;height:20px;color:#2e7d70;flex:none}
.mi-ck svg{width:20px;height:20px}
/* Meds tabs + add button */
.segrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.segrow .seg{flex:1;min-width:0;margin-bottom:0}
.segadd{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--teal);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(59,179,168,.35)}
.segadd:hover{background:var(--teal-d)}
.segadd svg{width:22px;height:22px}
.segadd:focus-visible{outline:2px solid #2e7d70;outline-offset:2px}
/* tappable "✓ Taken 9:15" tag */
.pill-edit{border:0;cursor:pointer;font:inherit;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;vertical-align:middle}
.pill-edit svg{width:11px;height:11px}
.pill-edit:hover{background:#c9ead5}
.pill-edit:focus-visible{outline:2px solid #2e7d70;outline-offset:1px}
/* drag to reorder (Meds → Active) */

.drag-h{flex:none;width:36px;height:44px;margin-right:-8px;border:0;background:none;color:#8a9a9f;display:grid;place-items:center;cursor:grab;touch-action:none;border-radius:10px}
.drag-h svg{width:20px;height:20px}

#medSort .row.sorting{position:relative;z-index:5;background:#fff;margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:12px;border-top-color:transparent;box-shadow:0 10px 26px rgba(20,45,45,.22);cursor:grabbing}
#medSort .row.sorting .drag-h{color:#2e7d70;cursor:grabbing}
#medSort.sorting-on .row:not(.sorting){transition:none}
/* simple "Add medication" form (new medicines); the full form is medForm */
.qm-sub{margin:-6px 0 12px;font-size:13px;color:var(--ink2)}
.qm-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.qm-g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.qm-g2>*{min-width:0}
.qm-lh{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:20px;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.qm-opt{font-size:10.5px;font-weight:800;color:#5b6b70;background:#eef1f2;border-radius:999px;padding:1px 7px;letter-spacing:.2px}
.qm-hint{font-size:12px;font-weight:700;color:#5b6b70}
.qm-in{display:block;width:100%;min-width:0;height:46px;border:2px solid var(--line);border-radius:12px;padding:0 11px;background:var(--teal-ll);outline:0;font-weight:600;font-size:14.5px}
.qm-in:focus{border-color:var(--teal);background:#fff}
.qm-ta{height:auto;min-height:80px;padding:10px 11px;resize:vertical;line-height:1.4}
.qm-in[aria-invalid=true]{border-color:var(--bad);background:#fff}
.qm-err{color:var(--bad);font-size:12.5px;font-weight:700;margin-top:6px}
.qm-err:empty{display:none}
.qm-add{display:block;width:100%;height:46px;border:2px dashed #9fcfc8;border-radius:12px;background:#fff;color:var(--teal-dd);font-weight:800;font-size:13.5px;cursor:pointer}
.qm-endwrap{position:relative}
.qm-endwrap .qm-in{padding-right:40px}
.qm-x{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#5b6b70;font-size:15px;cursor:pointer}
.qm-x:hover{background:#eef1f2;color:var(--bad)}
.qm-seg{display:flex;height:46px;background:#eef1f2;border-radius:12px;padding:4px;gap:4px}
.qm-seg button{flex:1;min-width:0;border:0;background:none;border-radius:9px;font-weight:800;font-size:13px;color:#5b6b70;cursor:pointer;white-space:nowrap;padding:0 4px}
.qm-seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,45,45,.18)}
.qm-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.qm-freq{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qm-chip{height:44px;min-width:0;padding:0;border:2px solid var(--line);background:#fff;border-radius:999px;font-weight:800;font-size:12.5px;color:var(--ink2);cursor:pointer}
.qm-chip[aria-pressed=true]{background:#2e7d70;border-color:#2e7d70;color:#fff}
.qm button:focus-visible{outline:2px solid #2e7d70;outline-offset:2px}
.qm-times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qm label.f{margin:0}
.qm label.f select,.qm label.f input{height:46px;margin-top:0;padding:0 11px}
.qm .switch{border-top:0;padding:0}
.qm-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:#fff;margin:4px -16px 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));text-align:center;z-index:2}
.qm-foot .link{display:inline-block;margin-top:8px;padding:8px 12px;font-size:14px}
/* Workout — workout data in --wk (warm orange); teal stays for actions. Selected chips with white text use #9a3412 */
:root{--wk:#c2410c; --wk-d:#9a3412; --wk-soft:#fff1e8; --wk-line:#f6d6c3}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[data-mod=workout] .chip.on{background:var(--wk-soft);border-color:var(--wk);color:var(--wk-d)}
[data-mod=workout] .homecal .cal .d.sel{background:var(--wk-soft);color:var(--wk-d);box-shadow:inset 0 0 0 2px var(--wk);outline:0}
[data-mod=workout] .homecal .cal .d.today:not(.sel){outline-color:#f0b08c}
.wkhic{width:26px;height:26px;border-radius:8px;background:var(--wk-soft);color:var(--wk-d);display:inline-grid;place-items:center;flex:none}
.wkhic svg{width:18px;height:18px}
.wkhero{background:linear-gradient(160deg,var(--wk-soft),#fff 64%)}
.wkhero-hd{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.wkhero-hd b{flex:1;font-size:16px;font-weight:800;min-width:0}
.wkpill{background:var(--wk-soft);color:var(--wk-d);font-variant-numeric:tabular-nums;font-size:13px;padding:3px 10px}
.wkstart{text-align:center;padding:22px 16px 16px}
.wkstart h2{margin:0 0 4px;font-size:20px;font-weight:800}
.wkbig-ic{width:64px;height:64px;border-radius:20px;background:#fff;color:var(--wk);display:grid;place-items:center;margin:0 auto 10px;box-shadow:var(--shadow)}
.wkbig-ic svg{width:42px;height:42px}
.wkplanlist{margin:10px 0 0;padding:0;list-style:none;counter-reset:wk}
.wkplanlist li{display:flex;gap:10px;justify-content:space-between;padding:7px 0;border-top:1px solid var(--wk-line);font-size:14px;counter-increment:wk}
.wkplanlist li:first-child{border-top:0}
.wkplanlist li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.wkplanlist li span:first-child::before{content:counter(wk) ". ";color:var(--wk-d);font-weight:800}
.wkplanlist li span:last-child{color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.wkplanlist li.small{display:block}
.wkplanlist li.small::before{content:none}
.wkweek{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:4px 0 12px}
.wkweek span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--muted)}
.wkweek i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#f3f5f5;color:var(--muted);font-size:14px;font-weight:800}
.wkweek .y i{background:var(--wk);color:#fff}
.wkweek .n i{background:#fff;box-shadow:inset 0 0 0 2px var(--wk-line);color:var(--wk-d)}
.wkweek .now{color:var(--ink)}
.wkweek .now i{box-shadow:inset 0 0 0 2px var(--wk)}
.wkweek .y.now i{box-shadow:none}
.wksum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wksum>div{display:flex;flex-direction:column;min-width:0}
.wksum span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.wksum b{font-size:18px;font-weight:800;color:var(--wk-d);white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.wksum b small,.wktiles .stat b small{font-size:10.5px;font-weight:700;margin-left:1px}
.wktiles{grid-template-columns:repeat(auto-fit,minmax(64px,1fr))}
.wktiles .stat{background:var(--wk-soft);min-height:58px;display:flex;flex-direction:column;justify-content:center;padding:8px 3px}
.wktiles .stat b{font-size:16px;color:var(--wk-d);white-space:nowrap;font-variant-numeric:tabular-nums}
.wktiles .stat span{color:var(--ink2)}
.wkmedic{background:var(--wk-soft);color:var(--wk-d)}
.wkrow,.wkexrow,.wkday{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;font:inherit;color:inherit}
.hcday .wkrow:first-of-type,.wklist .small+.wkexrow,.wklist>.wkexrow:first-child,.card>h3+.wkrow{border-top:0}
.wkrow .main>span,.wkexrow .main>span,.wkday .main>span{display:block}
.wkrow:focus-visible,.wkexrow:focus-visible,.wkday:focus-visible,.wkexbtn:focus-visible{outline:2px solid #2e7d70;outline-offset:2px;border-radius:10px}
.wksafe summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;min-height:30px}
.wksafe summary::-webkit-details-marker{display:none}
.wksafe summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px auto}
.wksafe[open] summary::after{transform:rotate(-135deg);margin-bottom:-2px}
.wksafe .slbul{margin-top:10px}
/* exercise pictures */
.wkthumb{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--wk-line);overflow:hidden;flex:none;display:grid;place-items:center}
.wkthumb img{width:100%;height:100%;object-fit:contain;display:block}
.wkthumb.ic{background:var(--wk-soft);color:var(--wk-d);border-color:transparent}
.wkthumb.ic svg{width:26px;height:26px}
.wkmotion{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.wkmotion figure{margin:0;background:#fff;border:1px solid var(--wk-line);border-radius:14px;overflow:hidden;position:relative}
.wkmotion img{width:100%;aspect-ratio:167/175;object-fit:contain;display:block}
.wkmotion figcaption{position:absolute;left:6px;top:6px;font-size:11px;font-weight:800;background:var(--wk-soft);color:var(--wk-d);border-radius:99px;padding:1px 8px}
.wkmotion.none{display:grid;place-items:center;grid-template-columns:1fr;height:120px;background:var(--wk-soft);border-radius:14px;color:var(--wk-d)}
.wkmotion.none svg{width:64px;height:64px}
/* one picture that moves between the two positions, unless the phone asks for less motion */
@media (prefers-reduced-motion: no-preference){
  .wkmotion:not(.none){grid-template-columns:1fr;max-width:260px;margin-left:auto;margin-right:auto}
  .wkmotion:not(.none) figure+figure{position:absolute;inset:0;animation:wkflip 2.4s steps(1,end) infinite}
  .wkmotion:not(.none) figure:first-child figcaption{animation:wkcap 2.4s steps(1,end) infinite}
}
@keyframes wkflip{0%{opacity:0}50%{opacity:1}}
@keyframes wkcap{0%{opacity:1}50%{opacity:0}}
.wkprimer{margin:0 0 10px;font-size:14px;line-height:1.45;color:var(--ink2)}
.wkfacts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.wkfacts span{background:var(--wk-soft);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--ink);min-width:0}
.wkfacts b{display:block;font-size:10.5px;color:var(--wk-d);text-transform:uppercase;letter-spacing:.4px}
.wksteps{margin:4px 0 0;padding-left:20px;font-size:14px;line-height:1.5}
.wksteps li{margin-bottom:4px}
.wklist .row{padding:8px 0}
.wkgchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.wkgchips::-webkit-scrollbar{display:none}
.wkgchips .chip{flex:none;min-height:36px}
/* live workout */
.wkitem-hd{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px}
.wkexbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.wkexbtn>span:last-child{min-width:0}
.wkexbtn b{display:block;font-size:15px;line-height:1.25}
.wkitem-tools{display:flex;flex:none}
.wkitem-tools .iconbtn{width:36px;height:36px}
.wkitem-tools .iconbtn[disabled]{opacity:.3;cursor:default}
.wkhint{font-size:13px;background:var(--wk-soft);color:var(--wk-d);border-radius:10px;padding:6px 10px;margin-bottom:8px;font-weight:700}
.wksets{display:flex;flex-direction:column;gap:6px}
.wkset{display:grid;grid-template-columns:28px minmax(0,1fr) 62px 54px 44px;gap:6px;align-items:center}
.wksets.time .wkset{grid-template-columns:28px minmax(0,1fr) 84px 44px}
.wksets.cardio .wkset{grid-template-columns:28px minmax(0,1fr) 58px 58px 44px}
.wkset.hd{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.wkset.hd span:last-child{text-align:center}
.wkset .wkn{font-weight:800;text-align:center;color:var(--wk-d)}
.wkset .wkprev{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.wkset input{width:100%;min-width:0;height:44px;border:2px solid var(--line);border-radius:12px;padding:0 6px;background:var(--teal-ll);font-weight:800;font-size:15px;text-align:center;outline:0;font-variant-numeric:tabular-nums}
.wkset input:focus{border-color:var(--teal);background:#fff}
.wkset .chk{width:44px;height:44px;border-color:#2e7d70}
.wkset .chk.on{background:#2e7d70}
.wkset.done input{background:#eaf6ef;border-color:#bfe3cc}
body.wkresting #toasts{bottom:calc(150px + env(safe-area-inset-bottom))}
.wkrest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:420px;background:var(--wk-d);color:#fff;border-radius:16px;box-shadow:0 8px 22px rgba(80,30,10,.35);z-index:40;overflow:hidden}
.wkrest-bar{height:4px;background:rgba(255,255,255,.25)}

.wkrest-row{display:flex;align-items:center;gap:6px;padding:8px 10px}
.wkrest-t{flex:1;font-size:14px;font-weight:700}
.wkrest-t b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:4px}
.wkrest button{min-width:48px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:800;cursor:pointer}

.wkfeel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.wkvitem{padding:8px 0;border-top:1px solid var(--line)}
.wkvitem:first-of-type{border-top:0}
/* plans */
.wkday{align-items:center}
.wkdays{display:grid;grid-template-columns:repeat(7,13px);gap:2px;flex:none}
.wkdays i{font-style:normal;font-size:9.5px;font-weight:800;height:18px;border-radius:5px;display:grid;place-items:center;background:#f1f3f3;color:#9aa8ac}
.wkdays i.on{background:var(--wk);color:#fff}
.wktpl-days{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.wktpl-days b{color:var(--ink)}
.wkwd .chip{min-width:44px;min-height:40px}
.wkedit{margin-bottom:10px}
.wkeditrow{border-top:1px solid var(--line);padding:8px 0}
.wkeditrow:first-child{border-top:0}
.wkeditname{display:flex;align-items:center;gap:8px}
.wkeditname b{flex:1;min-width:0;font-size:14px;line-height:1.25}
.wkeditname .wkthumb{width:36px;height:36px}
.wknums{display:flex;gap:8px;margin:6px 0 0 44px}
.wknum{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.wknum input{width:64px;height:40px;border:2px solid var(--line);border-radius:10px;text-align:center;font-weight:800;background:var(--teal-ll);outline:0}
.wknum input:focus{border-color:var(--teal);background:#fff}
/* charts */
.wkchart{width:100%;height:auto;display:block;overflow:visible}

.wkchart .grid{stroke:#f3e6de;stroke-width:1;stroke-dasharray:3 3}

.fdph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fdph b{font-size:15.5px;line-height:1.25}
.fdlive{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;background:var(--fd-soft);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.fdlive>b{font-size:20px;font-weight:800;color:var(--fd-d);font-variant-numeric:tabular-nums}
.fdmini{display:flex;flex-wrap:wrap;gap:2px 10px;width:100%;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.fdrecent{display:flex;align-items:center;gap:6px}
.fdrecent .fdrow{flex:1;min-width:0}
.fdplus{width:44px;height:44px;flex:none;background:var(--teal-l);color:var(--teal-dd)}
.fdonline{margin-top:10px}
.fdgchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fdgchips::-webkit-scrollbar{display:none}
.fdgchips .chip{flex:none;min-height:36px}
.fdlist .row{padding:8px 0}
.fdtable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.fdtable th,.fdtable td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}
.fdtable th[scope=row]{text-align:left;font-weight:700}
.fdtable thead th{border-top:0;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.fdtable tr.sub th{padding-left:16px;font-weight:600;color:var(--ink2)}
.fdtiles{grid-template-columns:repeat(auto-fit,minmax(64px,1fr))}
.fdtiles .stat{background:var(--fd-soft);min-height:58px;display:flex;flex-direction:column;justify-content:center;padding:8px 3px}
.fdtiles .stat b{font-size:16px;color:var(--fd-d);white-space:nowrap;font-variant-numeric:tabular-nums}
.fdtiles .stat b small{font-size:10.5px;font-weight:700;margin-left:1px}
.fdtiles .stat span{color:var(--ink2)}
.fdchart{width:100%;height:auto;display:block;overflow:visible}
.fdchart .base{stroke:#d7e3c8;stroke-width:1}
.fdchart .tgt{stroke:#7a8f5c;stroke-width:1.2;stroke-dasharray:4 3}
.fdchart .ax{font-size:10px;fill:var(--muted);font-family:inherit;font-variant-numeric:tabular-nums}
.fdchart .ax.tg{fill:var(--fd-d);font-weight:800}
.fdchart .fdb{fill:var(--fd)}
.fdchart .none{fill:#cfd8c4}
.fdkey{border-radius:0!important;height:0!important;width:14px!important;border-top:2px dashed #7a8f5c;vertical-align:middle}
.fdsplit{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:4px 0 2px}
.fdsplit i{display:block;height:100%}
.slneed-ic.fd{background:var(--fd-soft);color:var(--fd)}
.fdrecs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.fdrec{display:flex;flex-direction:column;background:#fff;border:0;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.fdrec img,.fdrec-ic{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.fdrec-ic{display:grid;place-items:center;background:var(--fd-soft);color:var(--fd-d)}
.fdrec-ic svg{width:44px;height:44px}
.fdrec-t{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.fdrec-t b{font-size:14px;line-height:1.25}
.fdrec-t span{font-size:12px;color:var(--muted)}
.fdbig-ic{color:var(--fd)}
.fdrecphoto{width:100%;max-height:240px;object-fit:cover;border-radius:14px;display:block;margin-bottom:10px}
.fdings{list-style:none;margin:0;padding:0}
.fdings li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.fdings li:first-child{border-top:0}
.fdings li span:last-child{color:var(--ink2);text-align:right}
.fdphoto{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fdphoto img{width:100%;max-height:180px;object-fit:cover;border-radius:12px}
.fdingrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.fdingrow:first-child{border-top:0}
.fdingrow .main{min-width:0}
.fdingrow .main b{display:block;font-size:14px}
.fdingrow .main .small{display:block}
</style>

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const fmtD = s => s ? parseD(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) : '';
const fmtDs = s => s ? parseD(s).toLocaleDateString(undefined,{day:'numeric',month:'short'}) : '';
const fmtT = t => { if(!t) return ''; const [h,m] = t.split(':').map(Number); const d = new Date(); d.setHours(h,m); return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hmToMin = t => { const [h,m] = (t||'0:0').split(':').map(Number); return h*60+m; };

/* ---------------- store (on this device: IndexedDB) ---------------- */
const R = new Map();            // id -> record
let ASSETS = null, SAMPLE = null;
let storeMode = 'loading';      // loading | device | memory
const IDB = {
  db: null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('health-monitor', 1); r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('records')) d.createObjectStore('records', {keyPath:'id'}); if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs'); }; r.onsuccess = () => { IDB.db = r.result; res(r.result); }; r.onerror = () => rej(r.error); }); },
  req(store, mode, fn){ return new Promise((res, rej) => { const t = IDB.db.transaction(store, mode); const q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  all(){ return IDB.req('records', 'readonly', s => s.getAll()); },
  put(rec){ return IDB.req('records', 'readwrite', s => s.put(rec)); },
  del(id){ return IDB.req('records', 'readwrite', s => s.delete(id)); },
  putBlob(id, blob){ return IDB.req('blobs', 'readwrite', s => s.put(blob, id)); },
  getBlob(id){ return IDB.req('blobs', 'readonly', s => s.get(id)); },
  delBlob(id){ return IDB.req('blobs', 'readwrite', s => s.delete(id)); },
  clear(){ return Promise.all([IDB.req('records', 'readwrite', s => s.clear()), IDB.req('blobs', 'readwrite', s => s.clear())]); }
};

/* people: 'me' plus anyone in your care. Records of these kinds belong to one person. */
const PSCOPED = new Set(['med','visit','course','allergy','note','cyday','preg','pglog','bump','slp','slgoal','wo','wplan','wex','recipe','fitem','illness','file','case','goal','food','exercise','sleep','day','period','profile','timers']);
let CUR = (() => { try { return localStorage.getItem('hm.person') || 'me'; } catch(e) { return 'me'; } })();
let NO_RENDER = 0;
function ownerOf(r){ return r.personId || 'me'; }
function withPerson(pid, fn){ const prev = CUR; CUR = pid; NO_RENDER++; try { return fn(); } finally { CUR = prev; NO_RENDER--; } }
function list(kind){ return [...R.values()].filter(r => r.kind === kind && (!PSCOPED.has(kind) || ownerOf(r) === CUR)); }
function get(id){ return R.get(id); }
function single(kind, defaults){ const id = kind + '~' + (PSCOPED.has(kind) ? CUR : 'me'); return R.get(id) || {id, kind, ...defaults}; }
function day(date){ const id = CUR === 'me' ? 'day~' + date : 'day~' + CUR + '~' + date; return R.get(id) || {id, kind:'day', date, water:0, doses:{}, personId: CUR}; }

function persistErr(e){ if (e && /quota/i.test(e.name + e.message)) toast('Your phone is out of space for this app — delete some large records or free up storage.'); }
function save(rec){
  rec.updatedAt = Date.now();
  if (PSCOPED.has(rec.kind) && !rec.personId && CUR !== 'me') rec.personId = CUR;
  const copy = JSON.parse(JSON.stringify(rec));
  R.set(rec.id, copy);
  if (storeMode === 'device') IDB.put(copy).catch(persistErr);
  render();
  return rec;
}
function remove(id){
  const r = R.get(id);
  R.delete(id);
  if (storeMode === 'device') { IDB.del(id).catch(persistErr); if (r && r.blobId) IDB.delBlob(r.blobId).catch(()=>{}); }
  render();
}
async function initStore(){
  render();
  try {
    await IDB.open();
    (await IDB.all()).forEach(r => R.set(r.id, r));
    // one-time move of anything kept by an earlier version in localStorage
    try { const raw = localStorage.getItem('hm.records.v1'); if (raw) { for (const r of JSON.parse(raw)) if (!R.has(r.id)) { R.set(r.id, r); await IDB.put(r); } localStorage.removeItem('hm.records.v1'); } } catch(e) {}
    storeMode = 'device';
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  } catch(e) { storeMode = 'memory'; toast('This browser won\'t let the app store data — entries will be lost when you close it. Try opening it in Safari or Chrome (not a private window).', null, 0); }
  render();
}

/* ---------------- files kept on the device ---------------- */
const BLOB_URLS = new Map();    // blobId -> object URL
const BLOB_LOADING = new Set();
function fileUrl(f){
  if (f.dataUrl) return f.dataUrl;
  if (!f.blobId) return '';
  if (BLOB_URLS.has(f.blobId)) return BLOB_URLS.get(f.blobId);
  if (storeMode === 'device' && !BLOB_LOADING.has(f.blobId)) {
    BLOB_LOADING.add(f.blobId);
    IDB.getBlob(f.blobId).then(b => { if (b) { BLOB_URLS.set(f.blobId, URL.createObjectURL(b)); render(); const v = document.querySelector('.viewer[data-fid="' + f.id + '"]'); if (v) ACT.viewFile(f.id); } }).catch(()=>{});
  }
  return '';
}

function extractJson(t){
  const s = String(t||'').replace(/```(?:json)?/gi, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) throw {code:'bad_reply'};
  try { return JSON.parse(s.slice(a, b + 1)); } catch(e) { throw {code:'bad_reply'}; }
}

function wireStart(root, rxDate){

    if (row) { const past = v && v < t; row.classList.toggle('hidden', !past); if (past && txt) txt.textContent = `Doses from ${fmtD(v)} until now will be marked as taken (${daysBetween(v, t)} day${daysBetween(v, t)===1?'':'s'} ago). Untick if you'd rather mark them yourself — you can still change any dose later.`; }
  };
  root.querySelectorAll('[data-st]').forEach(c => c.onclick = () => { if (c.dataset.st === 'today') inp.value = today(); else if (c.dataset.st === 'rx') inp.value = rxDate; else { inp.focus(); try { inp.showPicker(); } catch(e) {} } upd(); });

const SLOTS = [['morning','Morning','08:00'],['noon','Noon / lunch','13:00'],['afternoon','Afternoon','14:00'],['evening','Evening / dinner','18:00'],['night','Night','21:00'],['bedtime','Bedtime','22:00']];
const DEF_SLOT_TIMES = Object.fromEntries(SLOTS.map(([k,,t]) => [k, t]));
const DEF_FREQ_SLOTS = {1:['morning'], 2:['morning','night'], 3:['morning','afternoon','night'], 4:['morning','noon','evening','bedtime']};
function settings(){
  const s = single('settings', {});
  return {...s, kind:'settings', id:'settings~me',
    targets: {cal:2000, water:8, sleep:8, exercise:30, ...(s.targets||{})},
    remind: {meds:true, water:false, waterEvery:2, sleep:false, bedtime:'22:30', ...(s.remind||{})},
    doseTimes: {...DEF_SLOT_TIMES, ...(s.doseTimes||{})},
    // the end of each part of the day: a dose not ticked by then counts as missed (default: start + 3 h, as before)
    doseEnds: {...Object.fromEntries(SLOTS.map(([k]) => [k, addHours({...DEF_SLOT_TIMES, ...(s.doseTimes||{})}[k], MISSED_AFTER_MIN / 60)])), ...(s.doseEnds||{})},
    freqSlots: {...DEF_FREQ_SLOTS, ...(s.freqSlots||{})}};
}
function slotTime(k){ return settings().doseTimes[k] || DEF_SLOT_TIMES[k]; }
/* how long a dose at this time stays "due": up to the end of the part of the day that starts then, else 3 h */
function doseWindow(time){
  const s = settings(); let best = 0, end = '';
  SLOTS.forEach(([k]) => { if (s.doseTimes[k] === time) { const w = (hmToMin(s.doseEnds[k]) - hmToMin(time) + 1440) % 1440; if (w > best) { best = w; end = s.doseEnds[k]; } } });
  return best ? {mins: best, end} : {mins: MISSED_AFTER_MIN, end: ''};
}
function freqTimes(n){ return [...new Set((settings().freqSlots[n] || DEF_FREQ_SLOTS[n] || ['morning']).map(slotTime))].sort(); }
function addHours(hm, h){ const m = (hmToMin(hm) + h*60) % 1440; return `${pad(Math.floor(m/60))}:${pad(m%60)}`; }
function profile(){ return single('profile', {name:'', dob:'', sex:'', blood:'', height:'', weight:'', allergies:'', conditions:'', ecName:'', ecPhone:''}); }
function upcomingVisits(){ const t = today(); return list('visit').filter(v => v.date >= t).sort((a,b)=> (a.date+(a.time||'')).localeCompare(b.date+(b.time||''))); }

function normFood(t){

  if (/empty stomach|on an? empty/.test(s)) return 'Empty stomach';
  if (new RegExp('before (a |your |the )?' + meal + '|pre ?' + meal + '|pre ?prandial|\\ba\\.?c\\.?\\b').test(s)) return 'Before food';
  if (new RegExp('after (a |your |the )?' + meal + '|post ?' + meal + '|post ?prandial|\\bp\\.?c\\.?\\b|full stomach').test(s)) return 'After food';

/* month grid shared by the prescriptions and appointments calendars; dots(d) returns a list of dot colours for a day */

  const inner = `<div class="calhead"><button class="iconbtn" data-act="${move}|-1" aria-label="Previous month">${ic('back')}</button><b>${first.toLocaleDateString(undefined, {month:'long', year:'numeric'})}</b><button class="iconbtn" data-act="${move}|1" aria-label="Next month">${ic('back', 'style="transform:rotate(180deg)"')}</button></div>

/* ---- courses of sessions (physio, therapy…): one record, sessions worked out from the pattern like medicine doses ----
   {kind:'course', apptType, doctor, facility, start, time, len, repeat:{type:'daily'|'weekly'|'monthly', days, every, day},
    ends:{mode:'count'|'date'|'ongoing', count, until, extend}, remind, stoppedFrom, sessions:{origDate: {s, date, time, pain, note}}} */
function courseRep(c){ return c.repeat && c.repeat.type ? c.repeat : {type:'weekly', days:[parseD(c.start).getDay()], every:1}; }
function courseSessions(c, upto){
  const out = [], S = c.sessions || {}, e = c.ends || {mode:'count', count:10, extend:true};
  const want = e.mode === 'count' ? Math.max(1, +e.count || 1) : Infinity;
  const horizon = upto || addDays(today(), 60), pat = {start: c.start, end: '', repeat: courseRep(c)};

    if (e.mode === 'date' && e.until && d > e.until) break;
    if (c.stoppedFrom && d >= c.stoppedFrom) break;
    if (e.mode !== 'count' && d > horizon) break;
    if (!medDueOn(pat, d)) continue;
    const st = S[d] || {}, cancelled = st.s === 'cancelled';

    out.push({c, orig: d, date: st.date || d, time: st.time || c.time || '', s: st.s || '', n: cancelled ? 0 : n, rec: st});
    if (used >= want) break;

  let body;

  }

function pregs(){ return list('preg').sort((a, b) => (b.created || 0) - (a.created || 0)); }
function activePreg(){ return pregs().find(p => p.status !== 'ended') || null; }
function pgLmpEq(p){   // the "equivalent" first day of the last period, which pregnancy weeks count from
  if (p.method === 'scan' && p.scanDate) return addDays(p.scanDate, -((+p.scanWeeks || 0) * 7 + (+p.scanDays || 0)));
  if (p.method === 'ivf' && p.ivfDate) return addDays(p.ivfDate, -(14 + (+p.embryoDay || 5)));
  if (p.method === 'due' && p.dueDate) return addDays(p.dueDate, -280);
  return p.lmp || addDays(p.dueDate || today(), -280);
}
function pgDue(p){ return addDays(pgLmpEq(p), 280); }
function pgAge(p, d){ const ga = daysBetween(pgLmpEq(p), d || today()); return {ga, w: Math.floor(ga / 7), d: ((ga % 7) + 7) % 7}; }
function pgTri(w){ return w < 14 ? 1 : w < 28 ? 2 : 3; }
function pgWeekInfo(w){ return PG_WEEKS[Math.max(4, Math.min(40, w))]; }
function pgPartnerTip(w){ return (PG_PARTNER.find(([a, b]) => w >= a && w <= b) || PG_PARTNER[PG_PARTNER.length - 1])[2]; }
function pgLogs(type){ return list('pglog').filter(x => !type || x.type === type).sort((a, b) => (b.at || 0) - (a.at || 0)); }
function pgName(p){ return p.partnerName || (p.role === 'partner' ? 'your partner' : ''); }

function wireWorkout(root){
  if (curModule() !== 'workout') return;
  if (!WKX && !WKX_LOADING && !WKX_ERR) wkLoad().then(() => { if (route === 'workout/library') { const l = document.getElementById('wkList'); if (l) { const y = scrollY; render(); scrollTo(0, y); } } }).catch(() => { if (route === 'workout/library') render(); });
  if (root.querySelector('[data-wkclock]') && !WK_CINT) WK_CINT = setInterval(wkClockTick, 1000);
  // live workout: typing in a set is saved without redrawing the page
  root.querySelectorAll('[data-wkf]').forEach(inp => inp.addEventListener('input', () => {
    const w = wkLive(); if (!w) return; const [i, j, k] = inp.dataset.wkf.split('|'), s = w.items[+i] && w.items[+i].sets[+j]; if (!s) return;
    s[k] = inp.value === '' ? '' : +inp.value; wkPut(w, false);
  }));
  const q = root.querySelector('#wkQ');
  if (q) q.addEventListener('input', () => { UI.wkQ = q.value; UI.wkLim = 60; const l = root.querySelector('#wkList'); l.innerHTML = wkListHtml(); bindView(l); });
  const eq = root.querySelector('#wkEq'); if (eq) eq.onchange = () => { UI.wkEq = eq.value; UI.wkLim = 60; const l = root.querySelector('#wkList'); l.innerHTML = wkListHtml(); bindView(l); };
  const ep = root.querySelector('#wkExPick'); if (ep) ep.onchange = () => { UI.wkExSel = ep.value; const y = scrollY; render(); scrollTo(0, y); };
  const rs = root.querySelector('#wkRestSel'); if (rs) rs.onchange = () => { const s = settings(); save({...s, workoutPrefs: {...wkPrefs(), rest: +rs.value}}); toast(+rs.value ? 'Rest timer set.' : 'Rest timer off.', null, 2000); };
}

/* ---------------- food (Home menu → Food) ----------------
   Common foods: USDA FoodData Central (public domain) built into the app — works offline, nothing sent anywhere.
   Packaged foods: Open Food Facts (data ODbL, photos CC BY-SA), searched only when you tap "Search online": only the search words or barcode are sent.
   Records (person-specific):
   {kind:'food', id, date, meal, desc, cal, notes,                ← the same fields Health → Food always used, so old entries still show
     g, qty, amt, unit, p, c, f, fib, sug, salt, src, ref, per}    ← new: amount eaten, nutrients for that amount, where it came from, values per 100 g (or per serving)
   {kind:'fitem', id, name, brand, code, per, por:[[label, grams]], unit, src:'off'|'mine', img}   ← my foods (own, or packaged ones you've logged)
   {kind:'recipe', id, title, serves, mins, ings:[{name, g, qty, per, ref, unit}], steps, photo, starter} */
const FD_MEALS = ['Breakfast','Lunch','Dinner','Snack'];
const FD_MEAL_LBL = {Breakfast: 'Breakfast', Lunch: 'Lunch', Dinner: 'Dinner', Snack: 'Snacks', Drink: 'Drinks'};
const FD_GROUP_IC = {'Fruit': 'h_fruits', 'Vegetables': 'h_vegetables', 'Grains': 'h_carbohydrates', 'Meat & fish': 'h_hot_meal', 'Eggs & dairy': 'h_dairy', 'Drinks': 'h_running_water', 'Beans, nuts & seeds': 'h_nutrition', 'Fats & sauces': 'h_nutrition', 'Sweets & snacks': 'h_sugar', 'Ready meals': 'h_hot_meal'};
const FD_GROUPS = Object.keys(FD_GROUP_IC);
const FD_MAC = [['p','Protein','#b45309'],['c','Carbs','#2563eb'],['f','Fat','#be185d']];
const FD_NUT = [['kcal','Energy','kcal'],['p','Protein','g'],['c','Carbohydrate','g'],['sug','of which sugars','g'],['f','Fat','g'],['fib','Fibre','g'],['salt','Salt','g']];
const FD_OFF = 'https://world.openfoodfacts.org';
let FD_COMMON_X = null;
function fdCommon(){
  if (!FD_COMMON_X) FD_COMMON_X = FD_COMMON.map(([name, group, kcal, p, c, f, fib, sug, salt, id, por]) => ({key: 'u:' + id, name, sub: group, group, per: {kcal, p, c, f, fib, sug, salt}, por, src: 'usda', icon: /beer|wine/i.test(name) ? 'h_alcohol' : FD_GROUP_IC[group] || 'h_nutrition'}));
  return FD_COMMON_X;
}
const fdMine = () => list('fitem').sort((a, b) => a.name.localeCompare(b.name)).map(x => ({key: x.id, name: x.name, sub: [x.brand, x.src === 'off' ? 'Open Food Facts' : 'My food'].filter(Boolean).join(' · '), per: x.per, por: x.por || [], unit: !!x.unit, src: x.src, img: x.img, code: x.code, icon: 'h_nutrition', mine: true}));
const fdRecipes = () => list('recipe').sort((a, b) => (a.starter ? 1 : 0) - (b.starter ? 1 : 0) || (b.created || 0) - (a.created || 0));
function fdRecipeItem(r){ const n = fdRecipeNut(r); return {key: r.id, name: r.title, sub: `Recipe · serves ${r.serves || 1}`, per: n.per, por: [['1 serving', 1]], unit: true, src: 'recipe', img: r.photo || '', icon: 'h_hot_meal', recipe: true}; }
function fdItem(key){
  if (!key) return null;
  if (key.startsWith('u:')) return fdCommon().find(x => x.key === key) || null;
  if (key.startsWith('recipe~')) { const r = get(key); return r ? fdRecipeItem(r) : null; }
  if (key.startsWith('fitem~')) return fdMine().find(x => x.key === key) || null;
  return null;
}
/* ---- numbers ---- */
function fdPrefs(){ const s = settings(); return {cal: +s.targets.cal || 2000, water: +s.targets.water || 8, p: '', c: '', f: '', hide: false, ...(s.foodPrefs || {})}; }
const fdR = v => v == null || v === '' || isNaN(v) ? '–' : (Math.abs(v) < 10 ? Math.round(v * 10) / 10 : Math.round(v)).toLocaleString();
const fdK = v => Math.round(+v || 0).toLocaleString();
function fdScale(per, amt){ const o = {}; ['kcal','p','c','f','fib','sug','salt'].forEach(k => { o[k] = per && per[k] != null && per[k] !== '' ? Math.round(per[k] * amt * 10) / 10 : null; }); return o; }
const fdFactor = (item, g) => item.unit ? +g : +g / 100;   // grams → ×/100; servings → ×1
function fdDayEntries(d){ return list('food').filter(f => f.date === d); }
function fdTotals(es){
  const t = {kcal: 0, p: 0, c: 0, f: 0, fib: 0, sug: 0, salt: 0, n: es.length, macros: 0, full: 0};
  es.forEach(e => { t.kcal += +e.cal || 0; if (e.p != null && e.p !== '') { t.macros++; ['p','c','f','fib','sug','salt'].forEach(k => t[k] += +e[k] || 0); } if (e.fib != null && e.fib !== '' && e.salt != null && e.salt !== '') t.full++; });
  return t;
}
const fdQty = (item, g, label) => item.unit ? (label && label !== '1 serving' ? label : `${fdR(g)} serving${+g === 1 ? '' : 's'}`) : label ? label : `${fdR(g)} g`;

/* ---- logging ---- */
function fdLog(item, g, label, meal, date, edit){
  const n = fdScale(item.per, fdFactor(item, g));
  let ref = item.key;
  if (item.src === 'off' && !item.key.startsWith('fitem~')) {   // keep a packaged food you've logged, so it's there offline next time
    const old = list('fitem').find(x => x.code && x.code === item.code);
    const fi = {...(old || {}), kind: 'fitem', id: old ? old.id : 'fitem~' + uid(), name: item.name, brand: item.brand || '', code: item.code, per: item.per, por: item.por, src: 'off', img: item.img || '', ...(CUR !== 'me' ? {personId: CUR} : {})};
    putRec(fi); ref = fi.id;
  }
  const rec = {...(edit || {}), kind: 'food', id: edit ? edit.id : 'food~' + uid(), date, meal, desc: item.name, cal: Math.round(n.kcal || 0), g: +g, qty: fdQty(item, g, label), amt: label || '', unit: !!item.unit,
    p: n.p, c: n.c, f: n.f, fib: n.fib, sug: n.sug, salt: n.salt, src: item.src, ref, per: item.per, notes: (edit && edit.notes) || ''};
  save(rec); return rec;
}
/* choose how much: a portion (from USDA / the pack) or grams, with the numbers updating as you go */
function fdPortionSheet(item, o){
  o = o || {}; const edit = o.edit || null, hide = fdPrefs().hide;
  const por = item.unit ? (item.por && item.por.length ? item.por : [['1 serving', 1]]) : [...(item.por || []), ['100 g', 100]];
  let pi = edit ? -1 : (item.unit ? 0 : 0), mult = 1;
  if (edit && edit.amt) { const k = por.findIndex(x => edit.amt.endsWith(x[0].replace(/^1 /, ''))); if (k >= 0) { pi = k; mult = Math.round(edit.g / por[k][1] * 100) / 100; } }
  if (edit && pi < 0) { if (item.unit) { pi = 0; mult = Math.round(edit.g / por[0][1] * 100) / 100; } else mult = edit.g; }
  const meal = o.meal || (edit && edit.meal) || mealNow().replace('Snack', 'Snack'), date = o.date || (edit && edit.date) || today();
  const portOpts = por.map(([l, g], i) => `<option value="${i}" ${pi === i ? 'selected' : ''}>${esc(l)}${item.unit ? '' : ` (${fdR(g)} g)`}</option>`).join('') + (item.unit ? '' : `<option value="-1" ${pi < 0 ? 'selected' : ''}>Grams</option>`);
  openSheet(o.title || (edit ? 'Edit' : 'Add food'), `<form id="fdPf">
    <div class="fdph">${fdThumb(item)}<div><b>${esc(item.name)}</b><div class="small">${esc(item.sub || '')}</div></div></div>
    <div class="grid2"><label class="f">${item.unit ? 'Servings' : 'How many'}<input type="number" name="mult" inputmode="decimal" min="0" step="any" value="${mult}" required></label>
      <label class="f">${item.unit ? 'Portion' : 'Of'}<select name="por">${portOpts}</select></label></div>

function allergyMatches(medName){
  const n = normName(medName); if (n.length < 3) return [];

  list('allergy').forEach(a => {
    const an = normName(a.name); if (an.length < 3) return;

/* ---------------- medicine information (Health → Meds) ----------------

  ['How to take it', ['dosage_and_administration','directions']],
  ['Do not take it if', ['contraindications','do_not_use']],
  ['Warnings', ['warnings_and_cautions','warnings','precautions','general_precautions']],
  ['Ask a doctor or pharmacist', ['ask_doctor','ask_doctor_or_pharmacist','stop_use','when_using']],
  ['Side effects', ['adverse_reactions']],
  ['Interactions with other medicines', ['drug_interactions']],
