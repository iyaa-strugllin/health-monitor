const MI_HEAD = /^\s*[\d.]*\s*(indications (and|&) usage|uses?|purposes?|dosage (and|&) administration|directions|contraindications|do not use|warnings (and|&) precautions|warnings|precautions|general precautions|ask (a )?doctor( or pharmacist)?( before use if you (have|are))?|stop use (and ask a doctor )?if|when using this product|adverse reactions|drug interactions|use in specific populations|pregnancy( or breast[- ]feeding)?|lactation|nursing mothers|overdosage|storage (and|&) handling|boxed warning|warning)\s*[:.]?\s*/i;

/* Several free sources, used together:
   - U.S. FDA drug labels (openFDA)              — the detailed label

async function getJSON(url, ms = 12000){
  const c = new AbortController(), tm = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, {signal: c.signal}); if (r.status === 404) return null; if (!r.ok) throw new Error('http ' + r.status); return await r.json(); }

const soft = p => p.catch(() => null);
async function fdaSearch(term){

  const j = await getJSON('https://api.fda.gov/drug/label.json?search=' + encodeURIComponent(s) + '&limit=25');
  if (!j) return [];
  const qn = normName(term), combo = g => /( and |,|\/)/.test(g);
  const score = r => { const o = r.openfda || {}, gs = (o.generic_name || []).map(normName), bs = (o.brand_name || []).map(normName); let sc = 0;
    if (gs.some(g => g === qn)) sc += 100; else if (gs.some(g => g.startsWith(qn) && !combo(g))) sc += 80;
    if (bs.some(b => b === qn)) sc += 90;
    if (gs.some(combo) && !combo(qn)) sc -= 50;
    return sc + MI_SECTIONS.filter(([, ks]) => ks.some(k => r[k])).length; };
  const seen = new Set();
  return (j.results || []).map(r => ({r, sc: score(r)})).sort((a, b) => b.sc - a.sc).map(x => x.r)
    .filter(r => { const o = r.openfda || {}, k = ((o.generic_name || [''])[0] + '|' + (o.brand_name || [''])[0]).toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 8);

    const vis = rows().map(r => r.dataset.mid), t = today();
    // the list may be filtered by case: keep hidden medicines where they were, reorder the visible ones among their own slots
    const all = list('med').filter(m => medActiveOn(m, t) || (m.start > t && !m.stopped)).sort((a, b) => orderIdx(a.id) - orderIdx(b.id) || a.name.localeCompare(b.name)).map(m => m.id);

function shrinkImage(file, max, q=0.85){
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      if (s === 1 && file.size < 1.5e6 && q >= 0.85) return res(file);
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || file), 'image/jpeg', q);
    };
    img.onerror = () => res(file);
    img.src = URL.createObjectURL(file);
  });
}

async function storeUpload(file, meta){

    catch(e) { persistErr(e); }

  return save(rec);
}

const SYMPTOMS = ['Fever','Cough','Sore throat','Runny nose','Headache','Body aches','Fatigue','Nausea','Vomiting','Diarrhea','Stomach pain','Dizziness','Rash','Chills','Loss of taste/smell','Shortness of breath','Chest pain','Ear pain','Back pain','Painful urination'];
const RED_FLAGS = [
  {s:['Chest pain'], m:'Chest pain'},
  {s:['Shortness of breath'], m:'Difficulty breathing'},
];
const RED_TEXT = /(faint|unconscious|seizure|confus|stiff neck|blood|bleed|can'?t breathe|severe|worst headache|slurred|numb|weak(ness)? on one side|suicid|swelling of (the )?(face|lips|tongue|throat))/i;
function triage(i){
  const t = today(), days = daysBetween(i.start, t) + 1;
  const flags = [];
  RED_FLAGS.forEach(r => { if (r.s.every(s => (i.symptoms||[]).includes(s))) flags.push(r.m); });
  const tmp = parseFloat(i.temp);
  if (tmp >= 39.4) flags.push(`High fever (${tmp} °C)`);
  if (+i.severity >= 9) flags.push('Very severe symptoms');
  const tm = (i.notes||'').match(RED_TEXT); if (tm) flags.push(`“${tm[0]}” mentioned`);
  if (flags.length) return {level:'bad', title:'Seek medical care now', text:`Because of: ${flags.join(', ')}. Contact a doctor or go to urgent care today. If symptoms are severe or getting worse fast, call your local emergency number.`};
  const see = [];
  if (tmp >= 38 && days >= 3) see.push('fever lasting 3+ days');
  if (days >= 7) see.push('symptoms for over a week');
  if (+i.severity >= 7) see.push('high severity');
  if ((i.symptoms||[]).some(s => ['Vomiting','Diarrhea'].includes(s)) && days >= 2) see.push('vomiting/diarrhea for 2+ days (dehydration risk)');
  if ((i.symptoms||[]).includes('Painful urination')) see.push('possible urinary infection');
  if ((i.symptoms||[]).includes('Ear pain') && days >= 3) see.push('ear pain for 3+ days');
  const p = profile();
  if (p.conditions) see.push('you have a long-term condition (' + p.conditions.slice(0,40) + ')');
  if (see.length) return {level:'warn', title:'Consider seeing a doctor', text:`Book a visit with your doctor soon: ${see.join('; ')}. Rest and stay hydrated meanwhile.`};
  return {level:'good', title:'Likely OK to recover at home', text:'Rest, drink plenty of fluids and keep logging how you feel. See a doctor if you get worse, develop a high fever, or aren\'t improving after a few days.'};
}

function wireDoseForm(root){
  const f = root.querySelector('#doseForm'); if (!f) return;
  const sel = JSON.parse(JSON.stringify(settings().freqSlots));
  const label = k => SLOTS.find(x => x[0] === k)[1].split(' /')[0];
  const summary = () => [1,2,3,4].forEach(n => {
    const el = f.querySelector(`[data-fsum="${n}"]`), c = (sel[n]||[]).length;
    const times = [...new Set((sel[n]||[]).map(k => f.querySelector(`[name=${k}]`).value))].sort().map(fmtT).join(', ');
    el.innerHTML = c === n ? '· ' + times : `<span style="color:var(--bad)">· pick ${n} (${c} chosen)</span>`;
  });
  f.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => {
    const [n, k] = b.dataset.fs.split('|'); const arr = sel[n] = sel[n] || [];
    const i = arr.indexOf(k); if (i >= 0) arr.splice(i, 1); else { arr.push(k); if (arr.length > +n) { const drop = arr.shift(); f.querySelector(`[data-fs="${n}|${drop}"]`).classList.remove('on'); } }
    b.classList.toggle('on', arr.includes(k)); summary();
  });
  // under each part of the day: how long the window is, or what's wrong with it
  const slotNotes = () => SLOTS.forEach(([k]) => {
    const a = f.querySelector(`[name=${k}]`).value, b = f.querySelector(`[name=${k}_end]`).value, el = f.querySelector(`[data-slotnote="${k}"]`), row = el.closest('.slotrow');
    let msg = '', bad = false;
    if (a && b) {
      const w = (hmToMin(b) - hmToMin(a) + 1440) % 1440;
      if (!w) { msg = "The end time can't be the same as the start."; bad = true; }
      else msg = `${w >= 60 ? Math.floor(w / 60) + ' h' + (w % 60 ? ' ' + (w % 60) + ' min' : '') : w + ' min'} to take it${hmToMin(b) < hmToMin(a) ? ' · ends after midnight' : ''}`;
    }
    el.textContent = msg; el.classList.toggle('bad', bad); row.querySelectorAll('input').forEach(i => i.setAttribute('aria-invalid', bad));
  });
  f.querySelectorAll('input[type=time]').forEach(i => i.oninput = () => { summary(); slotNotes(); });
  summary(); slotNotes();
  f.querySelector('#doseReset').onclick = () => { SLOTS.forEach(([k,,t]) => { f.querySelector(`[name=${k}]`).value = t; f.querySelector(`[name=${k}_end]`).value = addHours(t, MISSED_AFTER_MIN / 60); }); Object.keys(sel).forEach(n => delete sel[n]); Object.assign(sel, JSON.parse(JSON.stringify(DEF_FREQ_SLOTS))); f.querySelectorAll('[data-fs]').forEach(b => { const [n, k] = b.dataset.fs.split('|'); b.classList.toggle('on', sel[n].includes(k)); }); summary(); slotNotes(); };
  f.onsubmit = e => {
    e.preventDefault();
    const bad = [1,2,3,4].filter(n => (sel[n]||[]).length !== n);
    if (bad.length) { toast(`Pick exactly ${bad[0]} time${bad[0]>1?'s':''} for “${bad[0]}× a day”.`); return; }
    const v = readForm(f), s = settings(), oldT = s.doseTimes, newT = {}, newE = {};
    SLOTS.forEach(([k]) => { newT[k] = v[k] || oldT[k]; newE[k] = v[k + '_end'] || s.doseEnds[k]; });
    const same = SLOTS.find(([k]) => newT[k] === newE[k]);
    if (same) { toast(`${same[1]}: the end time can't be the same as the start.`); f.querySelector(`[name=${same[0]}_end]`).focus(); return; }
    const oldFreq = [1,2,3,4].map(n => freqTimes(n));
    save({...s, doseTimes: newT, doseEnds: newE, freqSlots: sel});
    // offer to move existing schedules that use the old times
    const map = {};
    SLOTS.forEach(([k]) => { if (oldT[k] !== newT[k]) map[oldT[k]] = newT[k]; });
    const newFreq = [1,2,3,4].map(n => freqTimes(n));
    const t = today();
    // a schedule that exactly matches an old "N× a day" default follows the new default; otherwise individual slot times are moved
    const after = m => { const fromIns = timesFromText(m.instructions); if (fromIns) return fromIns; const cur = [...(m.times||[])].sort().join(); const i = oldFreq.findIndex(f => f.join() === cur); if (i >= 0 && (m.times||[]).length === i + 1) return newFreq[i]; return [...new Set((m.times||[]).map(x => map[x] || x))].sort(); };
    const hit = list('med').filter(m => (medActiveOn(m, t) || m.start > t) && after(m).join() !== [...(m.times||[])].sort().join());
    if (!hit.length) { toast('Dose times saved.'); return; }

      ${hit.map(m => `<label class="switch" style="cursor:pointer"><input type="checkbox" data-up="${m.id}" checked style="width:20px;height:20px;accent-color:var(--teal)"><div class="main"><div style="font-weight:800">${esc(m.name)} <span class="small">${esc(m.dose||'')}</span></div><div class="small">${m.times.map(fmtT).join(', ')} → <b>${after(m).map(fmtT).join(', ')}</b></div></div></label>`).join('')}

      b.querySelector('#upYes').onclick = () => { let n = 0; b.querySelectorAll('[data-up]').forEach(cb => { const m = get(cb.dataset.up); if (cb.checked && m) { save({...m, times: after(m)}); n++; } }); closeSheet(); toast(`Dose times saved · ${n} medicine${n===1?'':'s'} updated.`); };
    });
  };
}

function checkReminders(){

      toast(`💊 ${whoH}Time to take <b>${esc(d.med.name)}</b>${d.med.dose?' '+esc(d.med.dose):''} (${fmtT(d.time)})`, {label:'Taken', fn: inP(() => { if (!isRecorded(t, d.key)) setDose(t, d.key, {s:'taken', at: Date.now()}); })}, 0, rk);

    }
  });

  const tmr = addDays(t, 1), whenOf = (d, tm) => { const a = parseD(d); const [hh, mm] = (tm || '09:00').split(':').map(Number); a.setHours(hh, mm, 0, 0); return a.getTime(); };
  [...list('visit').filter(v => +v.remind > 0 && v.date >= t && v.date <= tmr).map(v => ({k: v.id, date: v.date, time: v.time, mins: +v.remind, label: v.doctor || apptShort(v), sub: v.facility})),
   ...list('course').filter(c => +c.remind > 0).flatMap(c => courseSessions(c, tmr).filter(o => !o.s && o.date >= t && o.date <= tmr).map(o => ({k: c.id + o.orig, date: o.date, time: o.time, mins: +c.remind, label: `${c.doctor || apptShort(c)} · ${sessionLabel(o)}`, sub: c.facility})))
  ].forEach(a => {
    const at = whenOf(a.date, a.time), k = 'appt:' + pid + a.k + a.date;
    if (Date.now() >= at - a.mins * 60e3 && Date.now() < at && !fired.has(k)) {
      fired.add(k);
      const when = `${a.date === t ? 'today' : 'tomorrow'}${a.time ? ' at ' + fmtT(a.time) : ''}`;
      toast(`📅 ${whoH}<b>${esc(a.label)}</b> ${when}${a.sub ? ' · ' + esc(a.sub) : ''}`, null, 0);
      notify('Appointment reminder', `${who}${a.label} ${when}${a.sub ? ' · ' + a.sub : ''}`);
    }
  });
  const due = liveTimers().filter(x => !x.fired && x.due <= Date.now());
  if (due.length) {
    due.forEach(x => {
      const msg = x.kind === 'food' ? (x.mode === 'within' ? `🍽 Time to eat (${x.sub})` : `🍽 You can eat now (${x.sub})`) : x.kind === 'wait' ? `⏳ Waiting time is over (${x.sub})` : x.kind === 'next' ? `💊 Time to take <b>${esc(x.label.replace(/^Take /, ''))}</b>` : `⏱ ${esc(x.label)} — time's up`;
      toast(whoH + msg, x.kind === 'next' ? {label: 'Taken', fn: inP(() => ACT.timerTake(x.id))} : null, 0);
      notify('Health Monitor', who + msg.replace(/<[^>]+>/g, ''));
    });
    saveTimers((timersRec().items || []).map(x => due.some(y => y.id === x.id) ? {...x, fired: true} : x));
  }
  });
  });
  if (r.water && now.getHours() >= 8 && now.getHours() <= 22) {
    const slot = Math.floor((now.getHours() - 8) / (r.waterEvery||2)), k = 'water:' + t + ':' + slot;
    if (slot > 0 && now.getMinutes() < 5 && (now.getHours()-8) % (r.waterEvery||2) === 0 && !fired.has(k)) { fired.add(k); toast('💧 Time for a glass of water', {label:'+1 glass', fn:() => ACT.water(1)}); notify('Drink water', 'Time for a glass of water'); }
  }
  people().forEach(P => withPerson(P.id, () => {
    if (!settings().remind.period || !cycleOn() || cyPrefs().pause) return;
    const st = cycleStats(); if (!st.last || st.ongoing) return;
    const dd = daysBetween(t, st.next), k = 'cy:' + P.id + t;
    if ((dd === 2 || dd === 0) && now.getHours() >= 9 && !fired.has(k)) { fired.add(k); const who = P.id === 'me' ? '' : P.name + ': '; toast(`🩸 ${esc(who)}Period expected ${dd ? 'in 2 days' : 'today'}`); notify('Cycle', `${who}Period expected ${dd ? 'in 2 days' : 'today'}`); }
  }));
  if (r.sleep) { const k = 'bed:' + t, bm = hmToMin(r.bedtime); if (nm >= bm && nm - bm <= 10 && !fired.has(k)) { fired.add(k); toast('🌙 It\'s bedtime.'); notify('Bedtime', 'Time for bed'); } }
  // sleep routine (Sleep → Health → Routine)
  const sp = slPrefs(), at = (hm, k, fn) => { const m = hmToMin(hm); if (nm >= m && nm - m <= 10 && !fired.has(k + t)) { fired.add(k + t); fn(); } };
  if (r.sleepWind && sp.wind) at(addHours(sp.bed, -sp.wind / 60), 'wind:', () => { toast(`🌙 Time to wind down — bedtime at ${formatTime(sp.bed)}. Dim the lights and put the screens away.`); notify('Wind down', `Bedtime at ${formatTime(sp.bed)}`); });
  if (r.sleepCaff) at(sp.caffeine, 'caff:', () => { toast('☕ Caffeine cut-off — switch to decaf to sleep better tonight.'); notify('Caffeine cut-off', 'Switch to decaf to sleep better tonight'); });
  if (r.sleepLog && !withPerson('me', () => slNight(t))) at(addHours(sp.wake, 1), 'slog:', () => { toast('😴 How did you sleep?', {label: 'Log last night', fn: () => slForm(t)}, 0); notify('Sleep diary', 'How did you sleep? Log last night'); });
}
setInterval(checkReminders, 20000);
setTimeout(checkReminders, 3000);
// re-render once a minute so "due" badges stay current (no writes)
setInterval(() => { if (!$('#sheetRoot').innerHTML && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) render(); }, 60000);

/* ---------------- boot ---------------- */
routeFromHash();
initStore();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
