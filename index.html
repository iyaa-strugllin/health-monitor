    <dl class="kv"><dt>Since</dt><dd>${fmtD(i.start)}${!i.end?` · day ${daysBetween(i.start,today())+1}`:''}</dd><dt>Symptoms</dt><dd>${esc((i.symptoms||[]).join(', ')||'–')}</dd><dt>Severity</dt><dd>${esc(i.severity)}/10</dd>${i.temp?`<dt>Temp</dt><dd>${esc(i.temp)} °C</dd>`:''}${i.notes?`<dt>Notes</dt><dd style="white-space:pre-wrap">${esc(i.notes)}</dd>`:''}${i.end&&i.recoveryNote?`<dt>Recovery</dt><dd>${esc(i.recoveryNote)}</dd>`:''}${caseKv(i)}</dl>
    ${visits.length?`<h3 style="font-size:14px;margin:14px 0 4px">Doctor visits</h3>${visits.map(visitRow).join('')}`:''}
    ${meds.length?`<h3 style="font-size:14px;margin:14px 0 4px">Medication during this time</h3>${meds.map(medRow).join('')}`:''}
    <div class="card" style="box-shadow:none;border:2px solid var(--line);margin-top:12px"><h3>${ic('search','style="width:18px;height:18px;color:var(--teal-d)"')}Look it up</h3>
      <div class="btns"><a class="btn sm out" href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">Search Google ${ic('ext','style="width:14px;height:14px"')}</a><a class="btn sm out" href="https://www.nhs.uk/conditions/" target="_blank" rel="noopener">NHS conditions A–Z ${ic('ext','style="width:14px;height:14px"')}</a></div>
      ${SAMPLE && !i.end ? `<button class="btn sm block" id="ask" style="margin-top:8px">${ic('sparkle','style="width:16px;height:16px"')} Ask Claude: rest at home or see a doctor?</button><div id="askOut"></div>`:''}
    </div>
    <p class="disclaimer">This check is general guidance only, not a diagnosis. Trust your instincts — if you feel very unwell, get medical help.</p>
    <div class="btns" style="margin-top:12px">${!i.end?'<button class="btn sm" id="rec">I\'ve recovered</button>':''}<button class="btn sm sec" id="ed">${ic('edit','style="width:16px;height:16px"')} Update</button><button class="btn sm sec" id="vis">+ Doctor visit</button><button class="btn sm danger" id="dl">${ic('trash','style="width:16px;height:16px"')}</button></div>`, b => {
    const r = b.querySelector('#rec'); if (r) r.onclick = () => recoverSheet(i.id);
    b.querySelector('#ed').onclick = () => sickForm(i);
    b.querySelector('#vis').onclick = () => visitForm({date: today(), facilityType:'Clinic', reason: i.title || (i.symptoms||[]).join(', '), illnessId: i.id});
    b.querySelector('#dl').onclick = () => confirmSheet('Delete this illness record?', () => remove(i.id));
    b.querySelectorAll('[data-act]').forEach(el => { const [n, a] = el.dataset.act.split('|'); el.onclick = e => { e.stopPropagation(); ACT[n](a); }; });
    const ask = b.querySelector('#ask');
    if (ask) ask.onclick = async () => {
      const out = b.querySelector('#askOut'); ask.disabled = true; ask.innerHTML = '<span class="spinner"></span> Thinking…';
      const p = profile();
      const age = p.dob ? Math.floor(daysBetween(p.dob, today())/365.25) : null;
      const prompt = `A person is logging that they feel sick and wants to know whether to rest at home or see a doctor. Give practical, cautious guidance in plain language. Format: one bold first line that is exactly one of "Rest at home", "See a doctor in the next day or two", "Get medical care today", "Call emergency services now"; then 3-5 short bullet points: what may be going on (no definitive diagnosis), self-care tips, and specific warning signs that should make them seek care. Under 140 words. No markdown headings.
Details:
- Symptoms: ${(i.symptoms||[]).join(', ') || 'not specified'}
- Started: ${daysBetween(i.start, today())+1} day(s) ago
- Severity: ${i.severity}/10
- Temperature: ${i.temp ? i.temp+' °C' : 'not measured'}
- Notes: ${i.notes || 'none'}
- Age: ${age ?? 'unknown'}; sex: ${p.sex || 'unknown'}
- Known conditions: ${p.conditions || 'none listed'}; allergies: ${p.allergies || 'none listed'}
- Current medication: ${list('med').filter(m=>medActiveOn(m,today())).map(m=>m.name).join(', ') || 'none'}`;
      try {
        await SAMPLE(prompt, {modelTier:'default', onText: ({text}) => { out.innerHTML = `<div class="alert info" style="margin-top:8px;white-space:pre-wrap">${mdLite(text)}</div>`; }});
      } catch(e) {
        out.innerHTML = `<div class="alert warn" style="margin-top:8px">${e && e.code==='rate_limited'?'Too many requests — try again shortly.':'Couldn\'t get an answer right now.'}</div>`;
      }
      ask.classList.add('hidden');
    };
  });
};
function mdLite(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^[-•]\s?/gm,'• '); }
function recoverSheet(id){
  const i = get(id);
  openSheet('Mark as recovered', `<form id="rf">${formHtml([{k:'end',label:'Recovered on',type:'date',req:true},{k:'recoveryNote',label:'What helped? (optional)',type:'textarea'}], {end: today()})}<button class="btn block" type="submit">Save</button></form>`, b => b.querySelector('#rf').onsubmit = e => {
    e.preventDefault(); const v = readForm(e.target); if (v.end < i.start) v.end = i.start;
    save({...i, ...v}); closeSheet();
    const c = caseOf(i);
    if (c && c.status !== 'closed') toast('Glad you\'re feeling better! Close the case file “'+esc(c.title)+'” too?', {label:'Close case', fn:() => save({...get(c.id), status:'closed', closedOn: v.end})}, 10000);
    else toast('Glad you\'re feeling better!');
  });
}

/* ---- goals, food, exercise, sleep ---- */
const GOAL_FIELDS = [
  {k:'title',label:'Goal',req:true,ph:'e.g. Lose 5 kg'},
  {k:'category',label:'Area',type:'select',opts:['Weight','Fitness','Nutrition','Sleep','Blood pressure','Blood sugar','Mental health','Other'],half:true},{k:'deadline',label:'Target date',type:'date',half:true},
  {k:'current',label:'Current',type:'number',step:'any',half:true},{k:'target',label:'Target',type:'number',step:'any',half:true},
  {k:'unit',label:'Unit',ph:'kg, steps, mmHg…'},
  {k:'notes',label:'Notes / plan',type:'textarea'}
];
ACT.addGoal = () => goalForm({category:'Fitness'});
ACT.editGoal = id => goalForm(get(id));
function goalForm(g){
  openSheet(g.id ? 'Edit goal' : 'New health goal', `<form id="gf">${formHtml(GOAL_FIELDS, g)}<label class="f" style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="done" ${g.done?'checked':''} style="width:20px;height:20px;accent-color:var(--teal);display:inline;margin:0"> Achieved</label><div class="btns"><button class="btn" type="submit" style="flex:1">Save goal</button>${g.id?'<button class="btn danger" type="button" id="dl">Delete</button>':''}</div></form>`, b => {
    b.querySelector('#gf').onsubmit = e => { e.preventDefault(); const v = readForm(e.target); v.done = !!v.done; save({...g, ...v, kind:'goal', id: g.id || 'goal~'+uid()}); closeSheet(); };
    const d = b.querySelector('#dl'); if (d) d.onclick = () => confirmSheet('Delete this goal?', () => remove(g.id));
  });
}
const FOOD_FIELDS = [
  {k:'meal',label:'Meal',type:'select',opts:['Breakfast','Lunch','Dinner','Snack','Drink'],half:true},{k:'date',label:'Date',type:'date',half:true},
  {k:'desc',label:'What did you eat?',req:true,ph:'e.g. Oatmeal with banana'},
  {k:'cal',label:'Calories (kcal, approx.)',type:'number',min:0},
  {k:'notes',label:'Notes',ph:'portion, how you felt…'}
];
const mealNow = () => { const h = new Date().getHours(); return h < 11 ? 'Breakfast' : h < 15 ? 'Lunch' : h < 18 ? 'Snack' : 'Dinner'; };
ACT.addFood = (d) => foodForm({meal: mealNow(), date: typeof d === 'string' ? d : today()});
ACT.editFood = id => foodForm(get(id));
function foodForm(f){
  openSheet(f.id ? 'Edit food' : 'Log food', `<form id="ff2">${formHtml(FOOD_FIELDS, f)}${SAMPLE?'<button type="button" class="btn sm sec" id="est" style="margin:-4px 0 12px">'+ic('sparkle','style="width:15px;height:15px"')+' Estimate calories</button>':''}<div class="btns"><button class="btn" type="submit" style="flex:1">Save</button>${f.id?'<button class="btn danger" type="button" id="dl">Delete</button>':''}</div></form>`, b => {
    b.querySelector('#ff2').onsubmit = e => { e.preventDefault(); save({...f, ...readForm(e.target), kind:'food', id: f.id || 'food~'+uid()}); closeSheet(); toast('Logged.'); };
    const d = b.querySelector('#dl'); if (d) d.onclick = () => confirmSheet('Delete this entry?', () => remove(f.id));
    const est = b.querySelector('#est');
    if (est) est.onclick = async () => {
      const desc = b.querySelector('[name=desc]').value.trim(); if (!desc) { b.querySelector('[name=desc]').focus(); return; }
      est.disabled = true; est.innerHTML = '<span class="spinner" style="border-color:rgba(22,94,88,.3);border-top-color:var(--teal-dd)"></span> Estimating…';
      try { const r = await SAMPLE.json(`Estimate the total calories (kcal) of this food for a typical adult portion: "${desc}". Return ONLY JSON {"kcal": number}.`, {modelTier:'quick'}); if (r && r.kcal) b.querySelector('[name=cal]').value = Math.round(r.kcal); est.innerHTML = '≈ estimated'; }
      catch(e) { est.innerHTML = 'Couldn\'t estimate'; }
    };
  });
}
const EX_TYPES = ['Walking','Running','Cycling','Swimming','Gym / weights','Yoga','Sports','Stretching','Dancing','Other'];
ACT.addEx = () => exForm({date: today(), type:'Walking', minutes: 30});
ACT.editEx = id => exForm(get(id));
function exForm(x){
  openSheet(x.id ? 'Edit exercise' : 'Log exercise', `<form id="xf">${formHtml([{k:'type',label:'Activity',type:'select',opts:EX_TYPES,half:true},{k:'date',label:'Date',type:'date',half:true},{k:'minutes',label:'Minutes',type:'number',min:1,req:true},{k:'notes',label:'Notes',ph:'distance, steps, intensity…'}], x)}<div class="btns"><button class="btn" type="submit" style="flex:1">Save</button>${x.id?'<button class="btn danger" type="button" id="dl">Delete</button>':''}</div></form>`, b => {
    b.querySelector('#xf').onsubmit = e => { e.preventDefault(); save({...x, ...readForm(e.target), kind:'exercise', id: x.id || 'ex~'+uid()}); closeSheet(); toast('Logged.'); };
    const d = b.querySelector('#dl'); if (d) d.onclick = () => confirmSheet('Delete this entry?', () => remove(x.id));
  });
}
ACT.addSleep = () => { const ex = list('sleep').find(s => s.date === today()); sleepForm(ex || {date: today(), bed: settings().remind.bedtime || '23:00', wake: '07:00'}); };
ACT.editSleep = id => sleepForm(get(id));
function sleepForm(x){
  openSheet(x.id ? 'Edit sleep' : 'Log sleep', `<form id="slf">${formHtml([{k:'date',label:'Woke up on',type:'date',req:true},{k:'bed',label:'Went to bed',type:'time',req:true,half:true},{k:'wake',label:'Woke up',type:'time',req:true,half:true},{k:'quality',label:'Quality',type:'select',opts:['','Great','Good','OK','Poor','Very poor']}], x)}<div class="btns"><button class="btn" type="submit" style="flex:1">Save</button>${x.id?'<button class="btn danger" type="button" id="dl">Delete</button>':''}</div></form>`, b => {
    b.querySelector('#slf').onsubmit = e => { e.preventDefault(); const v = readForm(e.target); let h = (hmToMin(v.wake) - hmToMin(v.bed)) / 60; if (h <= 0) h += 24; save({...x, ...v, hours: h, kind:'sleep', id: x.id || 'sleep~'+uid()}); closeSheet(); toast(`${h.toFixed(1)} hours logged.`); };
    const d = b.querySelector('#dl'); if (d) d.onclick = () => confirmSheet('Delete this entry?', () => remove(x.id));
  });
}

/* ---- dose time settings ---- */
function wireDoseForm(root){
  const f = root.querySelector('#doseForm'); if (!f) return;
  const sel = JSON.parse(JSON.stringify(settings().freqSlots));
  const label = k => SLOTS.find(x => x[0] === k)[1].split(' /')[0];
  const summary = () => [1,2,3,4].forEach(n => {
    const el = f.querySelector(`[data-fsum="${n}"]`), c = (sel[n]||[]).length;
    const times = [...new Set((sel[n]||[]).map(k => f.querySelector(`[name=${k}]`).value))].sort().map(fmtT).join(', ');
    el.innerHTML = c === n ? '· ' + times : `<span style="color:var(--bad)">· pick ${n} (${c} chosen)</span>`;
  });
  f.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => {
    const [n, k] = b.dataset.fs.split('|'); const arr = sel[n] = sel[n] || [];
    const i = arr.indexOf(k); if (i >= 0) arr.splice(i, 1); else { arr.push(k); if (arr.length > +n) { const drop = arr.shift(); f.querySelector(`[data-fs="${n}|${drop}"]`).classList.remove('on'); } }
    b.classList.toggle('on', arr.includes(k)); summary();
  });
  f.querySelectorAll('input[type=time]').forEach(i => i.oninput = summary);
  summary();
  f.querySelector('#doseReset').onclick = () => { SLOTS.forEach(([k,,t]) => f.querySelector(`[name=${k}]`).value = t); Object.keys(sel).forEach(n => delete sel[n]); Object.assign(sel, JSON.parse(JSON.stringify(DEF_FREQ_SLOTS))); f.querySelectorAll('[data-fs]').forEach(b => { const [n, k] = b.dataset.fs.split('|'); b.classList.toggle('on', sel[n].includes(k)); }); summary(); };
  f.onsubmit = e => {
    e.preventDefault();
    const bad = [1,2,3,4].filter(n => (sel[n]||[]).length !== n);
    if (bad.length) { toast(`Pick exactly ${bad[0]} time${bad[0]>1?'s':''} for “${bad[0]}× a day”.`); return; }
    const v = readForm(f), s = settings(), oldT = s.doseTimes, newT = {};
    SLOTS.forEach(([k]) => newT[k] = v[k] || oldT[k]);
    const oldFreq = [1,2,3,4].map(n => freqTimes(n));
    save({...s, doseTimes: newT, freqSlots: sel});
    // offer to move existing schedules that use the old times
    const map = {};
    SLOTS.forEach(([k]) => { if (oldT[k] !== newT[k]) map[oldT[k]] = newT[k]; });
    const newFreq = [1,2,3,4].map(n => freqTimes(n));
    const t = today();
    // a schedule that exactly matches an old "N× a day" default follows the new default; otherwise individual slot times are moved
    const after = m => { const fromIns = timesFromText(m.instructions); if (fromIns) return fromIns; const cur = [...(m.times||[])].sort().join(); const i = oldFreq.findIndex(f => f.join() === cur); if (i >= 0 && (m.times||[]).length === i + 1) return newFreq[i]; return [...new Set((m.times||[]).map(x => map[x] || x))].sort(); };
    const hit = list('med').filter(m => (medActiveOn(m, t) || m.start > t) && after(m).join() !== [...(m.times||[])].sort().join());
    if (!hit.length) { toast('Dose times saved.'); return; }
    openSheet('Update your current medicines?', `<div class="small" style="margin-bottom:10px">These medicines are scheduled at your old times. Move them to the new ones?</div>
      ${hit.map(m => `<label class="switch" style="cursor:pointer"><input type="checkbox" data-up="${m.id}" checked style="width:20px;height:20px;accent-color:var(--teal)"><div class="main"><div style="font-weight:800">${esc(m.name)} <span class="small">${esc(m.dose||'')}</span></div><div class="small">${m.times.map(fmtT).join(', ')} → <b>${after(m).map(fmtT).join(', ')}</b></div></div></label>`).join('')}
      <div class="btns" style="margin-top:12px"><button class="btn" id="upYes" style="flex:1">Update selected</button><button class="btn sec" data-close>Keep as is</button></div>`, b => {
      b.querySelector('#upYes').onclick = () => { let n = 0; b.querySelectorAll('[data-up]').forEach(cb => { const m = get(cb.dataset.up); if (cb.checked && m) { save({...m, times: after(m)}); n++; } }); closeSheet(); toast(`Dose times saved · ${n} medicine${n===1?'':'s'} updated.`); };
    });
  };
}

/* ---- form submits delegated (profile, targets) ---- */
document.addEventListener('submit', e => {
  if (e.target.id === 'profForm') { e.preventDefault(); save({...profile(), ...readForm(e.target)}); toast('Profile saved.'); }
  if (e.target.id === 'tgtForm') { e.preventDefault(); const v = readForm(e.target); const s = settings(); save({...s, targets:{cal:+v.cal||2000, water:+v.water||8, exercise:+v.exercise||30, sleep:+v.sleep||8}, remind:{...s.remind, waterEvery: Math.max(1, +v.waterEvery||2), bedtime: v.bedtime||'22:30'}}); toast('Saved.'); }
});

/* ---------------- reminders loop ---------------- */
const fired = new Set();
function notify(title, body){
  try { if (!('Notification' in window) || Notification.permission !== 'granted') return; if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(title, {body, icon:'icon-192.png', badge:'icon-192.png', tag: title + body})); else new Notification(title, {body}); } catch(e) {}
}
function checkReminders(){
  if (storeMode === 'loading') return;
  const s = settings(), r = s.remind, t = today(), now = new Date(), nm = now.getHours()*60 + now.getMinutes();
  const everyone = people();
  everyone.forEach(P => {
  const who = P.id === 'me' ? '' : P.name + ': ', whoH = P.id === 'me' ? '' : `<b>${esc(P.name)}</b> — `;
  const pid = P.id, inP = fn => () => { withPerson(pid, fn); render(); };
  withPerson(pid, () => {
  if (r.meds) dosesFor(t).forEach(d => {
    const k = 'dose:' + pid + t + d.key, dm = hmToMin(d.time);
    if (nm >= dm && nm - dm <= 60 && !isRecorded(t, d.key) && !fired.has(k)) {
      fired.add(k);
      toast(`💊 ${whoH}Time to take <b>${esc(d.med.name)}</b>${d.med.dose?' '+esc(d.med.dose):''} (${fmtT(d.time)})`, {label:'Taken', fn: inP(() => toggleDose(t, d.key))}, 0);
      notify('Medication reminder', `${who}${d.med.name} ${d.med.dose||''} — ${fmtT(d.time)}`);
    }
  });
  const due = liveTimers().filter(x => !x.fired && x.due <= Date.now());
  if (due.length) {
    due.forEach(x => {
      const msg = x.kind === 'food' ? (x.mode === 'within' ? `🍽 Time to eat (${x.sub})` : `🍽 You can eat now (${x.sub})`) : x.kind === 'wait' ? `⏳ Waiting time is over (${x.sub})` : x.kind === 'next' ? `💊 Time to take <b>${esc(x.label.replace(/^Take /, ''))}</b>` : `⏱ ${esc(x.label)} — time's up`;
      toast(whoH + msg, x.kind === 'next' ? {label: 'Taken', fn: inP(() => ACT.timerTake(x.id))} : null, 0);
      notify('Health Monitor', who + msg.replace(/<[^>]+>/g, ''));
    });
    saveTimers((timersRec().items || []).map(x => due.some(y => y.id === x.id) ? {...x, fired: true} : x));
  }
  });
  });
  if (r.water && now.getHours() >= 8 && now.getHours() <= 22) {
    const slot = Math.floor((now.getHours() - 8) / (r.waterEvery||2)), k = 'water:' + t + ':' + slot;
    if (slot > 0 && now.getMinutes() < 5 && (now.getHours()-8) % (r.waterEvery||2) === 0 && !fired.has(k)) { fired.add(k); toast('💧 Time for a glass of water', {label:'+1 glass', fn:() => ACT.water(1)}); notify('Drink water', 'Time for a glass of water'); }
  }
  people().forEach(P => withPerson(P.id, () => {
    if (!settings().remind.period || !cycleOn()) return;
    const st = cycleStats(); if (!st.last || st.ongoing) return;
    const dd = daysBetween(t, st.next), k = 'cy:' + P.id + t;
    if ((dd === 2 || dd === 0) && now.getHours() >= 9 && !fired.has(k)) { fired.add(k); const who = P.id === 'me' ? '' : P.name + ': '; toast(`🩸 ${esc(who)}Period expected ${dd ? 'in 2 days' : 'today'}`); notify('Cycle', `${who}Period expected ${dd ? 'in 2 days' : 'today'}`); }
  }));
  if (r.sleep) { const k = 'bed:' + t, bm = hmToMin(r.bedtime); if (nm >= bm && nm - bm <= 10 && !fired.has(k)) { fired.add(k); toast('🌙 It\'s bedtime — time to wind down.'); notify('Bedtime', 'Time to wind down for sleep'); } }
}
setInterval(checkReminders, 20000);
setTimeout(checkReminders, 3000);
// re-render once a minute so "due" badges stay current (no writes)
setInterval(() => { if (!$('#sheetRoot').innerHTML && document.activeElement?.tagName !== 'INPUT') render(); }, 60000);

/* ---------------- boot ---------------- */
route = ROUTES[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
initStore();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
