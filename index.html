    ${tg(!pr.hideFertile, 'cyPref|hideFertile', 'Show fertile window', 'Turn off if you don’t want to see fertile days')}
    ${tg(pr.pause, 'cyPref|pause', 'Pause predictions', 'For pregnancy, breastfeeding or hormonal contraception — you can still log days')}
  </div>`;
  return `<div class="card">${head}<div class="btns" style="margin-top:12px">${btns}<button class="btn sec" data-act="cyDay|${t}">Log a day</button></div></div>
  <div class="card">${cal}</div>
  ${insights}${fert}${hist}${sets}
  <p class="disclaimer">Predictions are estimates from your own past cycles. Don't rely on them for contraception. See a doctor about very painful, very heavy, or irregular periods. Ideas for this tracker come from the open-source apps drip and Periodical.</p>`;
}
/* log one day: bleeding, symptoms, pain, mood, (temperature, mucus), note */
function cyDayForm(d){
  const r = cyDay(d), pr = cyPrefs(), t = today(), exists = !!R.get(r.id);
  const ps = periods(), prev = [...ps].reverse().find(p => p.start <= d), cd = prev ? daysBetween(prev.start, d) + 1 : null;
  let bleed = r.bleed || '', mood = r.mood || '', mucus = r.mucus || '';
  const sym = new Set(r.symptoms || []);
  const single = (g, opts, cur) => `<div class="chips" role="group" data-grp="${g}" style="margin-bottom:12px">${opts.map(([k, l]) => `<button type="button" class="chip ${k === cur ? 'on' : ''}" data-v="${k}" aria-pressed="${k === cur}">${l}</button>`).join('')}</div>`;
  openSheet(`${d === t ? 'Today' : fmtD(d)}${cd && cd <= 60 ? ' · cycle day ' + cd : ''}`, `<form id="cdf">
    <div class="sect" style="margin-top:0">Bleeding</div>${single('bleed', CY_BLEED, bleed)}
    <div class="sect">Symptoms</div><div class="chips" role="group" aria-label="Symptoms" style="margin-bottom:12px">${CYCLE_SYMPTOMS.map(c => `<button type="button" class="chip ${sym.has(c) ? 'on' : ''}" data-s="${esc(c)}" aria-pressed="${sym.has(c)}">${esc(c)}</button>`).join('')}</div>
    <label class="f">Pain (0–10)<select name="pain"><option value="">— not recorded —</option>${[...Array(11).keys()].map(i => `<option value="${i}" ${String(r.pain ?? '') === String(i) ? 'selected' : ''}>${i}${i === 0 ? ' – none' : i === 10 ? ' – worst' : ''}</option>`).join('')}</select></label>
    <div class="sect" style="margin-top:0">Mood</div>${single('mood', CY_MOODS, mood)}
    ${pr.fertility ? `<div class="grid2"><label class="f">Waking temperature (°C)<input name="temp" type="number" inputmode="decimal" step="0.01" min="34" max="42" value="${esc(r.temp || '')}" placeholder="e.g. 36.45"></label><div></div></div>
      <div class="sect" style="margin-top:0">Cervical mucus</div>${single('mucus', CY_MUCUS, mucus)}` : ''}
    <label class="f">Note<textarea name="note" placeholder="Anything else about today">${esc(r.note || '')}</textarea></label>
    <button class="btn block cybtn" type="submit">Save</button>
    ${exists ? '<div style="text-align:center;margin-top:10px"><button type="button" class="link" id="cdClear" style="color:var(--bad);padding:8px">Clear this day</button></div>' : ''}
  </form>`, b => {
    const f = b.querySelector('#cdf');
    const pick = (g, set) => f.querySelectorAll(`[data-grp="${g}"] [data-v]`).forEach(x => x.onclick = () => { const v = set(x.dataset.v); f.querySelectorAll(`[data-grp="${g}"] [data-v]`).forEach(y => { y.classList.toggle('on', y.dataset.v === v); y.setAttribute('aria-pressed', y.dataset.v === v); }); });
    pick('bleed', v => (bleed = bleed === v ? '' : v)); pick('mood', v => (mood = mood === v ? '' : v)); pick('mucus', v => (mucus = mucus === v ? '' : v));
    f.querySelectorAll('[data-s]').forEach(x => x.onclick = () => { const k = x.dataset.s; sym.has(k) ? sym.delete(k) : sym.add(k); x.classList.toggle('on', sym.has(k)); x.setAttribute('aria-pressed', sym.has(k)); });
    f.onsubmit = e => {
      e.preventDefault(); const v = readForm(f);
      const rec = {...r, bleed, mood, symptoms: [...sym], pain: v.pain === '' ? '' : +v.pain, note: v.note || '', ...(pr.fertility ? {temp: v.temp ? +(+v.temp).toFixed(2) : '', mucus} : {})};
      const empty = !rec.bleed && !rec.mood && !rec.symptoms.length && rec.pain === '' && !rec.note && !rec.temp && !rec.mucus;
      if (empty) { if (exists) remove(r.id); } else save(rec);
      closeSheet(); toast(empty ? 'Day cleared.' : `${d === t ? 'Today' : fmtDs(d)} saved.`);
    };
    const cl = b.querySelector('#cdClear'); if (cl) cl.onclick = () => { remove(r.id); closeSheet(); toast('Day cleared.'); };
  });
}
function barChart(days, vals, target, unit){

VIEWS.calendar = () => {

  const start = new Date(y, m-1, 1 - startDow);
  const t = today();
  const cells = [];
  for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate()+i); cells.push(iso(d)); }
  const visits = list('visit'), ills = list('illness'), files = list('file');
  const sess = allSessions(addDays(UI.calMonth + '-01', 45)).filter(o => o.s !== 'cancelled');
  const dots = d => {
    const out = [];
    if (visits.some(v=>v.date===d) || sess.some(o=>o.date===d)) out.push('var(--info)');
    if (ills.some(i=>i.start<=d && (i.end||t)>=d && d<=t)) out.push('var(--bad)');
    if (dosesFor(d).length) out.push('var(--teal)');
    if (files.some(f=>f.date===d)) out.push('var(--warn)');
    return out;
  };
  const sel = UI.calSel;
  const dv = visits.filter(v=>v.date===sel), di = ills.filter(i=>i.start<=sel && (i.end||t)>=sel && sel<=t), df = files.filter(f=>f.date===sel), dd = dosesFor(sel);
  const started = list('med').filter(x=>x.prescribedOn===sel);
  return `<div class="card">

    <div class="cal">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<div class="dh">${d}</div>`).join('')}
    ${cells.map(d => `<div class="d ${d.slice(0,7)!==UI.calMonth?'o':''} ${d===t?'today':''} ${d===sel?'sel':''}" data-act="calSel|${d}">${+d.slice(8)}<span class="dots">${dots(d).slice(0,4).map(c=>`<i style="background:${d===sel?'#fff':c}"></i>`).join('')}</span></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--info)"></i>Appointment</span><span><i style="background:var(--teal)"></i>Medication</span><span><i style="background:var(--bad)"></i>Sick</span><span><i style="background:var(--warn)"></i>Record</span></div>
  </div>
  <div class="card"><h3>${fmtD(sel)}</h3>
    ${dv.map(visitRow).join('')}
    ${sess.filter(o => o.date === sel).sort(byWhen).map(sessionRow).join('')}
    ${di.map(illRow).join('')}
    ${started.map(x=>`<div class="row click" data-act="viewMed|${x.id}"><div class="medic">${ic('note')}</div><div class="main"><div class="ttl">Prescribed: ${esc(x.name)}</div><div class="sub">${esc([x.doctor,x.facility].filter(Boolean).join(' · '))}</div></div></div>`).join('')}
    ${dd.length ? doseRows(sel, dd) : ''}

};

  ['appts', 'Appointments', ['visit']],
  ['files', 'Records & photos', ['file']],
  ['notes', 'Notes', ['note']],
  ['cycle', 'Cycle days', ['cyday']],
  ['allergies', 'Allergies', ['allergy']],
  ['cases', 'Case files', ['case']],
  ['profile', 'Profile (name, conditions, emergency contact)', ['profile']],

function careNeutral(r, pid){

function careLocal(r, pid){

function timesFromText(t){

function shrinkImage(file, max, q=0.85){
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      if (s === 1 && file.size < 1.5e6 && q >= 0.85) return res(file);
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || file), 'image/jpeg', q);
    };
    img.onerror = () => res(file);
    img.src = URL.createObjectURL(file);
  });
}

}

const SYMPTOMS = ['Fever','Cough','Sore throat','Runny nose','Headache','Body aches','Fatigue','Nausea','Vomiting','Diarrhea','Stomach pain','Dizziness','Rash','Chills','Loss of taste/smell','Shortness of breath','Chest pain','Ear pain','Back pain','Painful urination'];
const RED_FLAGS = [
  {s:['Chest pain'], m:'Chest pain'},
  {s:['Shortness of breath'], m:'Difficulty breathing'},
];
const RED_TEXT = /(faint|unconscious|seizure|confus|stiff neck|blood|bleed|can'?t breathe|severe|worst headache|slurred|numb|weak(ness)? on one side|suicid|swelling of (the )?(face|lips|tongue|throat))/i;
function triage(i){
  const t = today(), days = daysBetween(i.start, t) + 1;
  const flags = [];
  RED_FLAGS.forEach(r => { if (r.s.every(s => (i.symptoms||[]).includes(s))) flags.push(r.m); });
  const tmp = parseFloat(i.temp);
  if (tmp >= 39.4) flags.push(`High fever (${tmp} °C)`);
  if (+i.severity >= 9) flags.push('Very severe symptoms');
  const tm = (i.notes||'').match(RED_TEXT); if (tm) flags.push(`“${tm[0]}” mentioned`);
  if (flags.length) return {level:'bad', title:'Seek medical care now', text:`Because of: ${flags.join(', ')}. Contact a doctor or go to urgent care today. If symptoms are severe or getting worse fast, call your local emergency number.`};
  const see = [];
  if (tmp >= 38 && days >= 3) see.push('fever lasting 3+ days');
  if (days >= 7) see.push('symptoms for over a week');
  if (+i.severity >= 7) see.push('high severity');
  if ((i.symptoms||[]).some(s => ['Vomiting','Diarrhea'].includes(s)) && days >= 2) see.push('vomiting/diarrhea for 2+ days (dehydration risk)');
  if ((i.symptoms||[]).includes('Painful urination')) see.push('possible urinary infection');
  if ((i.symptoms||[]).includes('Ear pain') && days >= 3) see.push('ear pain for 3+ days');
  const p = profile();
  if (p.conditions) see.push('you have a long-term condition (' + p.conditions.slice(0,40) + ')');
  if (see.length) return {level:'warn', title:'Consider seeing a doctor', text:`Book a visit with your doctor soon: ${see.join('; ')}. Rest and stay hydrated meanwhile.`};
  return {level:'good', title:'Likely OK to recover at home', text:'Rest, drink plenty of fluids and keep logging how you feel. See a doctor if you get worse, develop a high fever, or aren\'t improving after a few days.'};
}

function wireDoseForm(root){
  const f = root.querySelector('#doseForm'); if (!f) return;
  const sel = JSON.parse(JSON.stringify(settings().freqSlots));
  const label = k => SLOTS.find(x => x[0] === k)[1].split(' /')[0];
  const summary = () => [1,2,3,4].forEach(n => {
    const el = f.querySelector(`[data-fsum="${n}"]`), c = (sel[n]||[]).length;
    const times = [...new Set((sel[n]||[]).map(k => f.querySelector(`[name=${k}]`).value))].sort().map(fmtT).join(', ');
    el.innerHTML = c === n ? '· ' + times : `<span style="color:var(--bad)">· pick ${n} (${c} chosen)</span>`;
  });
  f.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => {
    const [n, k] = b.dataset.fs.split('|'); const arr = sel[n] = sel[n] || [];
    const i = arr.indexOf(k); if (i >= 0) arr.splice(i, 1); else { arr.push(k); if (arr.length > +n) { const drop = arr.shift(); f.querySelector(`[data-fs="${n}|${drop}"]`).classList.remove('on'); } }
    b.classList.toggle('on', arr.includes(k)); summary();
  });
  // under each part of the day: how long the window is, or what's wrong with it
  const slotNotes = () => SLOTS.forEach(([k]) => {
    const a = f.querySelector(`[name=${k}]`).value, b = f.querySelector(`[name=${k}_end]`).value, el = f.querySelector(`[data-slotnote="${k}"]`), row = el.closest('.slotrow');
    let msg = '', bad = false;
    if (a && b) {
      const w = (hmToMin(b) - hmToMin(a) + 1440) % 1440;
      if (!w) { msg = "The end time can't be the same as the start."; bad = true; }
      else msg = `${w >= 60 ? Math.floor(w / 60) + ' h' + (w % 60 ? ' ' + (w % 60) + ' min' : '') : w + ' min'} to take it${hmToMin(b) < hmToMin(a) ? ' · ends after midnight' : ''}`;
    }
    el.textContent = msg; el.classList.toggle('bad', bad); row.querySelectorAll('input').forEach(i => i.setAttribute('aria-invalid', bad));
  });
  f.querySelectorAll('input[type=time]').forEach(i => i.oninput = () => { summary(); slotNotes(); });
  summary(); slotNotes();
  f.querySelector('#doseReset').onclick = () => { SLOTS.forEach(([k,,t]) => { f.querySelector(`[name=${k}]`).value = t; f.querySelector(`[name=${k}_end]`).value = addHours(t, MISSED_AFTER_MIN / 60); }); Object.keys(sel).forEach(n => delete sel[n]); Object.assign(sel, JSON.parse(JSON.stringify(DEF_FREQ_SLOTS))); f.querySelectorAll('[data-fs]').forEach(b => { const [n, k] = b.dataset.fs.split('|'); b.classList.toggle('on', sel[n].includes(k)); }); summary(); slotNotes(); };
  f.onsubmit = e => {
    e.preventDefault();
    const bad = [1,2,3,4].filter(n => (sel[n]||[]).length !== n);
    if (bad.length) { toast(`Pick exactly ${bad[0]} time${bad[0]>1?'s':''} for “${bad[0]}× a day”.`); return; }
    const v = readForm(f), s = settings(), oldT = s.doseTimes, newT = {}, newE = {};
    SLOTS.forEach(([k]) => { newT[k] = v[k] || oldT[k]; newE[k] = v[k + '_end'] || s.doseEnds[k]; });
    const same = SLOTS.find(([k]) => newT[k] === newE[k]);
    if (same) { toast(`${same[1]}: the end time can't be the same as the start.`); f.querySelector(`[name=${same[0]}_end]`).focus(); return; }
    const oldFreq = [1,2,3,4].map(n => freqTimes(n));
    save({...s, doseTimes: newT, doseEnds: newE, freqSlots: sel});
    // offer to move existing schedules that use the old times
    const map = {};
    SLOTS.forEach(([k]) => { if (oldT[k] !== newT[k]) map[oldT[k]] = newT[k]; });
    const newFreq = [1,2,3,4].map(n => freqTimes(n));
    const t = today();
    // a schedule that exactly matches an old "N× a day" default follows the new default; otherwise individual slot times are moved
    const after = m => { const fromIns = timesFromText(m.instructions); if (fromIns) return fromIns; const cur = [...(m.times||[])].sort().join(); const i = oldFreq.findIndex(f => f.join() === cur); if (i >= 0 && (m.times||[]).length === i + 1) return newFreq[i]; return [...new Set((m.times||[]).map(x => map[x] || x))].sort(); };
    const hit = list('med').filter(m => (medActiveOn(m, t) || m.start > t) && after(m).join() !== [...(m.times||[])].sort().join());
    if (!hit.length) { toast('Dose times saved.'); return; }
    openSheet('Update your current medicines?', `<div class="small" style="margin-bottom:10px">These medicines are scheduled at your old times. Move them to the new ones?</div>
      ${hit.map(m => `<label class="switch" style="cursor:pointer"><input type="checkbox" data-up="${m.id}" checked style="width:20px;height:20px;accent-color:var(--teal)"><div class="main"><div style="font-weight:800">${esc(m.name)} <span class="small">${esc(m.dose||'')}</span></div><div class="small">${m.times.map(fmtT).join(', ')} → <b>${after(m).map(fmtT).join(', ')}</b></div></div></label>`).join('')}
      <div class="btns" style="margin-top:12px"><button class="btn" id="upYes" style="flex:1">Update selected</button><button class="btn sec" data-close>Keep as is</button></div>`, b => {
      b.querySelector('#upYes').onclick = () => { let n = 0; b.querySelectorAll('[data-up]').forEach(cb => { const m = get(cb.dataset.up); if (cb.checked && m) { save({...m, times: after(m)}); n++; } }); closeSheet(); toast(`Dose times saved · ${n} medicine${n===1?'':'s'} updated.`); };
    });
  };
}

/* ---- form submits delegated (profile, targets) ---- */
document.addEventListener('submit', e => {
  if (e.target.id === 'profForm') { e.preventDefault(); save({...profile(), ...readForm(e.target)}); toast('Profile saved.'); }
  if (e.target.id === 'tgtForm') { e.preventDefault(); const v = readForm(e.target); const s = settings(); save({...s, targets:{cal:+v.cal||2000, water:+v.water||8, exercise:+v.exercise||30, sleep:+v.sleep||8}, remind:{...s.remind, waterEvery: Math.max(1, +v.waterEvery||2), bedtime: v.bedtime||'22:30'}}); toast('Saved.'); }
});

/* ---------------- reminders loop ---------------- */
const fired = new Set();
function notify(title, body, tag){
  try { if (!('Notification' in window) || Notification.permission !== 'granted') return; if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(title, {body, icon:'icon-192.png', badge:'icon-192.png', tag: tag || title + body})); else new Notification(title, {body, tag: tag || undefined}); } catch(e) {}
}
/* a dose reminder goes away as soon as that dose is recorded — however it was recorded */
function clearDoneReminders(){
  document.querySelectorAll('#toasts .toast[data-key^="dose|"]').forEach(el => {
    const [, pid, d, key] = el.dataset.key.split('|');
    if (withPerson(pid, () => isRecorded(d, key))) {
      el.remove();
      try { if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.getNotifications({tag: el.dataset.key})).then(ns => ns.forEach(n => n.close())).catch(() => {}); } catch(e) {}
    }
  });
}
function checkReminders(){
  if (storeMode === 'loading') return;
  const s = settings(), r = s.remind, t = today(), now = new Date(), nm = now.getHours()*60 + now.getMinutes();
  const everyone = people();
  everyone.forEach(P => {
  const who = P.id === 'me' ? '' : P.name + ': ', whoH = P.id === 'me' ? '' : `<b>${esc(P.name)}</b> — `;
  const pid = P.id, inP = fn => () => { withPerson(pid, fn); render(); };
  withPerson(pid, () => {
  if (r.meds) dosesFor(t).forEach(d => {
    const k = 'dose:' + pid + t + d.key, dm = hmToMin(d.time);
    if (nm >= dm && nm - dm <= 60 && !isRecorded(t, d.key) && !fired.has(k)) {
      fired.add(k);
      const rk = `dose|${pid}|${t}|${d.key}`;
      // "Taken" only ever marks it taken — it must never un-tick a dose that was ticked elsewhere
      toast(`💊 ${whoH}Time to take <b>${esc(d.med.name)}</b>${d.med.dose?' '+esc(d.med.dose):''} (${fmtT(d.time)})`, {label:'Taken', fn: inP(() => { if (!isRecorded(t, d.key)) setDose(t, d.key, {s:'taken', at: Date.now()}); })}, 0, rk);
      notify('Medication reminder', `${who}${d.med.name} ${d.med.dose||''} — ${fmtT(d.time)}`, rk);
    }
  });
  // appointment & session reminders ("Remind me" on the appointment)
  const tmr = addDays(t, 1), whenOf = (d, tm) => { const a = parseD(d); const [hh, mm] = (tm || '09:00').split(':').map(Number); a.setHours(hh, mm, 0, 0); return a.getTime(); };
  [...list('visit').filter(v => +v.remind > 0 && v.date >= t && v.date <= tmr).map(v => ({k: v.id, date: v.date, time: v.time, mins: +v.remind, label: v.doctor || apptShort(v), sub: v.facility})),
   ...list('course').filter(c => +c.remind > 0).flatMap(c => courseSessions(c, tmr).filter(o => !o.s && o.date >= t && o.date <= tmr).map(o => ({k: c.id + o.orig, date: o.date, time: o.time, mins: +c.remind, label: `${c.doctor || apptShort(c)} · ${sessionLabel(o)}`, sub: c.facility})))
  ].forEach(a => {
    const at = whenOf(a.date, a.time), k = 'appt:' + pid + a.k + a.date;
    if (Date.now() >= at - a.mins * 60e3 && Date.now() < at && !fired.has(k)) {
      fired.add(k);
      const when = `${a.date === t ? 'today' : 'tomorrow'}${a.time ? ' at ' + fmtT(a.time) : ''}`;
      toast(`📅 ${whoH}<b>${esc(a.label)}</b> ${when}${a.sub ? ' · ' + esc(a.sub) : ''}`, null, 0);
      notify('Appointment reminder', `${who}${a.label} ${when}${a.sub ? ' · ' + a.sub : ''}`);
    }
  });
  const due = liveTimers().filter(x => !x.fired && x.due <= Date.now());
  if (due.length) {
    due.forEach(x => {
      const msg = x.kind === 'food' ? (x.mode === 'within' ? `🍽 Time to eat (${x.sub})` : `🍽 You can eat now (${x.sub})`) : x.kind === 'wait' ? `⏳ Waiting time is over (${x.sub})` : x.kind === 'next' ? `💊 Time to take <b>${esc(x.label.replace(/^Take /, ''))}</b>` : `⏱ ${esc(x.label)} — time's up`;
      toast(whoH + msg, x.kind === 'next' ? {label: 'Taken', fn: inP(() => ACT.timerTake(x.id))} : null, 0);
      notify('Health Monitor', who + msg.replace(/<[^>]+>/g, ''));
    });
    saveTimers((timersRec().items || []).map(x => due.some(y => y.id === x.id) ? {...x, fired: true} : x));
  }
  });
  });
  if (r.water && now.getHours() >= 8 && now.getHours() <= 22) {
    const slot = Math.floor((now.getHours() - 8) / (r.waterEvery||2)), k = 'water:' + t + ':' + slot;
    if (slot > 0 && now.getMinutes() < 5 && (now.getHours()-8) % (r.waterEvery||2) === 0 && !fired.has(k)) { fired.add(k); toast('💧 Time for a glass of water', {label:'+1 glass', fn:() => ACT.water(1)}); notify('Drink water', 'Time for a glass of water'); }
  }
  people().forEach(P => withPerson(P.id, () => {
    if (!settings().remind.period || !cycleOn() || cyPrefs().pause) return;
    const st = cycleStats(); if (!st.last || st.ongoing) return;
    const dd = daysBetween(t, st.next), k = 'cy:' + P.id + t;
    if ((dd === 2 || dd === 0) && now.getHours() >= 9 && !fired.has(k)) { fired.add(k); const who = P.id === 'me' ? '' : P.name + ': '; toast(`🩸 ${esc(who)}Period expected ${dd ? 'in 2 days' : 'today'}`); notify('Cycle', `${who}Period expected ${dd ? 'in 2 days' : 'today'}`); }
  }));
  if (r.sleep) { const k = 'bed:' + t, bm = hmToMin(r.bedtime); if (nm >= bm && nm - bm <= 10 && !fired.has(k)) { fired.add(k); toast('🌙 It\'s bedtime — time to wind down.'); notify('Bedtime', 'Time to wind down for sleep'); } }
}
setInterval(checkReminders, 20000);
setTimeout(checkReminders, 3000);
// re-render once a minute so "due" badges stay current (no writes)
setInterval(() => { if (!$('#sheetRoot').innerHTML && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) render(); }, 60000);

/* ---------------- boot ---------------- */
route = ROUTES[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
initStore();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
