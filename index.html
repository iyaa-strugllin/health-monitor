<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3bb3a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Health">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Health Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#3bb3a8; --teal-d:#23867d; --teal-dd:#165e58; --teal-l:#dff4f1; --teal-ll:#f1faf8;
  --bg:#e6f6f3; --card:#ffffff; --ink:#1f2d33; --ink2:#4f6168; --muted:#7f9096; --line:#d5e7e4;
  --good:#2f9e5b; --warn:#c98a12; --bad:#d0463b; --info:#3a7bd5;
  --r:16px; --shadow:0 2px 10px rgba(30,90,85,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100%;background:var(--teal-ll);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(30,90,85,.12)}
header.top{position:sticky;top:0;z-index:20;background:var(--teal-l);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;flex:1;text-align:center;font-weight:800;letter-spacing:.2px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.ghost{background:transparent;box-shadow:none}
main{flex:1;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
.sync{font-size:12px;color:var(--muted);text-align:center;margin:-4px 0 10px}
.sync.warn{color:var(--warn)}
/* nav */
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;font-weight:700;padding:4px 0}
nav.bottom a svg{width:22px;height:22px}
nav.bottom a.on{color:var(--teal-d)}
nav.bottom a.center .bub{width:54px;height:54px;border-radius:50%;background:var(--teal);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px rgba(59,179,168,.45);border:4px solid #fff}
nav.bottom a.center .bub svg{width:28px;height:28px;color:#fff}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.link{color:var(--teal-d);font-weight:700;font-size:13px;background:none;border:0;cursor:pointer;padding:0;text-decoration:none}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.hello .t{font-size:13px;color:var(--muted)} .hello .n{font-size:19px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:13px;text-align:center}
.tile:hover{border-color:var(--teal)}
.tile .ic{width:44px;height:44px;border-radius:14px;background:var(--teal-l);display:grid;place-items:center;color:var(--teal-d)}
.tile .ic svg{width:24px;height:24px}
.tile.hot{background:var(--teal);border-color:var(--teal);color:#fff}
.tile.hot .ic{background:rgba(255,255,255,.2);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--teal-ll);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:17px;font-weight:800}
.stat span{font-size:11px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--muted)}
.row.click{cursor:pointer}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--teal-l);color:var(--teal-dd)}
.pill.bad{background:#fbe3e1;color:#9b2c23}.pill.warn{background:#fbf0d9;color:#7d5608}.pill.good{background:#dff3e6;color:#1d6b3c}.pill.grey{background:#eef1f2;color:#5b6b70}
.medic{width:40px;height:40px;border-radius:12px;background:var(--teal-l);display:grid;place-items:center;color:var(--teal-d);flex:none}
.medic svg{width:22px;height:22px}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--teal);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none;color:#fff}
.chk.on{background:var(--teal)}
.chk svg{width:18px;height:18px}
.bar{height:8px;background:var(--teal-l);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 6px}
.btn{border:0;background:var(--teal);color:#fff;font-weight:800;border-radius:999px;padding:11px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.3px}
.btn:hover{background:var(--teal-d)}
.btn.block{width:100%}
.btn.sec{background:var(--teal-l);color:var(--teal-dd)}
.btn.out{background:#fff;color:var(--teal-dd);border:2px solid var(--teal)}
.btn.danger{background:#fbe3e1;color:#9b2c23}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;margin-bottom:12px;box-shadow:var(--shadow);overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--teal);color:#fff}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.search input{border:0;outline:0;flex:1;background:none}
.search svg{width:18px;height:18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.alert.bad{background:#fbe3e1;color:#7a221b;border:1px solid #f1bdb7}
.alert.warn{background:#fbf0d9;color:#6b4a07;border:1px solid #efd9a6}
.alert.good{background:#dff3e6;color:#1a5c34;border:1px solid #b9e2c7}
.alert.info{background:var(--teal-l);color:var(--teal-dd);border:1px solid #bfe6e0}
.alert b{display:block;margin-bottom:3px}
.small{font-size:12px;color:var(--muted)}
/* forms */
.sheet-bg{position:fixed;inset:0;background:rgba(20,45,45,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:440px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:44px;height:5px;background:var(--line);border-radius:9px;margin:4px auto 10px}
.sheet h2{font-size:18px;margin:0 0 12px;font-weight:800;display:flex;align-items:center}
.sheet h2 span{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
label.f{display:block;margin-bottom:10px;font-size:12.5px;font-weight:700;color:var(--ink2)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;border:2px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--teal-ll);outline:0;font-weight:600;font-size:14.5px}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--teal);background:#fff}
label.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.times input{width:auto!important;display:inline-block!important;margin:0!important}
.switch{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.switch .main{flex:1}
.tog{width:46px;height:28px;border-radius:99px;background:#cfdcdb;position:relative;cursor:pointer;border:0;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.tog.on{background:var(--teal)}
.tog.on::after{left:21px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;position:relative}
.cal .d.o{color:#b9c6c8}
.cal .d.today{outline:2px solid var(--teal)}
.cal .d.sel{background:var(--teal);color:#fff}
.cal .dots{display:flex;gap:2px;height:5px;margin-top:2px}
.cal .dots i{width:5px;height:5px;border-radius:50%}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead b{flex:1;text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
/* chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding:6px 2px 0;border-bottom:1px solid var(--line);position:relative}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:default}
.chart .col .b{width:60%;max-width:26px;background:var(--teal);border-radius:4px 4px 0 0;min-height:2px}
.chart .col:hover .b{background:var(--teal-d)}
.chart .col .tip{position:absolute;bottom:calc(100% - 4px);background:var(--ink);color:#fff;font-size:11px;padding:3px 6px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateY(-4px)}
.chart .col:hover .tip{opacity:1}
.chart .tline{position:absolute;left:0;right:0;border-top:1.5px dashed #9fb7b4;pointer-events:none}
.chart .tline span{position:absolute;right:0;top:-16px;font-size:10.5px;color:var(--muted)}
.xl{display:flex;gap:8px;padding:4px 2px 0}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
/* files */
.thumb{width:48px;height:48px;border-radius:10px;background:var(--teal-l);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--teal-d)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:24px;height:24px}
.viewer img{max-width:100%;border-radius:12px;display:block;margin:0 auto 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0}
/* toast */
#toasts{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:416px;z-index:80;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none}
.toast{pointer-events:auto}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s}
.toast .main{flex:1;font-size:14px}
.toast button{background:var(--teal);color:#fff;border:0;border-radius:99px;padding:6px 10px;font-weight:800;cursor:pointer;font-size:12.5px}
.toast button.x{background:transparent;color:#cfe;padding:4px 6px}
.menu .row{cursor:pointer}
.menu .row svg{width:22px;height:22px;color:var(--teal-d)}
.disclaimer{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.ocrbox{border:2px dashed var(--teal);border-radius:14px;padding:14px;text-align:center;background:var(--teal-ll);margin-bottom:12px}
.hidden{display:none!important}
:root{--cy:#d4517e}
.cyhead{display:flex;gap:14px;align-items:center}
.cyring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex:none}
.cyring>div{width:88px;height:88px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cyring b{font-size:19px;color:#8c2343}.cyring span{font-size:11px;color:var(--muted)}
.cyinfo{display:flex;flex-direction:column;gap:6px;font-size:13px}.cyinfo span{display:block;color:var(--muted);font-size:11.5px;font-weight:700}
.cybtn{background:var(--cy)}.cybtn:hover{background:#b23d66}
.cal .d.cy-period{background:var(--cy);color:#fff}
.cal .d.cy-predicted{background:#fbe3ea;color:#8c2343;outline:1.5px dashed var(--cy);outline-offset:-3px}
.cal .d.cy-fertile{background:#e3eefc;color:#2b4f8f}
.cal .d.cy-ovulation{background:#5b7fd6;color:#fff}
.cal .d.cy-period.today,.cal .d.cy-ovulation.today{outline:2px solid var(--ink)}
.cyclealert{background:#fbe9ef;border-color:#f3c3d3;color:#7a2141}
.avatar.sm{width:40px;height:40px;font-size:15px}
.avatar.xs{width:30px;height:30px;font-size:12px;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800}
.pbanner{display:flex;align-items:center;gap:8px;color:#fff;border-radius:14px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.pbanner button{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:99px;padding:5px 10px;font-weight:800;cursor:pointer}
.rule{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--teal-ll);border:2px solid var(--line);border-radius:12px;padding:6px 8px;margin-bottom:6px;font-size:13.5px;font-weight:700}
.rule input,.rule select{border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;font-weight:700;font-size:13px}
.tmr.ready .ttl{color:var(--good)}
.tmr.ready .bar i{background:var(--good)}
.timers{border:2px solid #cfe9e5}
.grp{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;color:var(--teal-dd);background:var(--teal-ll);border-radius:10px;padding:6px 10px;margin:10px 0 2px}
.grp.warn{color:#7d4c08;background:#fdf3e1}
.grp:first-child{margin-top:0}
.chip.sm{padding:4px 10px;font-size:12px}
.scrollchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scrollchips::-webkit-scrollbar{display:none}
.scrollchips .chip{flex:none}
ol.steps{padding-left:20px;margin:0 0 14px}ol.steps li{margin-bottom:14px;font-size:14px}
.pill.rep{background:#ece8f8;color:#4b3a8c}
.prnrow .btn{white-space:nowrap}
.skipb{border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer}
.skipb:hover{border-color:var(--bad);color:var(--bad)}
h3 .pill{white-space:nowrap}
.row.dimmed .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.optcard{border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.optcard h4{margin:0 0 6px;font-size:14.5px}
.pill.food{background:#e4f3e9;color:#1d6b3c}.pill.food.pre{background:#fdf0dc;color:#7d4c08}.pill.food.any{background:#eef1f2;color:#4b5b60}
.pill.foodq{border:1.5px dashed #c98a12;background:#fffaf0;color:#7d5608;cursor:pointer;font:inherit;font-size:11px;font-weight:800}
.foodbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.foodbtns .btn{padding:12px 8px}
.pill.case{background:#e7eefc;color:#2b4f8f}
.casehead{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff}
.casehead h3{color:#fff;font-size:18px}
.casehead .small{color:rgba(255,255,255,.85)}
.casehead .stat{background:rgba(255,255,255,.16)}
.casehead .stat span{color:rgba(255,255,255,.85)}
.sect{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 2px 6px}
.medgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.medgrid input,.medgrid select{display:block;margin-top:3px;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--teal-ll);width:100%;font-size:13.5px;font-weight:600}
.rxmed{border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.rxmed.off{opacity:.5}
/* Timer + Hide taken, under the Meds calendar */
.daytools{display:flex;align-items:center;gap:6px}
.takentog{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:800;padding:5px 10px;min-height:30px}
.takentog:focus-visible,.timerbtn:focus-visible{outline:2px solid #2e7d70;outline-offset:2px}
.timerbtn{width:34px;height:34px;border-radius:50%;font-size:17px;line-height:1;background:var(--teal-ll);box-shadow:none}
.timerbtn:hover{background:var(--teal-l)}
[data-csum] b{display:block;margin-bottom:2px}
/* Settings → Dose times: each part of the day as start – end */
.slots{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.slotname{font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:5px}
.slotin{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.slotin span{font-weight:800;color:var(--muted)}
.slotin input{width:100%;min-width:0;height:46px;border:2px solid var(--line);border-radius:12px;padding:0 10px;background:var(--teal-ll);font-weight:700;font-size:14.5px;outline:0}
.slotin input:focus{border-color:var(--teal);background:#fff}
.slotin input[aria-invalid=true]{border-color:var(--bad);background:#fff}
.slotnote{margin-top:4px}
.slotnote.bad{color:var(--bad);font-weight:700}
.slotnote:empty{display:none}
.orline{display:flex;align-items:center;gap:10px;margin:14px 0 12px;color:var(--muted);font-size:12px;font-weight:700}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}
/* Cycle tracker */
.cycal button.d{border:0;background:none;font:inherit;font-weight:700;font-size:13px;color:inherit;padding:0}
.cycal .d.fut{cursor:default}
.cycal .d:focus-visible{outline:2px solid #2e7d70;outline-offset:1px}
.cal .d.cy-period.cyf-light{background:#e993b1;color:#fff}
.cal .d.cy-period.cyf-heavy{background:#a82c58;color:#fff}
.cal .d.cy-spotting{background:#fde8ef;color:#8c2343;box-shadow:inset 0 0 0 1.5px var(--cy)}
.cycal .d .lg{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:#8a9a9f}
.cycal .d.cy-period .lg,.cycal .d.cy-ovulation .lg{background:#fff}
.cyinfo b+span{display:block;font-weight:600;font-size:11.5px;color:var(--muted)}
.cypat{font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.cypat:first-of-type{border-top:0}
.cypat b{color:#8c2343}
.tchart{width:100%;height:auto;display:block;margin:4px 0 6px}
.tchart .tline2{fill:none;stroke:var(--cy);stroke-width:2;stroke-linejoin:round}
.tchart .tdot{fill:#fff;stroke:var(--cy);stroke-width:2}
.tchart .tdot.fert{fill:#5b7fd6;stroke:#5b7fd6}
.tchart .tcover{stroke:#8a9a9f;stroke-width:1.5;stroke-dasharray:4 3}
/* Notes */
.hntog{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 6px 4px 0;margin:-4px 0;font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;border-radius:10px}
.hntog .pill{margin-left:2px}
.hntog:focus-visible{outline:2px solid #2e7d70;outline-offset:2px}
.hnchev{width:8px;height:8px;border-right:2px solid var(--teal-d);border-bottom:2px solid var(--teal-d);transform:rotate(45deg);margin:0 0 3px 4px;transition:transform .15s}
.hntog[aria-expanded=true] .hnchev{transform:rotate(-135deg);margin:3px 0 0 4px}
.hnadd{display:flex;gap:8px;align-items:flex-end;margin:4px 0 6px}
.hnadd textarea{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--teal-ll);font-weight:600;font-size:14.5px;resize:vertical;min-height:46px;outline:0}
.hnadd textarea:focus{border-color:var(--teal);background:#fff}
.hnadd .btn{height:46px}
.row.note .ttl{white-space:normal;display:flex;align-items:center;gap:5px}
.noteprev{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notepin{display:inline-grid;color:var(--teal-d)}
.notepin svg{width:14px;height:14px}
/* Health → Meds (medicine information) */
.misearch{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.misearch .search{height:46px}
.misearch input{font-size:15px;min-width:0}
.misearch .btn{height:46px}
.mihead{display:flex;gap:12px;align-items:flex-start}
.mihead .main{flex:1;min-width:0}
.misec{border-top:1px solid var(--line);padding:2px 0}
.misec:first-child{border-top:0}
.misec summary{cursor:pointer;font-weight:800;font-size:14px;padding:10px 0;list-style:none;display:flex;align-items:center;gap:8px}
.misec summary::-webkit-details-marker{display:none}
.misec summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--teal-d);border-bottom:2px solid var(--teal-d);transform:rotate(45deg);transition:transform .15s}
.misec[open] summary::after{transform:rotate(-135deg)}
.misec summary:focus-visible{outline:2px solid #2e7d70;outline-offset:2px;border-radius:6px}
.mitext{white-space:pre-line;font-size:13.5px;line-height:1.5;color:var(--ink2);padding:0 0 12px}
#miResult:focus{outline:0}
.miplain{margin-top:12px;background:var(--teal-ll);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.miplain a{color:var(--teal-dd);font-weight:800;white-space:nowrap}
.mitag{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--teal-dd);margin-bottom:3px}
.mivia{font-size:12.5px;color:var(--ink2);background:#fdf3e1;border-radius:10px;padding:7px 10px;margin-bottom:10px}
.misrc{font-size:11.5px;color:#5b6b70;margin-top:6px}
/* Pregnancy */
.pgsetup{text-align:center;padding:28px 18px 22px}
.pgsetup h2{margin:0 0 6px;font-size:20px;font-weight:800}
.pgsetup p{color:var(--ink2);font-size:14px;margin:0 auto 16px;max-width:280px;line-height:1.45}
.pgroles{display:flex;flex-direction:column;gap:10px}
.pghead{background:linear-gradient(135deg,#fbe3ea,#fff 70%)}
.pgtop{display:flex;align-items:center;gap:14px}
.pgemoji{width:64px;height:64px;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:36px;box-shadow:var(--shadow);flex:none}
.pgweek{font-size:24px;font-weight:800;color:#8c2343;line-height:1.15}
.pgbar{margin-top:14px;height:10px;background:#f6d5df}
.pgbar i{background:var(--cy)}
.pgcount{font-size:13.5px;color:var(--ink2);margin-top:6px}
.pgcount b{font-size:16px;color:var(--ink)}
.pgsize{display:flex;align-items:center;gap:10px;background:#fdf1f5;border-radius:12px;padding:10px 12px;margin:4px 0 10px;font-size:14px}
.pgsize span{font-size:28px}
.pgsec{font-size:14px;line-height:1.5;padding:8px 0;border-top:1px solid var(--line)}
.pgsec .mitag{color:#8c2343}
.pgbig{padding:18px;font-size:16px}
.pgrow{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.pgrow span{flex:1}
.pgrow span:last-child{text-align:right}
.pgkick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pgkick div{background:#fdf1f5;border-radius:12px;padding:10px;text-align:center}
.pgkick b{display:block;font-size:24px;color:#8c2343}
.pgkick span{font-size:12px;color:var(--ink2)}
.pgform{display:flex;gap:8px;align-items:center;margin:8px 0}
.pgform input{flex:1;min-width:0;height:44px;border:2px solid var(--line);border-radius:12px;padding:0 10px;background:var(--teal-ll);font-weight:600;font-size:14.5px;outline:0}
.pgform input:focus{border-color:var(--teal);background:#fff}
.pgform span{font-weight:800;color:var(--muted)}
.pgform .btn{height:44px}
.pgchk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.pgchk input{width:20px;height:20px;accent-color:var(--teal);flex:none}
.pgchk input:checked+span{color:var(--muted);text-decoration:line-through}
.pgul{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.5}
.chip.pgdchip{border-color:#f1bdb7;color:#9b2c23}
.chip.pgdchip.on{background:#9b2c23;border-color:#9b2c23;color:#fff}
.pghome{background:#fdf1f5;border-color:#f6d5df;color:#7a2141}
.pgquick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pgquick .tile{padding:12px 6px;font:inherit;font-weight:700;font-size:12.5px;color:var(--ink)}
.pgquick .tile .ic{font-size:22px;background:#fdf1f5}
.cal .d.pgwk::before{content:"";position:absolute;top:3px;left:50%;width:14px;margin-left:-7px;height:2px;border-radius:2px;background:#e8a6bd}
.bumpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bumpcell{border:0;padding:0;background:#fdf1f5;border-radius:12px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:3/4;display:grid;place-items:center;font-size:24px}
.bumpcell img{width:100%;height:100%;object-fit:cover;display:block}
.bumpcell b{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:12px;padding:14px 6px 5px;text-align:left}
.bumpcell:focus-visible{outline:2px solid #2e7d70;outline-offset:2px}
/* Workout / Food / Sleep placeholders */
.soon{text-align:center;padding:34px 20px 26px}
.soon-ic{width:72px;height:72px;border-radius:22px;background:var(--teal-l);color:var(--teal-d);display:grid;place-items:center;margin:0 auto 14px}
.soon-ic svg{width:36px;height:36px}
.soon h2{margin:0 0 8px;font-size:20px;font-weight:800}
.soon p{color:var(--ink2);font-size:14px;margin:12px auto 18px;max-width:260px;line-height:1.45}
/* Home calendar */
.homecal .calhead{margin-top:2px}
.cal .d.sel.cy-period,.cal .d.sel.cy-predicted{background:var(--teal);color:#fff;outline:0}
.hcday{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.hchd{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.hchd b{font-size:14.5px}
.hchd .sp{flex:1}
/* Meds title dropdown */
.modebtn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font:inherit;font-size:18px;font-weight:800;letter-spacing:.2px;color:var(--ink);padding:6px 10px 6px 14px;border-radius:999px;cursor:pointer;max-width:100%}
.modebtn svg{width:16px;height:16px;color:var(--teal-d);transform:rotate(-90deg);transition:transform .15s}
.modebtn[aria-expanded=true] svg{transform:rotate(90deg)}
.modebtn:hover,.modebtn[aria-expanded=true]{background:rgba(255,255,255,.75)}
.modebtn:focus-visible{outline:2px solid #2e7d70;outline-offset:2px}
.modemenu{position:absolute;top:calc(100% - 4px);left:50%;transform:translateX(-50%);width:min(290px,calc(100% - 32px));background:#fff;border-radius:18px;box-shadow:0 14px 36px rgba(20,45,45,.22),0 0 0 1px rgba(20,45,45,.05);padding:6px;z-index:40;animation:menuin .14s ease-out}
@keyframes menuin{from{opacity:0;transform:translate(-50%,-6px)}}
.modeitem{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px;border-radius:13px;cursor:pointer;text-align:left;color:var(--ink)}
.modeitem+.modeitem{margin-top:2px}
.modeitem:hover,.modeitem:focus-visible{background:var(--teal-ll);outline:0}
.modeitem:focus-visible{box-shadow:inset 0 0 0 2px #2e7d70}
.modeitem[aria-checked=true]{background:var(--teal-l)}
.mi-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--teal-l);color:var(--teal-d);flex:none}
.mi-ic svg{width:22px;height:22px}
.modeitem[aria-checked=true] .mi-ic{background:#2e7d70;color:#fff}
.mi-t{flex:1;min-width:0}
.mi-t b{display:block;font-size:15px;font-weight:800}
.mi-t span{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.mi-ck{width:20px;height:20px;color:#2e7d70;flex:none}
.mi-ck svg{width:20px;height:20px}
/* Meds tabs + add button */
.segrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.segrow .seg{flex:1;min-width:0;margin-bottom:0}
.segadd{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--teal);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(59,179,168,.35)}
.segadd:hover{background:var(--teal-d)}
.segadd svg{width:22px;height:22px}
.segadd:focus-visible{outline:2px solid #2e7d70;outline-offset:2px}
/* tappable "✓ Taken 9:15" tag */
.pill-edit{border:0;cursor:pointer;font:inherit;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;vertical-align:middle}
.pill-edit svg{width:11px;height:11px}
.pill-edit:hover{background:#c9ead5}
.pill-edit:focus-visible{outline:2px solid #2e7d70;outline-offset:1px}
/* drag to reorder (Meds → Active) */
#medSort [data-mid]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drag-h{flex:none;width:36px;height:44px;margin-right:-8px;border:0;background:none;color:#8a9a9f;display:grid;place-items:center;cursor:grab;touch-action:none;border-radius:10px}
.drag-h svg{width:20px;height:20px}
.drag-h:focus-visible{outline:2px solid #2e7d70;outline-offset:-2px}
#medSort .row.sorting{position:relative;z-index:5;background:#fff;margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:12px;border-top-color:transparent;box-shadow:0 10px 26px rgba(20,45,45,.22);cursor:grabbing}
#medSort .row.sorting .drag-h{color:#2e7d70;cursor:grabbing}
#medSort.sorting-on .row:not(.sorting){transition:none}
/* simple "Add medication" form (new medicines); the full form is medForm */
.qm-sub{margin:-6px 0 12px;font-size:13px;color:var(--ink2)}
.qm-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.qm-g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.qm-g2>*{min-width:0}
.qm-lh{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:20px;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.qm-opt{font-size:10.5px;font-weight:800;color:#5b6b70;background:#eef1f2;border-radius:999px;padding:1px 7px;letter-spacing:.2px}
.qm-hint{font-size:12px;font-weight:700;color:#5b6b70}
.qm-in{display:block;width:100%;min-width:0;height:46px;border:2px solid var(--line);border-radius:12px;padding:0 11px;background:var(--teal-ll);outline:0;font-weight:600;font-size:14.5px}
.qm-in:focus{border-color:var(--teal);background:#fff}
.qm-ta{height:auto;min-height:80px;padding:10px 11px;resize:vertical;line-height:1.4}
.qm-in[aria-invalid=true]{border-color:var(--bad);background:#fff}
.qm-err{color:var(--bad);font-size:12.5px;font-weight:700;margin-top:6px}
.qm-err:empty{display:none}
.qm-add{display:block;width:100%;height:46px;border:2px dashed #9fcfc8;border-radius:12px;background:#fff;color:var(--teal-dd);font-weight:800;font-size:13.5px;cursor:pointer}
.qm-endwrap{position:relative}
.qm-endwrap .qm-in{padding-right:40px}
.qm-x{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#5b6b70;font-size:15px;cursor:pointer}
.qm-x:hover{background:#eef1f2;color:var(--bad)}
.qm-seg{display:flex;height:46px;background:#eef1f2;border-radius:12px;padding:4px;gap:4px}
.qm-seg button{flex:1;min-width:0;border:0;background:none;border-radius:9px;font-weight:800;font-size:13px;color:#5b6b70;cursor:pointer;white-space:nowrap;padding:0 4px}
.qm-seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,45,45,.18)}
.qm-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.qm-freq{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qm-chip{height:44px;min-width:0;padding:0;border:2px solid var(--line);background:#fff;border-radius:999px;font-weight:800;font-size:12.5px;color:var(--ink2);cursor:pointer}
.qm-chip[aria-pressed=true]{background:#2e7d70;border-color:#2e7d70;color:#fff}
.qm button:focus-visible{outline:2px solid #2e7d70;outline-offset:2px}
.qm-times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qm label.f{margin:0}
.qm label.f select,.qm label.f input{height:46px;margin-top:0;padding:0 11px}
.qm .switch{border-top:0;padding:0}
.qm-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:#fff;margin:4px -16px 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));text-align:center;z-index:2}
.qm-foot .link{display:inline-block;margin-top:8px;padding:8px 12px;font-size:14px}
</style>
</head>

/* ---------------- store (on this device: IndexedDB) ---------------- */
const R = new Map();            // id -> record
let ASSETS = null, SAMPLE = null;
let storeMode = 'loading';      // loading | device | memory
const IDB = {
  db: null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('health-monitor', 1); r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('records')) d.createObjectStore('records', {keyPath:'id'}); if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs'); }; r.onsuccess = () => { IDB.db = r.result; res(r.result); }; r.onerror = () => rej(r.error); }); },
  req(store, mode, fn){ return new Promise((res, rej) => { const t = IDB.db.transaction(store, mode); const q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  all(){ return IDB.req('records', 'readonly', s => s.getAll()); },
  put(rec){ return IDB.req('records', 'readwrite', s => s.put(rec)); },
  del(id){ return IDB.req('records', 'readwrite', s => s.delete(id)); },
  putBlob(id, blob){ return IDB.req('blobs', 'readwrite', s => s.put(blob, id)); },
  getBlob(id){ return IDB.req('blobs', 'readonly', s => s.get(id)); },
  delBlob(id){ return IDB.req('blobs', 'readwrite', s => s.delete(id)); },
  clear(){ return Promise.all([IDB.req('records', 'readwrite', s => s.clear()), IDB.req('blobs', 'readwrite', s => s.clear())]); }
};

/* people: 'me' plus anyone in your care. Records of these kinds belong to one person. */
const PSCOPED = new Set(['med','visit','course','allergy','note','cyday','preg','pglog','bump','illness','file','case','goal','food','exercise','sleep','day','period','profile','timers']);
let CUR = (() => { try { return localStorage.getItem('hm.person') || 'me'; } catch(e) { return 'me'; } })();
let NO_RENDER = 0;
function ownerOf(r){ return r.personId || 'me'; }
function withPerson(pid, fn){ const prev = CUR; CUR = pid; NO_RENDER++; try { return fn(); } finally { CUR = prev; NO_RENDER--; } }
function list(kind){ return [...R.values()].filter(r => r.kind === kind && (!PSCOPED.has(kind) || ownerOf(r) === CUR)); }
function get(id){ return R.get(id); }
function single(kind, defaults){ const id = kind + '~' + (PSCOPED.has(kind) ? CUR : 'me'); return R.get(id) || {id, kind, ...defaults}; }
function day(date){ const id = CUR === 'me' ? 'day~' + date : 'day~' + CUR + '~' + date; return R.get(id) || {id, kind:'day', date, water:0, doses:{}, personId: CUR}; }

function persistErr(e){ if (e && /quota/i.test(e.name + e.message)) toast('Your phone is out of space for this app — delete some large records or free up storage.'); }
function save(rec){
  rec.updatedAt = Date.now();
  if (PSCOPED.has(rec.kind) && !rec.personId && CUR !== 'me') rec.personId = CUR;
  const copy = JSON.parse(JSON.stringify(rec));
  R.set(rec.id, copy);
  if (storeMode === 'device') IDB.put(copy).catch(persistErr);
  render();
  return rec;
}
function remove(id){
  const r = R.get(id);
  R.delete(id);
  if (storeMode === 'device') { IDB.del(id).catch(persistErr); if (r && r.blobId) IDB.delBlob(r.blobId).catch(()=>{}); }
  render();
}
async function initStore(){
  render();
  try {
    await IDB.open();
    (await IDB.all()).forEach(r => R.set(r.id, r));
    // one-time move of anything kept by an earlier version in localStorage
    try { const raw = localStorage.getItem('hm.records.v1'); if (raw) { for (const r of JSON.parse(raw)) if (!R.has(r.id)) { R.set(r.id, r); await IDB.put(r); } localStorage.removeItem('hm.records.v1'); } } catch(e) {}
    storeMode = 'device';
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  } catch(e) { storeMode = 'memory'; toast('This browser won\'t let the app store data — entries will be lost when you close it. Try opening it in Safari or Chrome (not a private window).', null, 0); }
  render();
}

/* ---------------- files kept on the device ---------------- */
const BLOB_URLS = new Map();    // blobId -> object URL
const BLOB_LOADING = new Set();
function fileUrl(f){
  if (f.dataUrl) return f.dataUrl;
  if (!f.blobId) return '';
  if (BLOB_URLS.has(f.blobId)) return BLOB_URLS.get(f.blobId);
  if (storeMode === 'device' && !BLOB_LOADING.has(f.blobId)) {
    BLOB_LOADING.add(f.blobId);
    IDB.getBlob(f.blobId).then(b => { if (b) { BLOB_URLS.set(f.blobId, URL.createObjectURL(b)); render(); const v = document.querySelector('.viewer[data-fid="' + f.id + '"]'); if (v) ACT.viewFile(f.id); } }).catch(()=>{});
  }
  return '';
}

  const s = String(t||'').replace(/```(?:json)?/gi, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');

}

/* ---------------- toasts & sheets ---------------- */
function toast(msg, action, ms=6000, key=''){
  if (key && document.querySelector(`#toasts .toast[data-key="${CSS.escape(key)}"]`)) return;   // the same reminder is already showing
  const el = document.createElement('div'); el.className = 'toast';
  if (key) el.dataset.key = key;
  el.innerHTML = `<div class="main">${msg}</div>${action ? `<button class="act">${esc(action.label)}</button>` : ''}<button class="x" aria-label="Dismiss">✕</button>`;
  $('#toasts').appendChild(el);
  const kill = () => el.remove();
  el.querySelector('.x').onclick = kill;
  if (action) el.querySelector('.act').onclick = () => { action.fn(); kill(); };
  if (ms) setTimeout(kill, ms);
}

/* Browsers refuse to submit a form with an invalid field even when that field is hidden, and show no message.
   Check only the fields the person can see, and point at the first problem. */
function guardForms(root){
  root.querySelectorAll('form').forEach(f => {
    if (f.dataset.guarded) return; f.dataset.guarded = '1'; f.noValidate = true;
    f.addEventListener('submit', e => {
      const bad = [...f.elements].find(el => el.willValidate && !el.checkValidity() && el.offsetParent !== null);
      if (bad) { e.preventDefault(); e.stopImmediatePropagation(); bad.reportValidity(); bad.focus(); return; }
    }, true);
  });
}

/* form helper: fields = [{k,label,type,opts,req,ph,half}] */
function fieldHtml(f, v){
  const val = v ?? f.def ?? '';
  const req = f.req ? 'required' : '';
  let inner;
  if (f.type === 'select') inner = `<select name="${f.k}" ${req}>${(val !== '' && !f.opts.some(o => String(Array.isArray(o) ? o[0] : o) === String(val)) ? [[val, val]] : []).concat(f.opts).map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov)===String(val)?'selected':''}>${esc(ol)}</option>`; }).join('')}</select>`;
  else if (f.type === 'textarea') inner = `<textarea name="${f.k}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
  else inner = `<input name="${f.k}" type="${f.type||'text'}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.step?`step="${f.step}"`:''} ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${f.list?`list="${f.list}"`:''} ${req}>`;
  return `<label class="f">${esc(f.label)}${f.req?' *':''}${inner}</label>`;
}
function formHtml(fields, rec={}){
  let out = '', i = 0;
  while (i < fields.length) {
    const f = fields[i];
    if (f.half && fields[i+1] && fields[i+1].half) { out += `<div class="grid2">${fieldHtml(f, rec[f.k])}${fieldHtml(fields[i+1], rec[fields[i+1].k])}</div>`; i += 2; }
    else { out += fieldHtml(f, rec[f.k]); i++; }
  }
  return out;
}

/* ---------------- domain helpers ---------------- */
function medActiveOn(m, d){ return (!m.start || m.start <= d) && (!m.end || m.end >= d) && !m.stopped; }
/* repeat: {type:'daily'} | {type:'interval', every} | {type:'weekly', days:[0-6], every} | {type:'monthly', day} | {type:'prn', max, gap} */
const WD_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WD_ORDER = [1,2,3,4,5,6,0];
const ordinal = n => n + (n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
function repOf(m){ return m.repeat && m.repeat.type ? m.repeat : {type:'daily'}; }
function isPrn(m){ return repOf(m).type === 'prn'; }
function lastDayOfMonth(d){ const x = parseD(d); return new Date(x.getFullYear(), x.getMonth()+1, 0).getDate(); }
function medDueOn(m, d){
  if (!medActiveOn(m, d)) return false;
  const r = repOf(m), start = m.start || d;
  if (r.type === 'prn') return false;
  if (r.type === 'interval') return daysBetween(start, d) % Math.max(1, +r.every || 1) === 0;
  if (r.type === 'weekly') {
    const days = (r.days && r.days.length) ? r.days.map(Number) : [parseD(start).getDay()];
    if (!days.includes(parseD(d).getDay())) return false;
    const every = Math.max(1, +r.every || 1); if (every === 1) return true;
    const monday = x => { const y = parseD(x); y.setDate(y.getDate() - ((y.getDay()+6)%7)); return iso(y); };
    return Math.floor(daysBetween(monday(start), monday(d)) / 7) % every === 0;
  }
  if (r.type === 'monthly') { const want = Math.max(1, Math.min(31, +r.day || parseD(start).getDate())); return +d.slice(8) === Math.min(want, lastDayOfMonth(d)); }
  return true;
}
function nextDue(m, from){ let d = from || today(); for (let i = 0; i < 400; i++, d = addDays(d, 1)) { if (m.end && d > m.end) return null; if (medDueOn(m, d)) return d; } return null; }
function repeatLabel(m){
  const r = repOf(m);
  if (r.type === 'interval') return +r.every === 2 ? 'Every other day' : `Every ${r.every} days`;
  if (r.type === 'weekly') { const days = (r.days && r.days.length ? r.days : [parseD(m.start||today()).getDay()]).map(Number); const names = WD_ORDER.filter(x => days.includes(x)).map(x => WD_SHORT[x]).join(', '); return (+r.every > 1 ? `Every ${r.every} weeks` : 'Weekly') + ' · ' + names; }
  if (r.type === 'monthly') return `Monthly · ${ordinal(+r.day || parseD(m.start||today()).getDate())}`;
  if (r.type === 'prn') return 'As needed' + (r.max ? ` · max ${r.max}/day` : '');
  return 'Every day';
}
/* reads "once a week", "every Monday", "alternate days", "monthly", "SOS / as needed" … */
function repeatFromText(t, start){
  const s = ' ' + String(t||'').toLowerCase() + ' ';
  if (!s.trim()) return null;
  if (/\b(prn|sos|s\.o\.s|as needed|as required|when needed|if needed|when required|if required|only if|only when|when necessary|if necessary)\b/.test(s)) return {type:'prn'};
  if (/\b(alternate days?|every other day|every second day|eod|qod|every 2(nd)? days?)\b/.test(s)) return {type:'interval', every:2};
  let m = s.match(/every (\d{1,2}) days?/); if (m && +m[1] > 1) return {type:'interval', every:+m[1]};
  const names = [['sun(day)?',0],['mon(day)?',1],['tue(s|sday)?',2],['wed(nesday)?',3],['thu(rs|rsday)?',4],['fri(day)?',5],['sat(urday)?',6]];
  const days = names.filter(([n]) => new RegExp('\\b' + n + 's?\\b').test(s)).map(([,i]) => i);
  const every = /\b(every (2|two|other|second) weeks?|fortnight(ly)?|biweekly)\b/.test(s) ? 2 : 1;

const FOOD_OPTS = ['','Before food','After food','With food','Empty stomach','Any time'];
function normFood(t){
  const s = String(t||'').toLowerCase().replace(/[_\-]+/g,' ');
  if (!s.trim()) return '';
  const meal = '(food|foods|meal|meals|eating|breakfast|lunch|dinner|supper)';
  if (/with or without|regardless of|food doesn'?t matter|any ?time/.test(s)) return 'Any time';
  if (/empty stomach|on an? empty/.test(s)) return 'Empty stomach';
  if (new RegExp('before (a |your |the )?' + meal + '|pre ?' + meal + '|pre ?prandial|\\ba\\.?c\\.?\\b').test(s)) return 'Before food';
  if (new RegExp('after (a |your |the )?' + meal + '|post ?' + meal + '|post ?prandial|\\bp\\.?c\\.?\\b|full stomach').test(s)) return 'After food';
  if (new RegExp('with (a |your |the )?' + meal + '|with milk|\\bwith food\\b').test(s)) return 'With food';
  return '';
}
function foodOf(m){ return normFood(m.food) || normFood(m.instructions); }

function medKind(m){
  const known = ['Tablet','Capsule','Syrup','Drops','Spray','Inhaler','Injection','Cream','Soap','Shampoo','Patch','Powder'];
  if (known.includes(m.form) && m.form !== 'Tablet') return m.form;
  const t = ((m.name||'') + ' ' + (m.dose||'') + ' ' + (m.instructions||'')).toLowerCase();
  const rules = [['Shampoo',/shampoo/],['Soap',/\b(soap|body ?wash|face ?wash|cleanser|wash)\b/],['Injection',/\b(inj\.?|injection|insulin|vaccine|syringe|pen)\b/],['Inhaler',/\b(inhaler|puffs?|rotacap|nebuli[sz])/],['Spray',/\bsprays?\b/],['Drops',/\bdrops?\b/],['Cream',/\b(cream|ointment|oint\.?|gel|lotion|balm)\b/],['Patch',/\bpatch(es)?\b/],['Powder',/\b(powder|sachet|granules)\b/],['Syrup',/\b(syrup|syp\.?|suspension|susp\.?|elixir|liquid|oral solution|mixture)\b/],['Capsule',/\b(capsules?|caps?\.?)\b/]];

}

/* ---- how the schedule is shown ---- */
const PERIODS = [['morning','Morning','🌅'],['afternoon','Afternoon','☀️'],['evening','Evening','🌇'],['night','Night','🌙']];
const PERIOD_IDX = {morning:0, afternoon:1, evening:2, night:3};
function periodOf(t){ const m = hmToMin(t); return m >= 240 && m < 720 ? 'morning' : m >= 720 && m < 1020 ? 'afternoon' : m >= 1020 && m < 1260 ? 'evening' : 'night'; }

  if (!ds.length) return tail || '';

  let groups;

  else if (mode === 'case') { const keys = [...new Set(ds.map(x => caseOf(x.med) ? x.med.caseId : ''))]; groups = keys.map(k => [k ? caseBubble(get(k)) : 'Not in a case', ds.filter(x => (caseOf(x.med) ? x.med.caseId : '') === k)]); }

/* month grid shared by the prescriptions and appointments calendars; dots(d) returns a list of dot colours for a day */

  const inner = `<div class="calhead"><button class="iconbtn" data-act="${move}|-1" aria-label="Previous month">${ic('back')}</button><b>${first.toLocaleDateString(undefined, {month:'long', year:'numeric'})}</b><button class="iconbtn" data-act="${move}|1" aria-label="Next month">${ic('back', 'style="transform:rotate(180deg)"')}</button></div>

/* ---- courses of sessions (physio, therapy…): one record, sessions worked out from the pattern like medicine doses ----
   {kind:'course', apptType, doctor, facility, start, time, len, repeat:{type:'daily'|'weekly'|'monthly', days, every, day},
    ends:{mode:'count'|'date'|'ongoing', count, until, extend}, remind, stoppedFrom, sessions:{origDate: {s, date, time, pain, note}}} */
function courseRep(c){ return c.repeat && c.repeat.type ? c.repeat : {type:'weekly', days:[parseD(c.start).getDay()], every:1}; }
function courseSessions(c, upto){
  const out = [], S = c.sessions || {}, e = c.ends || {mode:'count', count:10, extend:true};
  const want = e.mode === 'count' ? Math.max(1, +e.count || 1) : Infinity;
  const horizon = upto || addDays(today(), 60), pat = {start: c.start, end: '', repeat: courseRep(c)};
  let used = 0, n = 0;
  for (let d = c.start, i = 0; d && i < 2500; d = addDays(d, 1), i++) {
    if (e.mode === 'date' && e.until && d > e.until) break;
    if (c.stoppedFrom && d >= c.stoppedFrom) break;
    if (e.mode !== 'count' && d > horizon) break;
    if (!medDueOn(pat, d)) continue;
    const st = S[d] || {}, cancelled = st.s === 'cancelled';
    if (!cancelled) n++;

    out.push({c, orig: d, date: st.date || d, time: st.time || c.time || '', s: st.s || '', n: cancelled ? 0 : n, rec: st});
    if (used >= want) break;
  }

  return `<div class="row click" data-act="openCase|${c.id}"><div class="medic" style="${c.status==='closed'?'background:#eef1f2;color:#5b6b70':''}">${ic('folder')}</div><div class="main"><div class="ttl">${esc(c.title)}</div><div class="sub">Opened ${fmtD(c.created)}${last && last !== c.created ? ' · last update '+fmtDs(last) : ''}</div><div class="sub">${caseSummary(c.id) || 'Empty'}</div></div>${c.status==='closed'?'<span class="pill grey">Closed</span>':'<span class="pill good">Open</span>'}</div>`;
}

/* ---- case view ---- */
VIEWS.case = () => {
  const c = get(UI.caseId);
  if (!c) { UI.recTab = 'cases'; return `<div class="empty">This case file no longer exists. <button class="link" data-act="nav|files">Back to records</button></div>`; }
  const it = caseItems(c.id);
  const by = f => it.filter(f).sort((a,b)=>{ const d = r => r.kind==='illness'||r.kind==='course'?r.start:r.kind==='med'?(r.prescribedOn||r.start):r.date; return (d(b)||'').localeCompare(d(a)||''); });
  const sections = [
    ['Sick reports', 'thermo', by(r=>r.kind==='illness')],
    ['Appointments', 'doctor', by(r=>r.kind==='visit')],
    ['Courses of sessions', 'cal', by(r=>r.kind==='course')],
    ['Notes', 'note', by(r=>r.kind==='note')],
    ['Prescriptions', 'note', by(r=>r.kind==='file'&&r.category==='Prescription')],
    ['Medication', 'pill', by(r=>r.kind==='med')],
    ['Lab reports', 'lab', by(r=>r.kind==='file'&&r.category==='Lab report')],
    ['X-rays & scans', 'xray', by(r=>r.kind==='file'&&/^(X-ray|Scan)/.test(r.category||''))],
    ['Other documents', 'file', by(r=>r.kind==='file'&&!/^(X-ray|Scan|Lab report|Prescription)/.test(r.category||''))]
  ];
  const ds = caseDates(c.id);
  const t = today();
  const activeMeds = it.filter(r=>r.kind==='med' && medActiveOn(r,t)).length;
  const next = it.filter(r=>r.kind==='visit' && r.date >= t).sort((a,b)=>a.date.localeCompare(b.date))[0];
  HIDE_CASE_TAG = true;
  const body = sections.filter(([,,rows])=>rows.length).map(([title,icn,rows]) => `<div class="sect">${title} · ${rows.length}</div><div class="card">${rows.map(recRow).join('')}</div>`).join('');
  HIDE_CASE_TAG = false;
  return `<div class="card casehead">
    <h3>${ic('folder','style="width:20px;height:20px"')}${esc(c.title)}<span class="sp"></span><span class="pill" style="background:rgba(255,255,255,.22);color:#fff">${c.status==='closed'?'Closed':'Open'}</span></h3>
    <div class="small">Opened ${fmtD(c.created)}${c.status==='closed'&&c.closedOn?' · closed '+fmtD(c.closedOn):''}${ds.length?' · '+fmtDs(ds[0])+' – '+fmtDs(ds[ds.length-1]):''}</div>
    ${c.notes?`<div style="margin-top:8px;font-size:14px;white-space:pre-wrap">${esc(c.notes)}</div>`:''}
    <div class="stats" style="margin-top:10px"><div class="stat"><b>${it.filter(r=>r.kind==='visit').length}</b><span>visits</span></div><div class="stat"><b>${activeMeds}</b><span>meds active</span></div><div class="stat"><b>${it.filter(r=>r.kind==='file').length}</b><span>documents</span></div><div class="stat"><b>${ds.length?daysBetween(ds[0], c.status==='closed'&&c.closedOn?c.closedOn:t)+1:0}</b><span>days</span></div></div>
  </div>
  ${next?`<div class="alert info"><b>Next visit: ${fmtD(next.date)}${next.time?' · '+fmtT(next.time):''}</b>${esc(next.doctor||'')}${next.facility?' · '+esc(next.facility):''}</div>`:''}
  <div class="tiles" style="grid-template-columns:repeat(3,1fr);gap:8px">
    <div class="tile" data-act="caseAdd|scan"><div class="ic">${ic('scan')}</div>Scan Rx</div>
    <div class="tile" data-act="caseAdd|file"><div class="ic">${ic('folder')}</div>Upload</div>
    <div class="tile" data-act="caseAdd|visit"><div class="ic">${ic('doctor')}</div>Visit</div>
    <div class="tile" data-act="caseAdd|med"><div class="ic">${ic('pill')}</div>Medicine</div>
    <div class="tile" data-act="caseAdd|sick"><div class="ic">${ic('thermo')}</div>Sick report</div>
    <div class="tile" data-act="caseAdd|note"><div class="ic">${ic('note')}</div>Note</div>
    <div class="tile" data-act="caseLink"><div class="ic">${ic('plus')}</div>Add existing</div>
  </div>
  ${body || '<div class="card"><div class="empty">Nothing in this case yet. Use the buttons above to add a prescription, records or visits.</div></div>'}
  <div class="btns" style="margin:14px 0"><button class="btn sm" data-act="caseShare">${ic('ext','style="width:15px;height:15px"')} Share case</button><button class="btn sm sec" data-act="caseEdit">${ic('edit','style="width:16px;height:16px"')} Rename / notes</button><button class="btn sm sec" data-act="caseToggle">${c.status==='closed'?'Reopen case':'Close case'}</button><button class="btn sm danger" data-act="caseDel">${ic('trash','style="width:16px;height:16px"')} Delete case</button></div>`;
};
ACT.recTab = k => { UI.recTab = k; render(); };
ACT.recTabGo = k => { UI.recTab = k; go('files'); };
ACT.openCase = id => openCase(id);
ACT.newCase = () => caseForm({created: today(), status:'open'});
ACT.caseEdit = () => caseForm(get(UI.caseId));
function caseForm(c){
  openSheet(c.id ? 'Edit case file' : 'New case file', `<form id="cf">${formHtml([{k:'title',label:'Case name',req:true,ph:'e.g. Flu, Back pain, Diabetes care'},{k:'created',label:'Started on',type:'date',req:true},{k:'notes',label:'Notes',type:'textarea',ph:'Diagnosis, treatment plan, anything to remember'}], c)}<button class="btn block" type="submit">Save case</button>
    ${c.id ? '' : `<div class="orline"><span>or</span></div><button type="button" class="btn block out" data-act="receiveCase">${ic('folder','style="width:17px;height:17px"')} Receive a case file from a carer</button><div class="small" style="margin-top:6px;text-align:center">Open a case your carer shared with you — it's added with everything in it.</div>`}</form>`, b => b.querySelector('#cf').onsubmit = e => {
    e.preventDefault(); const v = readForm(e.target); const rec = {...c, ...v, kind:'case', id: c.id || 'case~'+uid()}; save(rec);
    if (!c.id) openCase(rec.id); else closeSheet();
  });
  const rc = $('#sheetRoot [data-act=receiveCase]'); if (rc) rc.onclick = () => ACT.receiveCare();
}
/* share one case file — the case and everything in it, plus the dose ticks for its medicines */
ACT.caseShare = async el => {
  const c = get(UI.caseId); if (!c) return;
  const btn = el && el.closest ? el.closest('button') : null; if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Preparing…'; }
  const data = await buildCareFile('case', ownerOf(c), [], '', c.id);
  const ok = await shareCareFile(`case-${slug(c.title)}-${today()}.json`, data);
  render(); if (ok) toast(`“${esc(c.title)}” ready to send. They open it with Records → Case files → New case file → Receive a case file.`, null, 9000);
};
ACT.caseToggle = () => { const c = get(UI.caseId); if (!c) return; save(c.status==='closed' ? {...c, status:'open', closedOn:''} : {...c, status:'closed', closedOn: today()}); };
ACT.caseDel = () => { const c = get(UI.caseId); if (!c) return; confirmSheet(`Delete the case “${esc(c.title)}”? The visits, prescriptions and records inside it are kept — they just won't be grouped any more.`, () => { caseItems(c.id).forEach(r => save({...r, caseId:''})); remove(c.id); UI.recTab='cases'; go('files'); }); };
ACT.caseAdd = what => {
  const c = get(UI.caseId); if (!c) return;
  const pre = {caseId: c.id};
  if (what === 'scan') ACT.scanRx(pre);
  else if (what === 'file') ACT.addFile(pre);
  else if (what === 'visit') visitForm({date: today(), facilityType:'Clinic', reason: c.title, caseId: c.id});
  else if (what === 'med') medForm(pre);
  else if (what === 'note') noteForm({caseId: c.id});
  else if (what === 'sick') sickForm({start: today(), severity: 4, symptoms: [], title: c.title, caseId: c.id});
};
ACT.caseLink = () => {
  const c = get(UI.caseId); if (!c) return;
  const groups = [['Doctor visits', list('visit'), v => `${v.doctor||'Visit'} · ${fmtDs(v.date)}`, v=>v.date],['Sick reports', list('illness'), i => `${i.title||'Unwell'} · ${fmtDs(i.start)}`, i=>i.start],['Medication', list('med'), m => `${m.name} ${m.dose||''} · ${fmtDs(m.prescribedOn||m.start)}`, m=>m.prescribedOn||m.start],['Records', list('file'), f => `${f.name} · ${f.category} · ${fmtDs(f.date)}`, f=>f.date],['Notes', list('note'), n => `${String(n.text||'').split('\n')[0].slice(0, 50)} · ${fmtDs(n.date || iso(new Date(n.created || Date.now())))}`, n=>n.date || iso(new Date(n.created || Date.now()))]];
  openSheet('Items in “'+c.title+'”', `<div class="small" style="margin-bottom:8px">Tick everything that belongs to this case.</div><form id="lf">${groups.map(([t, rows, lab, dt]) => rows.length ? `<div class="sect">${t}</div>${rows.sort((a,b)=>(dt(b)||'').localeCompare(dt(a)||'')).map(r => { const oc = r.caseId && r.caseId !== c.id && get(r.caseId); return `<label class="switch" style="cursor:pointer"><input type="checkbox" name="${r.id}" ${r.caseId===c.id?'checked':''} style="width:20px;height:20px;accent-color:var(--teal)"><div class="main"><div style="font-weight:700">${esc(lab(r))}</div>${oc?`<div class="small">currently in “${esc(oc.title)}”</div>`:''}</div></label>`; }).join('')}` : '').join('') || '<div class="empty">Nothing recorded yet.</div>'}<button class="btn block" type="submit" style="margin-top:12px">Save</button></form>`, b => b.querySelector('#lf').onsubmit = e => {
    e.preventDefault();
    b.querySelectorAll('input[type=checkbox]').forEach(cb => { const r = get(cb.name); if (!r) return; if (cb.checked && r.caseId !== c.id) save({...r, caseId: c.id}); else if (!cb.checked && r.caseId === c.id) save({...r, caseId: ''}); });
    closeSheet(); toast('Case updated.');
  });
};
function fileRow(f){
  const isImg = (f.mime||'').startsWith('image/');
  return `<div class="row click" data-act="viewFile|${f.id}"><div class="thumb">${isImg && fileUrl(f) ? `<img src="${esc(fileUrl(f))}" alt="">` : ic(catIcon(f.category||''))}</div><div class="main"><div class="ttl">${esc(f.name)}</div><div class="sub">${esc(f.category||'')} · ${fmtD(f.date)}</div>${f.reason?`<div class="sub">${esc(f.reason)}</div>`:''}${caseTag(f)}</div></div>`;
}

/* ---- Health ---- */
VIEWS.health = () => {
  if (curModule() === 'pregnancy') return pgHealth();
  if (curModule() !== 'home') return homePlaceholder(curModule());
  const tab = UI.healthTab, t = today(), s = settings();
  const showCycle = cycleOn();
  if ((tab === 'cycle' && !showCycle) || !['goals','allergies','medinfo','notes','cycle'].includes(tab)) return (UI.healthTab = 'goals', VIEWS.health());
  const seg = `<div class="seg">${[['goals','Goals'],['allergies','Allergies'],['medinfo','Meds'],['notes','Notes'], ...(showCycle ? [['cycle','Cycle']] : [])].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="healthTab|${k}">${l}</button>`).join('')}</div>`;
  if (tab === 'notes') return seg + notesView();
  let body = '';
  if (tab === 'cycle' && showCycle) return seg + cycleView();
  if (tab === 'allergies') return seg + allergyView();
  if (tab === 'medinfo') return seg + medInfoView();
  if (tab === 'goals') {
    const gs = list('goal').sort((a,b)=>(a.done?1:0)-(b.done?1:0));
    body = `<button class="btn block" data-act="addGoal" style="margin-bottom:12px">+ New health goal</button>
    <div class="card">${gs.length ? gs.map(goalRow).join('') : '<div class="empty">Set a goal, e.g. “Lose 5 kg”, “Walk 10,000 steps”, “Lower blood pressure to 120/80”.</div>'}</div>
    <div class="card"><h3>Daily targets<span class="sp"></span><button class="link" data-act="nav|reminders">Edit</button></h3><div class="stats"><div class="stat"><b>${s.targets.cal}</b><span>kcal</span></div><div class="stat"><b>${s.targets.water}</b><span>glasses</span></div><div class="stat"><b>${s.targets.exercise}</b><span>min active</span></div><div class="stat"><b>${s.targets.sleep}</b><span>h sleep</span></div></div></div>`;
  } else if (tab === 'food') {
    const items = list('food').filter(f => f.date === UI.foodDay || (!UI.foodDay && f.date === t));
    const d = UI.foodDay || t;
    const total = items.reduce((a,f)=>a+(+f.cal||0),0);
    const pct = Math.min(100, Math.round(total / s.targets.cal * 100));
    const water = day(d).water || 0;
    const order = ['Breakfast','Lunch','Dinner','Snack','Drink'];
    body = `<div class="calhead"><button class="iconbtn" data-act="foodDay|-1">${ic('back')}</button><b>${d===t?'Today':fmtD(d)}</b><button class="iconbtn" data-act="foodDay|1" ${d>=t?'disabled style="opacity:.4"':''}>${ic('back','style="transform:rotate(180deg)"')}</button></div>
    <div class="card"><h3>Calories<span class="sp"></span><span class="small">${total} / ${s.targets.cal} kcal</span></h3><div class="bar"><i style="width:${pct}%"></i></div>
    <h3 style="margin-top:14px">${ic('water','style="width:18px;height:18px;color:var(--info)"')}Water<span class="sp"></span><span class="small">${water} / ${s.targets.water} glasses</span></h3>
    <div class="btns"><button class="btn sm sec" data-act="waterD|${d}|-1">−</button><div style="flex:1;display:flex;gap:3px;align-items:center">${Array.from({length:Math.max(s.targets.water, water)},(_,i)=>`<span style="flex:1;height:18px;border-radius:5px;background:${i<water?'var(--info)':'var(--teal-l)'}"></span>`).join('')}</div><button class="btn sm" data-act="waterD|${d}|1">+</button></div></div>
    <button class="btn block" data-act="addFood|${d}" style="margin-bottom:12px">+ Log food</button>
    ${order.map(m => { const its = items.filter(f=>f.meal===m); return its.length ? `<div class="card"><h3>${m}<span class="sp"></span><span class="small">${its.reduce((a,f)=>a+(+f.cal||0),0)} kcal</span></h3>${its.map(f=>`<div class="row click" data-act="editFood|${f.id}"><div class="main"><div class="ttl">${esc(f.desc)}</div>${f.notes?`<div class="sub">${esc(f.notes)}</div>`:''}</div><span class="small">${esc(f.cal||'–')} kcal</span></div>`).join('')}</div>` : ''; }).join('') || '<div class="empty">Nothing logged for this day.</div>'}`;
  } else if (tab === 'exercise') {
    const items = list('exercise').sort((a,b)=>b.date.localeCompare(a.date));
    const week = [6,5,4,3,2,1,0].map(i => addDays(t,-i));
    const vals = week.map(d => items.filter(x=>x.date===d).reduce((a,x)=>a+(+x.minutes||0),0));
    body = `<button class="btn block" data-act="addEx" style="margin-bottom:12px">+ Log exercise</button>
    <div class="card"><h3>Active minutes · last 7 days<span class="sp"></span><span class="small">${vals.reduce((a,b)=>a+b,0)} min total</span></h3>${barChart(week, vals, s.targets.exercise, 'min')}</div>
    <div class="card">${items.length ? items.slice(0,40).map(x=>`<div class="row click" data-act="editEx|${x.id}"><div class="medic">${ic('run')}</div><div class="main"><div class="ttl">${esc(x.type)}</div><div class="sub">${fmtD(x.date)}${x.notes?' · '+esc(x.notes):''}</div></div><span class="pill">${esc(x.minutes)} min</span></div>`).join('') : '<div class="empty">No exercise logged yet.</div>'}</div>`;
  } else {
    const items = list('sleep').sort((a,b)=>b.date.localeCompare(a.date));
    const week = [6,5,4,3,2,1,0].map(i => addDays(t,-i));
    const vals = week.map(d => { const x = items.find(s=>s.date===d); return x ? +x.hours.toFixed(1) : 0; });
    const logged = vals.filter(v=>v>0);
    body = `<button class="btn block" data-act="addSleep" style="margin-bottom:12px">+ Log sleep</button>
    <div class="card"><h3>Sleep · last 7 nights<span class="sp"></span><span class="small">${logged.length?'avg '+(logged.reduce((a,b)=>a+b,0)/logged.length).toFixed(1)+' h':''}</span></h3>${barChart(week, vals, s.targets.sleep, 'h')}</div>
    <div class="card">${items.length ? items.slice(0,40).map(x=>`<div class="row click" data-act="editSleep|${x.id}"><div class="medic">${ic('moon')}</div><div class="main"><div class="ttl">${x.hours.toFixed(1)} hours</div><div class="sub">${fmtD(x.date)} · ${fmtT(x.bed)} → ${fmtT(x.wake)}${x.quality?' · '+esc(x.quality):''}</div></div></div>`).join('') : '<div class="empty">No sleep logged yet.</div>'}</div>`;
  }
  return seg + body;
};

/* the other side: merge a pregnancy share into this phone's pregnancy (role stays as it is here) */
function mergePreg(local, inc, data){
  const latest = (a, b) => { const out = {...(a || {})}; Object.entries(b || {}).forEach(([k, v]) => { if (!out[k] || (v.at || 0) > (out[k].at || 0)) out[k] = v; }); return out; };
  if (!local) return {...inc, role: data.role === 'mother' ? 'partner' : 'mother', partnerName: data.from && data.from !== 'Your partner' ? data.from : (inc.partnerName || '')};
  const newer = (inc.updatedAt || 0) > (local.updatedAt || 0), core = ['method','lmp','scanDate','scanWeeks','scanDays','ivfDate','embryoDay','dueDate','status','outcome','endDate','unitPhone'];
  const out = {...local, bag: latest(local.bag, inc.bag), plan: latest(local.plan, inc.plan), bagCustom: [...(local.bagCustom || []), ...(inc.bagCustom || []).filter(c => !(local.bagCustom || []).some(x => x.key === c.key))], updatedAt: Math.max(local.updatedAt || 0, inc.updatedAt || 0)};
  if (newer) core.forEach(k => { if (inc[k] !== undefined && inc[k] !== '') out[k] = inc[k]; });

  return out;
}

/* ---------------- allergies ---------------- */
const ALLERGY_TYPES = [['Medicine','pill'],['Food','food'],['Environment','sparkle'],['Other','note']];
const SEVERITIES = [['Mild','grey'],['Moderate','warn'],['Severe','bad'],['Not sure','']];
/* medicine families, so an allergy to one can flag a related medicine */
const ALLERGY_FAMILIES = {
  penicillin: ['penicillin','amoxicillin','amoxycillin','ampicillin','co-amoxiclav','augmentin','flucloxacillin','dicloxacillin','cloxacillin','piperacillin','phenoxymethylpenicillin','benzylpenicillin'],
  sulfa: ['sulfamethoxazole','co-trimoxazole','cotrimoxazole','bactrim','septra','sulfasalazine','sulfadiazine','sulpha','sulfonamide'],
  nsaid: ['nsaid','aspirin','ibuprofen','naproxen','diclofenac','ketorolac','mefenamic','celecoxib','etoricoxib','indomethacin','piroxicam','meloxicam','ketoprofen'],
  cephalosporin: ['cephalosporin','cefalexin','cephalexin','cefuroxime','ceftriaxone','cefixime','cefadroxil','cefaclor','cefdinir','cefpodoxime'],
  opioid: ['opioid','codeine','morphine','tramadol','oxycodone','hydrocodone','pethidine','meperidine','fentanyl'],
  macrolide: ['macrolide','erythromycin','azithromycin','clarithromycin'],
  tetracycline: ['tetracycline','doxycycline','minocycline'],
  quinolone: ['quinolone','fluoroquinolone','ciprofloxacin','levofloxacin','moxifloxacin','ofloxacin','norfloxacin']
};
const normName = s => String(s || '').toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').replace(/\s+/g, ' ').trim();
function allergyList(){ const sv = a => ['Severe','Moderate','Mild'].indexOf(a.severity); return list('allergy').sort((a, b) => ((sv(a) < 0 ? 9 : sv(a)) - (sv(b) < 0 ? 9 : sv(b))) || a.name.localeCompare(b.name)); }
/* does this medicine name clash with a recorded allergy? → [{a, how:'same'|'related'}] */
function allergyMatches(medName){
  const n = normName(medName); if (n.length < 3) return [];
  const out = [];
  list('allergy').forEach(a => {
    const an = normName(a.name); if (an.length < 3) return;
    const words = n.split(' ');
    if (n.includes(an) || words.some(w => w.length > 3 && an.split(' ').includes(w))) { out.push({a, how: 'same'}); return; }
    const fam = Object.entries(ALLERGY_FAMILIES).find(([k, ms]) => an.includes(k) || ms.some(m => an.includes(m)));
    if (fam && fam[1].some(m => n.includes(m))) out.push({a, how: 'related'});
  });
  return out;
}
function allergyAlert(names){
  const hits = names.map(nm => [nm, allergyMatches(nm)]).filter(([, h]) => h.length);
  if (!hits.length) return '';
  return `<div class="alert bad"><b>⚠️ Allergy warning</b>${hits.map(([nm, h]) => `${esc(nm)}: ${h.map(x => `${x.how === 'same' ? 'you listed' : 'may be related to your allergy to'} <strong>${esc(x.a.name)}</strong>${x.a.severity && x.a.severity !== 'Not sure' ? ' (' + esc(x.a.severity.toLowerCase()) + ')' : ''}`).join('; ')}`).join('<br>')}<div style="margin-top:6px;font-size:12.5px">Check with your doctor or pharmacist before taking it.</div></div>`;
}
function pregToast(name){ const p = features().pregnancy && activePreg(); if (p && p.role === 'mother') toast(`🤰 You're pregnant — check <b>${esc(name)}</b> is safe in pregnancy with your doctor or pharmacist.`, {label: 'Look it up', fn: () => ACT.pgMedLook(name)}, 9000); }
function allergyToast(name){ pregToast(name); const h = allergyMatches(name); if (h.length) toast(`⚠️ <b>${esc(name)}</b> ${h[0].how === 'same' ? 'is on your allergy list' : 'may be related to your allergy to <b>' + esc(h[0].a.name) + '</b>'}. Check with your doctor or pharmacist.`, null, 0); }
/* keep the profile's allergy text (used in emergencies and when asking Claude) in step with the list */
function syncProfileAllergies(){ const names = allergyList().map(a => a.name); const p = profile(); const txt = names.join(', '); if (names.length && p.allergies !== txt) save({...p, allergies: txt}); }
function allergyView(){
  const t = today(), all = allergyList(), p = profile();
  const meds = [...new Set(list('med').filter(m => medActiveOn(m, t) || m.start > t).map(m => m.name))];
  const imp = !all.length && p.allergies ? `<div class="alert info"><b>Your profile lists: ${esc(p.allergies)}</b>Add them here so the app can check new medicines against them.<div class="btns" style="margin-top:8px"><button class="btn sm" data-act="importAllergies">Add them to the list</button></div></div>` : '';
  const row = a => { const ty = ALLERGY_TYPES.find(x => x[0] === a.type) || ALLERGY_TYPES[3], sv = SEVERITIES.find(x => x[0] === a.severity);
    return `<div class="row click" data-act="editAllergy|${a.id}"><div class="medic" style="${a.severity === 'Severe' ? 'background:#fbe3e1;color:#9b2c23' : ''}">${ic(ty[1])}</div><div class="main"><div class="ttl">${esc(a.name)}</div><div class="sub">${esc(a.type || 'Other')}${a.reaction ? ' · ' + esc(a.reaction) : ''}</div>${a.notes ? `<div class="sub">${esc(a.notes)}</div>` : ''}</div>${sv && sv[1] !== undefined && a.severity !== 'Not sure' ? `<span class="pill ${sv[1]}">${esc(a.severity)}</span>` : ''}</div>`; };
  return `${allergyAlert(meds)}${imp}
    <button class="btn block" data-act="addAllergy" style="margin-bottom:12px">+ Add allergy</button>
    ${all.length ? ALLERGY_TYPES.map(([ty]) => { const xs = all.filter(a => (a.type || 'Other') === ty); return xs.length ? `<div class="sect">${ty}${ty === 'Other' || ty === 'Environment' ? '' : ' allergies'} · ${xs.length}</div><div class="card">${xs.map(row).join('')}</div>` : ''; }).join('')
      : `<div class="card"><div class="empty">No allergies recorded.<br>Adding them lets the app warn you if a medicine may not be safe for you.</div></div>`}
    <p class="disclaimer">Allergy checks match names and common medicine families only — always tell your doctor and pharmacist about your allergies.</p>`;
}
function allergyForm(a){
  let type = a.type || 'Medicine', sev = a.severity || '';
  const chips = (g, opts, cur) => `<div class="chips" data-grp="${g}" style="margin-bottom:12px">${opts.map(k => `<button type="button" class="chip ${k === cur ? 'on' : ''}" data-v="${esc(k)}" aria-pressed="${k === cur}">${esc(k)}</button>`).join('')}</div>`;
  openSheet(a.id ? 'Edit allergy' : 'Add allergy', `<form id="alf">
    <label class="f">Allergic to *<input name="name" value="${esc(a.name || '')}" placeholder="e.g. Penicillin, peanuts, pollen" required autocomplete="off"></label>
    <div class="sect" style="margin-top:0">Type</div>${chips('type', ALLERGY_TYPES.map(x => x[0]), type)}
    <label class="f">Reaction<input name="reaction" value="${esc(a.reaction || '')}" placeholder="e.g. rash, swelling, trouble breathing"></label>
    <div class="sect" style="margin-top:0">How bad</div>${chips('sev', SEVERITIES.map(x => x[0]), sev)}
    <label class="f">Notes<textarea name="notes" placeholder="e.g. diagnosed 2019, carry an EpiPen">${esc(a.notes || '')}</textarea></label>
    <button class="btn block" type="submit">Save allergy</button>
    ${a.id ? '<div style="text-align:center;margin-top:10px"><button type="button" class="link" id="alDel" style="color:var(--bad);padding:8px">Delete allergy</button></div>' : ''}
  </form>`, b => {
    const f = b.querySelector('#alf');
    const pick = (g, set) => f.querySelectorAll(`[data-grp="${g}"] [data-v]`).forEach(x => x.onclick = () => { const v = set(x.dataset.v); f.querySelectorAll(`[data-grp="${g}"] [data-v]`).forEach(y => { y.classList.toggle('on', y.dataset.v === v); y.setAttribute('aria-pressed', y.dataset.v === v); }); });
    pick('type', v => (type = v)); pick('sev', v => (sev = sev === v ? '' : v));
    f.onsubmit = e => {
      e.preventDefault(); const v = readForm(f);
      save({...a, kind: 'allergy', id: a.id || 'allergy~' + uid(), name: v.name, type, reaction: v.reaction, severity: sev, notes: v.notes});
      syncProfileAllergies(); closeSheet(); toast(`${esc(v.name)} saved to your allergies.`);
      const hit = list('med').filter(m => medActiveOn(m, today()) && allergyMatches(m.name).some(x => x.a.name === v.name));
      if (hit.length) toast(`⚠️ You're currently taking ${esc(hit.map(m => m.name).join(', '))} — check with your doctor or pharmacist.`, null, 0);
    };
    const del = b.querySelector('#alDel'); if (del) del.onclick = () => confirmSheet(`Delete ${esc(a.name)} from your allergies?`, () => { remove(a.id); const p = profile(); save({...p, allergies: allergyList().map(x => x.name).join(', ')}); });
  });

async function fdaSearch(term){

  if (!j) return [];
  const qn = normName(term), combo = g => /( and |,|\/)/.test(g);
  const score = r => { const o = r.openfda || {}, gs = (o.generic_name || []).map(normName), bs = (o.brand_name || []).map(normName); let sc = 0;
    if (gs.some(g => g === qn)) sc += 100; else if (gs.some(g => g.startsWith(qn) && !combo(g))) sc += 80;
    if (bs.some(b => b === qn)) sc += 90;
    if (gs.some(combo) && !combo(qn)) sc -= 50;
    return sc + MI_SECTIONS.filter(([, ks]) => ks.some(k => r[k])).length; };
  const seen = new Set();
  return (j.results || []).map(r => ({r, sc: score(r)})).sort((a, b) => b.sc - a.sc).map(x => x.r)
    .filter(r => { const o = r.openfda || {}, k = ((o.generic_name || [''])[0] + '|' + (o.brand_name || [''])[0]).toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 8);

const WIKI_MAP = [["What it's for", /^(medical uses?|uses|indications)$/i], ['How to take it', /^(dosage|dosing|administration|dosage (and|&) administration|available forms|dosage forms)$/i], ['Do not take it if', /^contraindications?$/i], ['Warnings', /^(precautions|warnings|cautions)$/i], ['Side effects', /^(adverse effects|side effects|adverse reactions)$/i], ['Interactions with other medicines', /^(interactions|drug interactions)$/i], ['Pregnancy & breastfeeding', /(pregnan|breast-?feeding|lactation)/i], ['Overdose', /^overdos(e|age)$/i]];

  const sets = `<div class="card"><h3>Settings</h3>
    ${tg(s.remind.period, 'tog|period', 'Remind me before my period', '2 days before it’s expected')}
