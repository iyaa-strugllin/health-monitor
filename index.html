<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3bb3a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Health">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Health Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#3bb3a8; --teal-d:#23867d; --teal-dd:#165e58; --teal-l:#dff4f1; --teal-ll:#f1faf8;
  --bg:#e6f6f3; --card:#ffffff; --ink:#1f2d33; --ink2:#4f6168; --muted:#7f9096; --line:#d5e7e4;
  --good:#2f9e5b; --warn:#c98a12; --bad:#d0463b; --info:#3a7bd5;
  --r:16px; --shadow:0 2px 10px rgba(30,90,85,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100%;background:var(--teal-ll);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(30,90,85,.12)}
header.top{position:sticky;top:0;z-index:20;background:var(--teal-l);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;flex:1;text-align:center;font-weight:800;letter-spacing:.2px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.ghost{background:transparent;box-shadow:none}
main{flex:1;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
.sync{font-size:12px;color:var(--muted);text-align:center;margin:-4px 0 10px}
.sync.warn{color:var(--warn)}
/* nav */
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;font-weight:700;padding:4px 0}
nav.bottom a svg{width:22px;height:22px}
nav.bottom a.on{color:var(--teal-d)}
nav.bottom a.center .bub{width:54px;height:54px;border-radius:50%;background:var(--teal);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px rgba(59,179,168,.45);border:4px solid #fff}
nav.bottom a.center .bub svg{width:28px;height:28px;color:#fff}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.link{color:var(--teal-d);font-weight:700;font-size:13px;background:none;border:0;cursor:pointer;padding:0;text-decoration:none}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.hello .t{font-size:13px;color:var(--muted)} .hello .n{font-size:19px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:13px;text-align:center}
.tile:hover{border-color:var(--teal)}
.tile .ic{width:44px;height:44px;border-radius:14px;background:var(--teal-l);display:grid;place-items:center;color:var(--teal-d)}
.tile .ic svg{width:24px;height:24px}
.tile.hot{background:var(--teal);border-color:var(--teal);color:#fff}
.tile.hot .ic{background:rgba(255,255,255,.2);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--teal-ll);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:17px;font-weight:800}
.stat span{font-size:11px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--muted)}
.row.click{cursor:pointer}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--teal-l);color:var(--teal-dd)}
.pill.bad{background:#fbe3e1;color:#9b2c23}.pill.warn{background:#fbf0d9;color:#7d5608}.pill.good{background:#dff3e6;color:#1d6b3c}.pill.grey{background:#eef1f2;color:#5b6b70}
.medic{width:40px;height:40px;border-radius:12px;background:var(--teal-l);display:grid;place-items:center;color:var(--teal-d);flex:none}
.medic svg{width:22px;height:22px}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--teal);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none;color:#fff}
.chk.on{background:var(--teal)}
.chk svg{width:18px;height:18px}
.bar{height:8px;background:var(--teal-l);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 6px}
.btn{border:0;background:var(--teal);color:#fff;font-weight:800;border-radius:999px;padding:11px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.3px}
.btn:hover{background:var(--teal-d)}
.btn.block{width:100%}
.btn.sec{background:var(--teal-l);color:var(--teal-dd)}
.btn.out{background:#fff;color:var(--teal-dd);border:2px solid var(--teal)}
.btn.danger{background:#fbe3e1;color:#9b2c23}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;margin-bottom:12px;box-shadow:var(--shadow);overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--teal);color:#fff}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.search input{border:0;outline:0;flex:1;background:none}
.search svg{width:18px;height:18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.alert.bad{background:#fbe3e1;color:#7a221b;border:1px solid #f1bdb7}
.alert.warn{background:#fbf0d9;color:#6b4a07;border:1px solid #efd9a6}
.alert.good{background:#dff3e6;color:#1a5c34;border:1px solid #b9e2c7}
.alert.info{background:var(--teal-l);color:var(--teal-dd);border:1px solid #bfe6e0}
.alert b{display:block;margin-bottom:3px}
.small{font-size:12px;color:var(--muted)}
/* forms */
.sheet-bg{position:fixed;inset:0;background:rgba(20,45,45,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:440px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:44px;height:5px;background:var(--line);border-radius:9px;margin:4px auto 10px}
.sheet h2{font-size:18px;margin:0 0 12px;font-weight:800;display:flex;align-items:center}
.sheet h2 span{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
label.f{display:block;margin-bottom:10px;font-size:12.5px;font-weight:700;color:var(--ink2)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;border:2px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--teal-ll);outline:0;font-weight:600;font-size:14.5px}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--teal);background:#fff}
label.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.times input{width:auto!important;display:inline-block!important;margin:0!important}
.switch{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.switch .main{flex:1}
.tog{width:46px;height:28px;border-radius:99px;background:#cfdcdb;position:relative;cursor:pointer;border:0;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.tog.on{background:var(--teal)}
.tog.on::after{left:21px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;position:relative}
.cal .d.o{color:#b9c6c8}
.cal .d.today{outline:2px solid var(--teal)}
.cal .d.sel{background:var(--teal);color:#fff}
.cal .dots{display:flex;gap:2px;height:5px;margin-top:2px}
.cal .dots i{width:5px;height:5px;border-radius:50%}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead b{flex:1;text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
/* chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding:6px 2px 0;border-bottom:1px solid var(--line);position:relative}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:default}
.chart .col .b{width:60%;max-width:26px;background:var(--teal);border-radius:4px 4px 0 0;min-height:2px}
.chart .col:hover .b{background:var(--teal-d)}
.chart .col .tip{position:absolute;bottom:calc(100% - 4px);background:var(--ink);color:#fff;font-size:11px;padding:3px 6px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateY(-4px)}
.chart .col:hover .tip{opacity:1}
.chart .tline{position:absolute;left:0;right:0;border-top:1.5px dashed #9fb7b4;pointer-events:none}
.chart .tline span{position:absolute;right:0;top:-16px;font-size:10.5px;color:var(--muted)}
.xl{display:flex;gap:8px;padding:4px 2px 0}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
/* files */
.thumb{width:48px;height:48px;border-radius:10px;background:var(--teal-l);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--teal-d)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:24px;height:24px}
.viewer img{max-width:100%;border-radius:12px;display:block;margin:0 auto 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0}
/* toast */
#toasts{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:416px;z-index:80;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none}
.toast{pointer-events:auto}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s}
.toast .main{flex:1;font-size:14px}
.toast button{background:var(--teal);color:#fff;border:0;border-radius:99px;padding:6px 10px;font-weight:800;cursor:pointer;font-size:12.5px}
.toast button.x{background:transparent;color:#cfe;padding:4px 6px}
.menu .row{cursor:pointer}
.menu .row svg{width:22px;height:22px;color:var(--teal-d)}
.disclaimer{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.ocrbox{border:2px dashed var(--teal);border-radius:14px;padding:14px;text-align:center;background:var(--teal-ll);margin-bottom:12px}
.hidden{display:none!important}
:root{--cy:#d4517e}
.cyhead{display:flex;gap:14px;align-items:center}
.cyring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex:none}
.cyring>div{width:88px;height:88px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cyring b{font-size:19px;color:#8c2343}.cyring span{font-size:11px;color:var(--muted)}
.cyinfo{display:flex;flex-direction:column;gap:6px;font-size:13px}.cyinfo span{display:block;color:var(--muted);font-size:11.5px;font-weight:700}
.cybtn{background:var(--cy)}.cybtn:hover{background:#b23d66}
.cal .d.cy-period{background:var(--cy);color:#fff}
.cal .d.cy-predicted{background:#fbe3ea;color:#8c2343;outline:1.5px dashed var(--cy);outline-offset:-3px}
.cal .d.cy-fertile{background:#e3eefc;color:#2b4f8f}
.cal .d.cy-ovulation{background:#5b7fd6;color:#fff}
.cal .d.cy-period.today,.cal .d.cy-ovulation.today{outline:2px solid var(--ink)}
.cyclealert{background:#fbe9ef;border-color:#f3c3d3;color:#7a2141}
.avatar.sm{width:40px;height:40px;font-size:15px}
.avatar.xs{width:30px;height:30px;font-size:12px;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800}
.pbanner{display:flex;align-items:center;gap:8px;color:#fff;border-radius:14px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.pbanner button{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:99px;padding:5px 10px;font-weight:800;cursor:pointer}
.rule{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--teal-ll);border:2px solid var(--line);border-radius:12px;padding:6px 8px;margin-bottom:6px;font-size:13.5px;font-weight:700}
.rule input,.rule select{border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;font-weight:700;font-size:13px}
.tmr.ready .ttl{color:var(--good)}
.tmr.ready .bar i{background:var(--good)}
.timers{border:2px solid #cfe9e5}
.grp{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;color:var(--teal-dd);background:var(--teal-ll);border-radius:10px;padding:6px 10px;margin:10px 0 2px}
.grp.warn{color:#7d4c08;background:#fdf3e1}
.grp:first-child{margin-top:0}
.chip.sm{padding:4px 10px;font-size:12px}
.scrollchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scrollchips::-webkit-scrollbar{display:none}
.scrollchips .chip{flex:none}
ol.steps{padding-left:20px;margin:0 0 14px}ol.steps li{margin-bottom:14px;font-size:14px}
.pill.rep{background:#ece8f8;color:#4b3a8c}
.prnrow .btn{white-space:nowrap}
.skipb{border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer}
.skipb:hover{border-color:var(--bad);color:var(--bad)}
h3 .pill{white-space:nowrap}
.row.dimmed .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.optcard{border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.optcard h4{margin:0 0 6px;font-size:14.5px}
.pill.food{background:#e4f3e9;color:#1d6b3c}.pill.food.pre{background:#fdf0dc;color:#7d4c08}.pill.food.any{background:#eef1f2;color:#4b5b60}
.pill.foodq{border:1.5px dashed #c98a12;background:#fffaf0;color:#7d5608;cursor:pointer;font:inherit;font-size:11px;font-weight:800}
.foodbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.foodbtns .btn{padding:12px 8px}
.pill.case{background:#e7eefc;color:#2b4f8f}
.casehead{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff}
.casehead h3{color:#fff;font-size:18px}
.casehead .small{color:rgba(255,255,255,.85)}
.casehead .stat{background:rgba(255,255,255,.16)}
.casehead .stat span{color:rgba(255,255,255,.85)}
.sect{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 2px 6px}
.medgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.medgrid input,.medgrid select{display:block;margin-top:3px;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--teal-ll);width:100%;font-size:13.5px;font-weight:600}
.rxmed{border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.rxmed.off{opacity:.5}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="iconbtn ghost" id="backBtn" aria-label="Back" style="visibility:hidden"></button>
    <h1 id="title">Health Monitor</h1>
    <button class="iconbtn" id="addBtn" aria-label="Quick add"></button>
  </header>
  <main id="view"></main>
  <nav class="bottom" id="nav"></nav>
</div>
<div id="toasts"></div>
<div id="sheetRoot"></div>
<div id="extRoot"></div>

<script>
/* ---------------- icons ---------------- */
const I = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  m_tablet:'<ellipse cx="12" cy="12" rx="9" ry="6.5"/><path d="M12 5.5v13"/>',
  m_capsule:'<rect x="2.5" y="8.5" width="19" height="7" rx="3.5" transform="rotate(-40 12 12)"/><path d="M9.2 8.6l6.2 7"/>',
  m_syrup:'<path d="M9.5 2.5h5v3l2 2.5v11.5a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2V8l2-2.5z"/><path d="M7.5 12h9M7.5 17h9"/>',
  m_drops:'<path d="M12 3.5s5.5 6 5.5 10a5.5 5.5 0 0 1-11 0c0-4 5.5-10 5.5-10z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/>',
  m_spray:'<rect x="7.5" y="10" width="9" height="11" rx="2"/><path d="M10 10V7h4v3M12 7V4.5M15.5 4h3M15.5 2.5l2.5-1M15.5 5.5l2.5 1"/>',
  m_inhaler:'<path d="M9 3h5v7.5l3.5 2.5v6a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-9.5L9 8z"/><path d="M14 14h3.5"/>',
  m_injection:'<path d="M17 3l4 4M19 5l-3 3M16 8l-8.5 8.5-3-3L13 5M9.5 10.5l1.5 1.5M12 8l1.5 1.5M4.5 16.5L2.5 18.5M6 18l-1 1"/>',

const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const fmtD = s => s ? parseD(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) : '';

const fmtT = t => { if(!t) return ''; const [h,m] = t.split(':').map(Number); const d = new Date(); d.setHours(h,m); return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* ---------------- store (on this device: IndexedDB) ---------------- */
const R = new Map();            // id -> record
let ASSETS = null, SAMPLE = null;
let storeMode = 'loading';      // loading | device | memory
const IDB = {
  db: null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('health-monitor', 1); r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('records')) d.createObjectStore('records', {keyPath:'id'}); if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs'); }; r.onsuccess = () => { IDB.db = r.result; res(r.result); }; r.onerror = () => rej(r.error); }); },
  req(store, mode, fn){ return new Promise((res, rej) => { const t = IDB.db.transaction(store, mode); const q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  all(){ return IDB.req('records', 'readonly', s => s.getAll()); },
  put(rec){ return IDB.req('records', 'readwrite', s => s.put(rec)); },
  del(id){ return IDB.req('records', 'readwrite', s => s.delete(id)); },
  putBlob(id, blob){ return IDB.req('blobs', 'readwrite', s => s.put(blob, id)); },
  getBlob(id){ return IDB.req('blobs', 'readonly', s => s.get(id)); },
  delBlob(id){ return IDB.req('blobs', 'readwrite', s => s.delete(id)); },
  clear(){ return Promise.all([IDB.req('records', 'readwrite', s => s.clear()), IDB.req('blobs', 'readwrite', s => s.clear())]); }
};

/* people: 'me' plus anyone in your care. Records of these kinds belong to one person. */
const PSCOPED = new Set(['med','visit','illness','file','case','goal','food','exercise','sleep','day','period','profile','timers']);
let CUR = (() => { try { return localStorage.getItem('hm.person') || 'me'; } catch(e) { return 'me'; } })();
let NO_RENDER = 0;
function ownerOf(r){ return r.personId || 'me'; }
function withPerson(pid, fn){ const prev = CUR; CUR = pid; NO_RENDER++; try { return fn(); } finally { CUR = prev; NO_RENDER--; } }
function list(kind){ return [...R.values()].filter(r => r.kind === kind && (!PSCOPED.has(kind) || ownerOf(r) === CUR)); }
function get(id){ return R.get(id); }
function single(kind, defaults){ const id = kind + '~' + (PSCOPED.has(kind) ? CUR : 'me'); return R.get(id) || {id, kind, ...defaults}; }
function day(date){ const id = CUR === 'me' ? 'day~' + date : 'day~' + CUR + '~' + date; return R.get(id) || {id, kind:'day', date, water:0, doses:{}, personId: CUR}; }

function persistErr(e){ if (e && /quota/i.test(e.name + e.message)) toast('Your phone is out of space for this app — delete some large records or free up storage.'); }
function save(rec){
  rec.updatedAt = Date.now();
  if (PSCOPED.has(rec.kind) && !rec.personId && CUR !== 'me') rec.personId = CUR;
  const copy = JSON.parse(JSON.stringify(rec));
  R.set(rec.id, copy);
  if (storeMode === 'device') IDB.put(copy).catch(persistErr);
  render();
  return rec;
}
function remove(id){
  const r = R.get(id);
  R.delete(id);
  if (storeMode === 'device') { IDB.del(id).catch(persistErr); if (r && r.blobId) IDB.delBlob(r.blobId).catch(()=>{}); }
  render();
}
async function initStore(){
  render();
  try {
    await IDB.open();
    (await IDB.all()).forEach(r => R.set(r.id, r));
    // one-time move of anything kept by an earlier version in localStorage
    try { const raw = localStorage.getItem('hm.records.v1'); if (raw) { for (const r of JSON.parse(raw)) if (!R.has(r.id)) { R.set(r.id, r); await IDB.put(r); } localStorage.removeItem('hm.records.v1'); } } catch(e) {}
    storeMode = 'device';
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  } catch(e) { storeMode = 'memory'; toast('This browser won\'t let the app store data — entries will be lost when you close it. Try opening it in Safari or Chrome (not a private window).', null, 0); }
  render();
}

/* ---------------- files kept on the device ---------------- */
const BLOB_URLS = new Map();    // blobId -> object URL
const BLOB_LOADING = new Set();
function fileUrl(f){
  if (f.dataUrl) return f.dataUrl;
  if (!f.blobId) return '';
  if (BLOB_URLS.has(f.blobId)) return BLOB_URLS.get(f.blobId);
  if (storeMode === 'device' && !BLOB_LOADING.has(f.blobId)) {
    BLOB_LOADING.add(f.blobId);
    IDB.getBlob(f.blobId).then(b => { if (b) { BLOB_URLS.set(f.blobId, URL.createObjectURL(b)); render(); const v = document.querySelector('.viewer[data-fid="' + f.id + '"]'); if (v) ACT.viewFile(f.id); } }).catch(()=>{});
  }
  return '';
}

/* ---------------- Claude app bridge ----------------
   No API key lives in this app. Anything that needs Claude is sent to the
   Claude app on the phone; the reply is pasted back here. */
function extractJson(t){
  const s = String(t||'').replace(/```(?:json)?/gi, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) throw {code:'bad_reply'};
  try { return JSON.parse(s.slice(a, b + 1)); } catch(e) { throw {code:'bad_reply'}; }
}

          <div class="small" style="margin-top:4px">${file ? (canShareFile ? 'Pick the Claude app in the share menu, then paste the instructions into the message.' : 'Open the Claude app, attach the same photo, and paste the instructions.') : 'Open the Claude app and paste the instructions as a new message.'}</div></li>
        <li><b>${json ? 'Copy Claude\'s whole reply and paste it here' : 'Read Claude\'s answer in the app'}</b>${json ? `<textarea data-reply placeholder="Paste Claude's reply here…" style="width:100%;min-height:110px;margin-top:6px;border:2px solid var(--line);border-radius:12px;padding:9px;background:var(--teal-ll);font-size:13px"></textarea><div class="small" data-err style="color:var(--bad)"></div>` : `<div class="small" style="margin-top:4px">Optional: paste the answer below to keep it with this record.</div><textarea data-reply placeholder="(optional)" style="width:100%;min-height:70px;margin-top:6px;border:2px solid var(--line);border-radius:12px;padding:9px;background:var(--teal-ll);font-size:13px"></textarea>`}</li>

    const sh = root.querySelector('[data-share]'); if (sh) sh.onclick = async () => { try { await navigator.clipboard.writeText(prompt); } catch(_) {} try { await navigator.share({files:[file], text: prompt}); } catch(_) {} };

/* ---------------- toasts & sheets ---------------- */
function toast(msg, action, ms=6000){
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<div class="main">${msg}</div>${action ? `<button class="act">${esc(action.label)}</button>` : ''}<button class="x" aria-label="Dismiss">✕</button>`;
  $('#toasts').appendChild(el);
  const kill = () => el.remove();
  el.querySelector('.x').onclick = kill;
  if (action) el.querySelector('.act').onclick = () => { action.fn(); kill(); };
  if (ms) setTimeout(kill, ms);
}

/* Browsers refuse to submit a form with an invalid field even when that field is hidden, and show no message.
   Check only the fields the person can see, and point at the first problem. */
function guardForms(root){
  root.querySelectorAll('form').forEach(f => {
    if (f.dataset.guarded) return; f.dataset.guarded = '1'; f.noValidate = true;
    f.addEventListener('submit', e => {
      const bad = [...f.elements].find(el => el.willValidate && !el.checkValidity() && el.offsetParent !== null);
      if (bad) { e.preventDefault(); e.stopImmediatePropagation(); bad.reportValidity(); bad.focus(); return; }
    }, true);
  });
}
function closeSheet(){ $('#sheetRoot').innerHTML = ''; }
function confirmSheet(msg, yes){
  openSheet('Are you sure?', `<p>${msg}</p><div class="btns"><button class="btn danger" id="cy">Delete</button><button class="btn sec" data-close>Cancel</button></div>`, b => b.querySelector('#cy').onclick = () => { closeSheet(); yes(); });
}

/* form helper: fields = [{k,label,type,opts,req,ph,half}] */
function fieldHtml(f, v){
  const val = v ?? f.def ?? '';
  const req = f.req ? 'required' : '';
  let inner;
  if (f.type === 'select') inner = `<select name="${f.k}" ${req}>${(val !== '' && !f.opts.some(o => String(Array.isArray(o) ? o[0] : o) === String(val)) ? [[val, val]] : []).concat(f.opts).map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov)===String(val)?'selected':''}>${esc(ol)}</option>`; }).join('')}</select>`;
  else if (f.type === 'textarea') inner = `<textarea name="${f.k}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
  else inner = `<input name="${f.k}" type="${f.type||'text'}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.step?`step="${f.step}"`:''} ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${f.list?`list="${f.list}"`:''} ${req}>`;
  return `<label class="f">${esc(f.label)}${f.req?' *':''}${inner}</label>`;
}
function formHtml(fields, rec={}){
  let out = '', i = 0;
  while (i < fields.length) {
    const f = fields[i];
    if (f.half && fields[i+1] && fields[i+1].half) { out += `<div class="grid2">${fieldHtml(f, rec[f.k])}${fieldHtml(fields[i+1], rec[fields[i+1].k])}</div>`; i += 2; }
    else { out += fieldHtml(f, rec[f.k]); i++; }
  }
  return out;
}
function readForm(form){ const o = {}; new FormData(form).forEach((v, k) => o[k] = typeof v === 'string' ? v.trim() : v); return o; }
function datalists(){
  const docs = new Set(), fac = new Set();
  [...R.values()].forEach(r => { if (r.doctor) docs.add(r.doctor); if (r.facility) fac.add(r.facility); });
  return `<datalist id="dl-doc">${[...docs].map(d=>`<option value="${esc(d)}">`).join('')}</datalist><datalist id="dl-fac">${[...fac].map(d=>`<option value="${esc(d)}">`).join('')}</datalist>`;
}

/* ---------------- domain helpers ---------------- */
function medActiveOn(m, d){ return (!m.start || m.start <= d) && (!m.end || m.end >= d) && !m.stopped; }
/* repeat: {type:'daily'} | {type:'interval', every} | {type:'weekly', days:[0-6], every} | {type:'monthly', day} | {type:'prn', max, gap} */
const WD_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WD_ORDER = [1,2,3,4,5,6,0];
const ordinal = n => n + (n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
function repOf(m){ return m.repeat && m.repeat.type ? m.repeat : {type:'daily'}; }
function isPrn(m){ return repOf(m).type === 'prn'; }
function lastDayOfMonth(d){ const x = parseD(d); return new Date(x.getFullYear(), x.getMonth()+1, 0).getDate(); }
function medDueOn(m, d){
  if (!medActiveOn(m, d)) return false;
  const r = repOf(m), start = m.start || d;
  if (r.type === 'prn') return false;
  if (r.type === 'interval') return daysBetween(start, d) % Math.max(1, +r.every || 1) === 0;
  if (r.type === 'weekly') {
    const days = (r.days && r.days.length) ? r.days.map(Number) : [parseD(start).getDay()];
    if (!days.includes(parseD(d).getDay())) return false;
    const every = Math.max(1, +r.every || 1); if (every === 1) return true;
    const monday = x => { const y = parseD(x); y.setDate(y.getDate() - ((y.getDay()+6)%7)); return iso(y); };
    return Math.floor(daysBetween(monday(start), monday(d)) / 7) % every === 0;
  }
  if (r.type === 'monthly') { const want = Math.max(1, Math.min(31, +r.day || parseD(start).getDate())); return +d.slice(8) === Math.min(want, lastDayOfMonth(d)); }

const FOOD_OPTS = ['','Before food','After food','With food','Empty stomach','Any time'];
function normFood(t){
  const s = String(t||'').toLowerCase().replace(/[_\-]+/g,' ');
  if (!s.trim()) return '';
  const meal = '(food|foods|meal|meals|eating|breakfast|lunch|dinner|supper)';
  if (/with or without|regardless of|food doesn'?t matter|any ?time/.test(s)) return 'Any time';
  if (/empty stomach|on an? empty/.test(s)) return 'Empty stomach';
  if (new RegExp('before (a |your |the )?' + meal + '|pre ?' + meal + '|pre ?prandial|\\ba\\.?c\\.?\\b').test(s)) return 'Before food';
  if (new RegExp('after (a |your |the )?' + meal + '|post ?' + meal + '|post ?prandial|\\bp\\.?c\\.?\\b|full stomach').test(s)) return 'After food';
  if (new RegExp('with (a |your |the )?' + meal + '|with milk|\\bwith food\\b').test(s)) return 'With food';
  return '';
}
function foodOf(m){ return normFood(m.food) || normFood(m.instructions); }
function foodText(f){ return f === 'Any time' ? 'With or without food' : f; }
/* what kind of medicine is it — from the chosen type, or guessed from the name */
function medKind(m){
  const known = ['Tablet','Capsule','Syrup','Drops','Spray','Inhaler','Injection','Cream','Soap','Shampoo','Patch','Powder'];
  if (known.includes(m.form) && m.form !== 'Tablet') return m.form;
  const t = ((m.name||'') + ' ' + (m.dose||'') + ' ' + (m.instructions||'')).toLowerCase();
  const rules = [['Shampoo',/shampoo/],['Soap',/\b(soap|body ?wash|face ?wash|cleanser|wash)\b/],['Injection',/\b(inj\.?|injection|insulin|vaccine|syringe|pen)\b/],['Inhaler',/\b(inhaler|puffs?|rotacap|nebuli[sz])/],['Spray',/\bsprays?\b/],['Drops',/\bdrops?\b/],['Cream',/\b(cream|ointment|oint\.?|gel|lotion|balm)\b/],['Patch',/\bpatch(es)?\b/],['Powder',/\b(powder|sachet|granules)\b/],['Syrup',/\b(syrup|syp\.?|suspension|susp\.?|elixir|liquid|oral solution|mixture)\b/],['Capsule',/\b(capsules?|caps?\.?)\b/]];
  for (const [k, re] of rules) if (re.test(t)) return k;
  return m.form === 'Tablet' ? 'Tablet' : 'Tablet';
}
const KIND_TINT = {Tablet:['#dff4f1','#23867d'],Capsule:['#dff4f1','#23867d'],Syrup:['#fdeedd','#9a5512'],Drops:['#e3ecfb','#2b4f8f'],Spray:['#e3ecfb','#2b4f8f'],Inhaler:['#e8e6f8','#4b3a8c'],Injection:['#fbe3ea','#8c2343'],Cream:['#f6efe0','#7a5a16'],Soap:['#e2f3f6','#1d5a6d'],Shampoo:['#efe6f8','#6d2f82'],Patch:['#f1efe9','#5f5340'],Powder:['#f1efe9','#5f5340']};
function medIcon(m){ const k = medKind(m), [bg, fg] = KIND_TINT[k] || KIND_TINT.Tablet; return `<div class="medic" style="background:${bg};color:${fg}" title="${k}">${ic('m_' + k.toLowerCase())}</div>`; }
function foodApplies(m){
  if (!['Tablet','Capsule','Syrup','Powder'].includes(medKind(m))) return false;
  if (['Injection','Drops','Inhaler','Cream'].includes(m.form)) return false;
  return !/\b(sprays?|nasal|drops?|eye|ear|inhaler|puffs?|injection|inj\.?|cream|ointment|gel|lotion|patch|suppositor(y|ies)|pessar(y|ies)|nebuli[sz]|shampoo|mouthwash|gargle|topical)\b/i.test((m.name||'') + ' ' + (m.dose||'') + ' ' + (m.instructions||''));
}
function foodBadge(m){

}
function prnUses(d, id){ return ((day(d).prn||{})[id]) || []; }
function prnCard(filterFn){

/* ---- how the schedule is shown ---- */
const PERIODS = [['morning','Morning','🌅'],['afternoon','Afternoon','☀️'],['evening','Evening','🌇'],['night','Night','🌙']];
const PERIOD_IDX = {morning:0, afternoon:1, evening:2, night:3};
function periodOf(t){ const m = hmToMin(t); return m >= 240 && m < 720 ? 'morning' : m >= 720 && m < 1020 ? 'afternoon' : m >= 1020 && m < 1260 ? 'evening' : 'night'; }
function viewPrefs(){ return {home:'next', group:'period', order:[], hideTaken:false, ...(settings().view||{})}; }
function setView(patch){ const s = settings(); save({...s, view: {...viewPrefs(), ...patch}}); }
function orderIdx(id){ const i = viewPrefs().order.indexOf(id); return i < 0 ? 999 : i; }
function sortDoses(ds){ return ds.sort((a,b) => a.time.localeCompare(b.time) || orderIdx(a.med.id) - orderIdx(b.med.id) || a.med.name.localeCompare(b.med.name)); }
/* a day's doses, grouped the way the person chose */
function doseBlock(d, doses, mode){
  const vp = viewPrefs(); mode = mode || vp.group;
  let ds = sortDoses([...doses]);
  const hidden = vp.hideTaken ? ds.filter(x => isTaken(d, x.key)).length : 0;
  if (vp.hideTaken) ds = ds.filter(x => !isTaken(d, x.key));
  const tail = hidden ? `<div class="small" style="text-align:center;padding:6px 0">${hidden} taken dose${hidden>1?'s':''} hidden · <button class="link" data-act="arrange">change</button></div>` : '';
  if (!ds.length) return tail || '';
  if (mode === 'time') return doseRows(d, ds) + tail;
  const cnt = arr => { const all = doses.filter(x => arr.some(y => y.med.id === x.med.id && (mode !== 'period' || periodOf(x.time) === periodOf(y.time)))); return `${all.filter(x => isTaken(d, x.key)).length}/${all.length}`; };
  let groups;
  if (mode === 'period') groups = PERIODS.map(([k, l, e]) => [`${e} ${l}`, ds.filter(x => periodOf(x.time) === k)]);
  else if (mode === 'case') { const keys = [...new Set(ds.map(x => caseOf(x.med) ? x.med.caseId : ''))]; groups = keys.map(k => [k ? caseBubble(get(k)) : 'Not in a case', ds.filter(x => (caseOf(x.med) ? x.med.caseId : '') === k)]); }
  else { const ids = [...new Set(ds.map(x => x.med.id))].sort((a, b) => orderIdx(a) - orderIdx(b) || get(a).name.localeCompare(get(b).name)); groups = ids.map(id => [esc(get(id).name), ds.filter(x => x.med.id === id)]); }
  return groups.filter(g => g[1].length).map(([l, arr]) => `<div class="grp"><span>${l}</span><span class="small">${cnt(arr)} taken</span></div>${doseRows(d, arr)}`).join('') + tail;
}
/* today's card: "Up next" shows only what matters now */
function todayCard(t, doses, opts = {}){
  const vp = viewPrefs(), f = vp.home, now = nowHM(), nowP = periodOf(now);
  const chips = [['next','Up next'], ...PERIODS.map(([k, l]) => [k, l]), ['all','All day']];
  let body = '', note = '';
  if (!doses.length) body = `<div class="empty">No medication scheduled today.<br><button class="link" data-act="addMed">+ Add a prescription</button></div>`;
  else if (f === 'all') body = doseBlock(t, doses);
  else if (f !== 'next') { const ds = doses.filter(x => periodOf(x.time) === f); body = ds.length ? doseBlock(t, ds, 'time') : `<div class="empty">Nothing in the ${f}.</div>`; }
  else {
    const earlier = doses.filter(x => PERIOD_IDX[periodOf(x.time)] < PERIOD_IDX[nowP] && !isRecorded(t, x.key) && !(nowP === 'night' && hmToMin(now) < 240));
    let showP = nowP, cur = doses.filter(x => periodOf(x.time) === nowP);
    if (!cur.some(x => !isRecorded(t, x.key))) {
      const nxt = PERIODS.map(p => p[0]).find(k => PERIOD_IDX[k] > PERIOD_IDX[nowP] && doses.some(x => periodOf(x.time) === k && !isRecorded(t, x.key)));
      if (nxt) { showP = nxt; cur = doses.filter(x => periodOf(x.time) === nxt); }
    }
    const P = PERIODS.find(p => p[0] === showP);
    const left = doses.filter(x => !isRecorded(t, x.key)).length;
    if (earlier.length) body += `<div class="grp warn"><span>⚠️ Earlier today — not recorded</span><span class="small">${earlier.length}</span></div>` + doseRows(t, sortDoses(earlier));
    if (cur.length) body += `<div class="grp"><span>${P[2]} ${showP === nowP ? 'Now · ' : 'Next · '}${P[1]}</span><span class="small">${cur.filter(x => isTaken(t, x.key)).length}/${cur.length} taken</span></div>` + doseRows(t, sortDoses([...cur]));
    if (!left) body = `<div class="empty" style="font-size:14px">🎉 All of today's doses are recorded.</div>`;
    else if (!cur.length && !earlier.length) body = `<div class="empty">Nothing due right now.</div>`;
    const later = doses.filter(x => PERIOD_IDX[periodOf(x.time)] > PERIOD_IDX[showP] && !isRecorded(t, x.key)).length;
    if (later && left) note = `<button class="link" data-act="homeFilter|all" style="display:block;margin:8px auto 0">+ ${later} more later today</button>`;
  }
  return `<div class="chips scrollchips" style="margin:-2px 0 8px">${chips.map(([k, l]) => `<button class="chip sm ${f === k ? 'on' : ''}" data-act="homeFilter|${k}">${l}</button>`).join('')}</div>${body}${note}`;
}
function doseRows(d, doses){
  return doses.map(x => {
    const r = doseRec(d, x.key), st = doseState(d, x), on = st === 'taken';
    const statusPill = st === 'taken' ? `<span class="pill good">✓ Taken${r && r.at ? ' ' + new Date(r.at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}) : ''}</span>`
      : st === 'skipped' ? `<span class="pill grey">Skipped${r.reason ? ' · ' + esc(r.reason) : ''}</span>`
      : st === 'missed' ? (r ? `<span class="pill bad">Missed</span>` : `<span class="pill bad">Missed?</span>`)
      : st === 'due' ? '<span class="pill warn">due</span>' : '';
    const right = r && r.s !== 'taken'
      ? `<button class="btn sm sec" data-act="undoDose|${d}|${x.key}" aria-label="Undo">Undo</button>`
      : `${on ? '' : `<button class="skipb" data-act="skipDose|${d}|${x.key}" aria-label="Skip or missed">Skip</button>`}<button class="chk ${on?'on':''}" aria-label="${on?'Mark not taken':'Mark taken'}" data-act="dose|${d}|${x.key}">${on?ic('check'):''}</button>`;
    return `<div class="row ${r && r.s !== 'taken' ? 'dimmed' : ''}">${medIcon(x.med)}<div class="main"><div class="ttl">${esc(x.med.name)} ${x.med.dose?`<span class="small">${esc(x.med.dose)}</span>`:''}</div><div class="sub">${fmtT(x.time)}${repOf(x.med).type !== 'daily' ? ` · <span class="pill rep">${repeatLabel(x.med)}</span>` : ''} ${statusPill}</div><div class="sub" style="margin-top:3px">${foodBadge(x.med)}</div>${HIDE_CASE_TAG?'':`<div class="sub">${caseBubble(caseOf(x.med))}</div>`}</div><div style="display:flex;gap:6px;align-items:center">${right}</div></div>`;
  }).join('');
}
function visitRow(v){
  const up = v.date >= today();
  const dd = daysBetween(today(), v.date);
  return `<div class="row click" data-act="viewVisit|${v.id}"><div class="medic">${ic(v.facilityType==='Hospital'?'hospital':'doctor')}</div><div class="main"><div class="ttl">${esc(v.doctor||'Doctor')}${v.specialty?` <span class="small">· ${esc(v.specialty)}</span>`:''}</div><div class="sub">${fmtD(v.date)}${v.time?' · '+fmtT(v.time):''} · ${esc(v.facility||'')}</div>${v.reason?`<div class="sub">${esc(v.reason)}</div>`:''}${caseTag(v)}</div>${up?`<span class="pill">${dd===0?'Today':dd===1?'Tomorrow':'in '+dd+' d'}</span>`:''}</div>`;
}
function goalRow(g){
  const pct = g.target ? Math.max(0, Math.min(100, Math.round((+g.current||0) / +g.target * 100))) : 0;
  return `<div class="row click" data-act="editGoal|${g.id}"><div class="main"><div class="ttl">${esc(g.title)}</div><div class="sub">${esc(g.current||0)} / ${esc(g.target||'?')} ${esc(g.unit||'')}${g.deadline?' · by '+fmtDs(g.deadline):''}</div><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div><span class="pill ${g.done?'good':''}">${g.done?'Done':pct+'%'}</span></div>`;
}

/* ---- Meds ---- */
VIEWS.meds = () => {
  const t = today();
  const allMeds = list('med');
  const mcases = sortedCases().filter(c => allMeds.some(m => m.caseId === c.id));
  if (UI.medCase !== 'all' && UI.medCase !== 'none' && !mcases.some(c => c.id === UI.medCase)) UI.medCase = 'all';
  const fit = m => UI.medCase === 'all' || (UI.medCase === 'none' ? !caseOf(m) : m.caseId === UI.medCase);
  const meds = allMeds.filter(fit);
  const active = meds.filter(m => medActiveOn(m, t) || (m.start > t && !m.stopped));
  const past = meds.filter(m => !active.includes(m)).sort((a,b)=>(b.prescribedOn||'').localeCompare(a.prescribedOn||''));
  const tab = UI.medTab;
  let body = '';
  if (tab === 'today') {
    const days = [0,1,2,3,4,5,6].map(i => addDays(t, i));
    const past = [1,2,3,4,5,6,7].map(i => addDays(t, -i)).filter(d => allMeds.some(m => fit(m) && medDueOn(m, d)));
    const unrec = past.reduce((a, d) => a + dosesFor(d).filter(x => fit(x.med) && !isRecorded(d, x.key)).length, 0);
    const earlier = past.length ? `<div class="sect" style="display:flex;align-items:center">Earlier days${unrec ? ` · <span style="color:var(--bad);margin-left:4px">${unrec} not recorded</span>` : ''}<span class="sp" style="flex:1"></span><button class="link" data-act="medPast">${UI.medPast ? 'Hide' : 'Show'}</button></div>${UI.medPast ? past.map(d => { const ds = dosesFor(d).filter(x => fit(x.med)); return `<div class="card"><h3>${parseD(d).toLocaleDateString(undefined,{weekday:'long'})}<span class="sp"></span><span class="small">${fmtD(d)}</span></h3>${ds.length ? doseBlock(d, ds) : '<div class="empty">Nothing scheduled</div>'}${ds.some(x => !isRecorded(d, x.key)) ? `<button class="btn sm sec" data-act="allTaken|${d}" style="margin-top:6px">Mark all unrecorded as taken</button>` : ''}</div>`; }).join('') : ''}` : '';
    body = (liveTimers().length ? timersCard() : '') + `<div class="btns" style="margin:-4px 0 10px;justify-content:flex-end">${liveTimers().length ? '' : '<button class="btn sm sec" data-act="newTimer">⏱ Timer</button>'}<button class="btn sm sec" data-act="arrange">${ic('sliders','style="width:15px;height:15px"')} Arrange</button></div>` + prnCard(fit) + days.map(d => { const ds = dosesFor(d).filter(x => fit(x.med)); return `<div class="card"><h3>${d===t?'Today':parseD(d).toLocaleDateString(undefined,{weekday:'long'})}<span class="sp"></span><span class="small">${fmtD(d)}</span></h3>${d === t ? todayCard(t, ds) : ds.length ? doseBlock(d, ds) : '<div class="empty">Nothing scheduled</div>'}</div>`; }).join('') + earlier;
  } else if (tab === 'cal') {
    body = medCalendar(fit);
  } else if (tab === 'active') {
    body = `<div class="card">${active.length ? active.map(medRow).join('') : '<div class="empty">No active medication.</div>'}</div>`;
  } else {
    body = `<div class="card">${past.length ? past.map(medRow).join('') : '<div class="empty">No past prescriptions.</div>'}</div>`;
  }
  return `
  ${(() => { const mm = list('med').filter(m => (medActiveOn(m, t) || m.start > t) && !isPrn(m) && timingMismatch(m)); return mm.length ? `<div class="alert bad"><b>Dose times don't match the instructions</b>${mm.map(m => `${esc(m.name)}: “${esc(m.instructions)}” but scheduled ${(m.times||[]).map(fmtT).join(', ')}`).join('<br>')}<div class="btns" style="margin-top:8px"><button class="btn sm" data-act="fixTimes">Fix times</button></div></div>` : ''; })()}
  ${(() => { const miss = list('med').filter(m => (medActiveOn(m, t) || m.start > t) && foodApplies(m) && !foodOf(m)); return miss.length ? `<div class="alert warn"><b>${miss.length} medicine${miss.length>1?'s don\'t':' doesn\'t'} say whether to take ${miss.length>1?'them':'it'} before or after food</b>${esc(miss.map(m=>m.name).join(', '))}<div class="btns" style="margin-top:8px"><button class="btn sm" data-act="fixFoods">Set food timing</button></div></div>` : ''; })()}
  <div class="ocrbox"><b>Got a new prescription?</b><div class="small" style="margin:4px 0 10px">Snap or upload it and the medicines, doses and schedule are read for you — then you check and confirm.</div><div class="btns" style="justify-content:center"><button class="btn" data-act="scanRx">${ic('scan','style="width:18px;height:18px"')} Scan prescription</button><button class="btn out" data-act="addMed">Add manually</button></div></div>
  <div class="seg">${[['today','Schedule'],['cal','Calendar'],['active','Active ('+active.length+')'],['past','History']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="medTab|${k}">${l}</button>`).join('')}</div>
  ${mcases.length ? `<div class="chips" style="margin-bottom:12px"><button class="chip ${UI.medCase==='all'?'on':''}" data-act="medCase|all">All</button>${mcases.map(c => { const [bg, fg] = caseColor(c); const on = UI.medCase===c.id; return `<button class="chip ${on?'on':''}" data-act="medCase|${c.id}" style="${on?'':`background:${bg};color:${fg};border-color:${bg}`}">${esc(c.title)}${c.status==='closed'?' (closed)':''}</button>`; }).join('')}${allMeds.some(m=>!caseOf(m))?`<button class="chip ${UI.medCase==='none'?'on':''}" data-act="medCase|none">No case</button>`:''}</div>` : ''}
  ${body}`;
};
function medCalendar(fit){
  const t = today(), mon = UI.mcMonth || t.slice(0, 7), sel = UI.mcSel || t;
  const [y, m] = mon.split('-').map(Number);
  const first = new Date(y, m - 1, 1), start = new Date(y, m - 1, 1 - ((first.getDay() + 6) % 7));
  const cells = []; for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); cells.push(iso(d)); }
  const stat = d => {
    const ds = dosesFor(d).filter(x => fit(x.med)), started = list('med').some(x => fit(x) && x.start === d);
    if (!ds.length) return {c: '', started};
    if (d > t) return {c: 'var(--teal)', started};
    const st = ds.map(x => doseState(d, x));
    if (st.every(s => s === 'taken')) return {c: 'var(--good)', started};
    if (st.some(s => s === 'missed')) return {c: 'var(--bad)', started};
    if (st.some(s => s === 'taken' || s === 'skipped')) return {c: 'var(--warn)', started};
    return {c: d === t ? 'var(--teal)' : 'var(--bad)', started};
  };
  const ds = dosesFor(sel).filter(x => fit(x.med));
  const startedSel = list('med').filter(x => fit(x) && x.start === sel), endedSel = list('med').filter(x => fit(x) && x.end === sel);
  const prnSel = list('med').filter(x => fit(x) && isPrn(x) && prnUses(sel, x.id).length);
  return `<div class="card">
    <div class="calhead"><button class="iconbtn" data-act="mcMove|-1">${ic('back')}</button><b>${first.toLocaleDateString(undefined, {month:'long', year:'numeric'})}</b><button class="iconbtn" data-act="mcMove|1">${ic('back', 'style="transform:rotate(180deg)"')}</button></div>
    <div class="cal">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d => `<div class="dh">${d}</div>`).join('')}
    ${cells.map(d => { const s = stat(d); return `<div class="d ${d.slice(0, 7) !== mon ? 'o' : ''} ${d === t ? 'today' : ''} ${d === sel ? 'sel' : ''}" data-act="mcSel|${d}">${+d.slice(8)}<span class="dots">${s.c ? `<i style="background:${d === sel ? '#fff' : s.c}"></i>` : ''}${s.started ? `<i style="background:${d === sel ? '#fff' : 'var(--info)'}"></i>` : ''}</span></div>`; }).join('')}</div>
    <div class="legend"><span><i style="background:var(--good)"></i>All taken</span><span><i style="background:var(--warn)"></i>Some not taken</span><span><i style="background:var(--bad)"></i>Missed</span><span><i style="background:var(--teal)"></i>Planned</span><span><i style="background:var(--info)"></i>Started</span></div>
  </div>
  <div class="card"><h3>${sel === t ? 'Today' : fmtD(sel)}<span class="sp"></span><span class="small">${ds.length ? `${ds.filter(x => isTaken(sel, x.key)).length}/${ds.length} taken` : ''}</span></h3>
    ${startedSel.map(x => `<div class="small" style="margin-bottom:6px">▶ Started <b>${esc(x.name)}</b></div>`).join('')}${endedSel.map(x => `<div class="small" style="margin-bottom:6px">■ Last day of <b>${esc(x.name)}</b></div>`).join('')}
    ${ds.length ? doseBlock(sel, ds) : '<div class="empty">No scheduled doses.</div>'}
    ${prnSel.map(x => `<div class="small" style="margin-top:6px">💊 ${esc(x.name)} (as needed): taken ${prnUses(sel, x.id).length}×</div>`).join('')}
    ${sel < t && ds.some(x => !isRecorded(sel, x.key)) ? `<button class="btn sm sec" data-act="allTaken|${sel}" style="margin-top:8px">Mark all unrecorded as taken</button>` : ''}
  </div>`;
}
function medRow(m){
  const t = today();
  const st = m.stopped ? '<span class="pill grey">Stopped</span>' : m.start > t ? '<span class="pill">Starts '+fmtDs(m.start)+'</span>' : medActiveOn(m,t) ? '<span class="pill good">Active</span>' : '<span class="pill grey">Finished</span>';
  return `<div class="row click" data-act="viewMed|${m.id}">${medIcon(m)}<div class="main"><div class="ttl">${esc(m.name)} ${m.dose?`<span class="small">${esc(m.dose)}</span>`:''}</div><div class="sub">${isPrn(m) ? '' : (m.times||[]).map(fmtT).join(', ') + ' · '}${repeatLabel(m)}${!isPrn(m) && repOf(m).type !== 'daily' && medActiveOn(m, t) ? (() => { const n = nextDue(m, t); return n ? ` · next ${n === t ? 'today' : fmtDs(n)}` : ''; })() : ''}</div><div class="sub" style="margin:3px 0">${foodBadge(m)}</div><div class="sub">${fmtDs(m.start)}${m.end?' – '+fmtDs(m.end):' – ongoing'}</div><div class="sub">${esc([m.doctor, m.facility].filter(Boolean).join(' · '))}</div>${caseTag(m)}</div>${st}</div>`;
}

/* ---- Visits ---- */
VIEWS.visits = () => {
  const up = upcomingVisits(), past = pastVisits();
  const tab = UI.visitTab;
  const rows = tab === 'upcoming' ? up : past;
  // facilities summary
  const fac = {};
  list('visit').forEach(v => { const k = v.facility || 'Unknown'; fac[k] = fac[k] || {n:0, last:'', type:v.facilityType}; fac[k].n++; if (v.date > fac[k].last && v.date <= today()) fac[k].last = v.date; });
  return `
  <button class="btn block" data-act="addVisit" style="margin-bottom:12px">+ Add doctor visit</button>
  <div class="seg">${[['upcoming','Upcoming ('+up.length+')'],['past','Past ('+past.length+')'],['places','Doctors & places']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="visitTab|${k}">${l}</button>`).join('')}</div>
  ${tab === 'places' ? `<div class="card">${Object.keys(fac).length ? Object.entries(fac).map(([k,f]) => `<div class="row"><div class="medic">${ic(f.type==='Hospital'?'hospital':'doctor')}</div><div class="main"><div class="ttl">${esc(k)}</div><div class="sub">${esc(f.type||'')} · ${f.n} visit${f.n>1?'s':''}${f.last?' · last '+fmtD(f.last):''}</div><div class="sub">${esc([...new Set(list('visit').filter(v=>(v.facility||'Unknown')===k).map(v=>v.doctor).filter(Boolean))].join(', '))}</div></div></div>`).join('') : '<div class="empty">No visits recorded yet.</div>'}</div>`
  : `<div class="card">${rows.length ? rows.map(visitRow).join('') : `<div class="empty">No ${tab} visits.</div>`}</div>`}`;
};

/* ---- Sick ---- */
VIEWS.sick = () => {
  const act = activeIllness();
  const hist = list('illness').filter(i => i.end).sort((a,b)=>b.start.localeCompare(a.start));
  const avg = hist.length ? (hist.reduce((a,i)=>a+daysBetween(i.start,i.end)+1,0)/hist.length).toFixed(1) : null;
  return `
  <div class="tiles" style="grid-template-columns:1fr"><div class="tile hot" data-act="reportSick" style="flex-direction:row;justify-content:center;gap:12px;padding:16px"><div class="ic">${ic('thermo')}</div><div style="text-align:left"><div style="font-size:16px">I'm feeling sick</div><div style="font-weight:600;opacity:.9;font-size:12.5px">Log symptoms & check whether to see a doctor</div></div></div></div>
  <div class="card"><h3>Currently sick</h3>${act.length ? act.map(illRow).join('') : '<div class="empty">Nothing active — glad you\'re well!</div>'}</div>
  <div class="card"><h3>History<span class="sp"></span>${avg?`<span class="small">${hist.length} episode${hist.length>1?'s':''} · avg ${avg} days</span>`:''}</h3>${hist.length ? hist.map(illRow).join('') : '<div class="empty">No past illnesses recorded.</div>'}</div>`;
};
function illRow(i){
  const t = today();
  const dur = daysBetween(i.start, i.end || t) + 1;
  return `<div class="row click" data-act="viewIll|${i.id}"><div class="medic" style="${i.end?'':'background:#fbf0d9;color:#7d5608'}">${ic('sick')}</div><div class="main"><div class="ttl">${esc(i.title||'Unwell')}</div><div class="sub">${fmtD(i.start)} → ${i.end?fmtD(i.end):'now'} · ${dur} day${dur>1?'s':''}</div><div class="sub">${esc((i.symptoms||[]).join(', '))}</div>${caseTag(i)}</div>${i.end?'<span class="pill good">Recovered</span>':`<span class="pill warn">Sev ${esc(i.severity||'?')}/10</span>`}</div>`;
}

/* ---- Files ---- */
const FILE_CATS = ['Lab report','X-ray','Scan (CT/MRI/Ultrasound)','Prescription','Doctor\'s note','Vaccination','Insurance','Other'];
const catIcon = c => c==='Lab report'?'lab':c.startsWith('X-ray')||c.startsWith('Scan')?'xray':c==='Prescription'?'pill':c==='Doctor\'s note'?'note':'file';
const REC_CATS = ['Doctor visit','Sick report', ...FILE_CATS];
function recordItems(){
  return [
    ...list('file').map(f => ({r:f, cat:f.category||'Other', date:f.date||'', text:[f.name,f.reason,f.doctor,f.facility,f.notes,f.category]})),
    ...list('visit').map(v => ({r:v, cat:'Doctor visit', date:v.date||'', text:[v.doctor,v.facility,v.specialty,v.reason,v.notes,'doctor visit']})),
    ...list('illness').map(i => ({r:i, cat:'Sick report', date:i.start||'', text:[i.title,...(i.symptoms||[]),i.notes,'sick']}))
  ].map(x => { const c = caseOf(x.r); if (c) x.text.push(c.title); return x; });
}
function recRow(r){ return r.kind === 'visit' ? visitRow(r) : r.kind === 'illness' ? illRow(r) : r.kind === 'med' ? medRow(r) : fileRow(r); }
VIEWS.files = () => {
  const tab = UI.recTab;
  const seg = `<div class="seg">${[['records','Records'],['cases','Case files ('+list('case').length+')']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="recTab|${k}">${l}</button>`).join('')}</div>`;
  if (tab === 'cases') {
    const cs = sortedCases();
    return seg + `<button class="btn block" data-act="newCase" style="margin-bottom:12px">${ic('plus','style="width:18px;height:18px"')} New case file</button>
    <div class="alert info" style="font-size:13px">A case file keeps everything about one health problem together — the doctor visits, prescriptions, medication, lab reports, x-rays and sick reports. Cases are also created for you when you scan a prescription or report feeling sick.</div>
    <div class="card">${cs.length ? cs.map(caseRow).join('') : '<div class="empty">No case files yet.</div>'}</div>`;
  }
  const q = UI.fileQ.toLowerCase(), cat = UI.fileCat;
  const all = recordItems();
  const items = all.filter(x => (cat==='All' || x.cat===cat) && (!q || x.text.join(' ').toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
  const counts = {}; all.forEach(x => counts[x.cat] = (counts[x.cat]||0)+1);
  return seg + `
  <div class="btns" style="margin-bottom:12px"><button class="btn" data-act="addFile" style="flex:1">${ic('plus','style="width:18px;height:18px"')} Upload a record</button><button class="btn out" data-act="scanRx">${ic('scan','style="width:18px;height:18px"')} Scan Rx</button></div>
  <div class="search">${ic('search')}<input placeholder="Search name, reason, doctor, case…" value="${esc(UI.fileQ)}" data-act="fileQ" id="fileQ"></div>
  <div class="chips" style="margin-bottom:12px">${['All',...REC_CATS].filter(c=>c==='All'||counts[c]).map(c=>`<button class="chip ${cat===c?'on':''}" data-act="fileCat|${c}">${esc(c)}${c!=='All'?' '+counts[c]:''}</button>`).join('')}</div>
  <div class="card" id="fileList">${items.length ? items.map(x => recRow(x.r)).join('') : `<div class="empty">${all.length?'No records match.':'No records yet. Upload lab reports, x-rays, prescriptions and doctor\'s notes to keep them in one place.'}</div>`}</div>`;
};
function caseSummary(cid){
  const it = caseItems(cid), n = k => it.filter(k).length;
  return [[n(r=>r.kind==='visit'),'visit'],[n(r=>r.kind==='med'),'med'],[n(r=>r.kind==='file'&&r.category==='Prescription'),'prescription'],[n(r=>r.kind==='file'&&r.category==='Lab report'),'lab report'],[n(r=>r.kind==='file'&&/^(X-ray|Scan)/.test(r.category||'')),'scan'],[n(r=>r.kind==='illness'),'sick report'],[n(r=>r.kind==='file'&&!/^(X-ray|Scan|Lab report|Prescription)/.test(r.category||'')),'document']].filter(([c])=>c).map(([c,l])=>`${c} ${l}${c>1?'s':''}`).join(' · ');
}
function caseDates(cid){ const ds = caseItems(cid).map(r => r.kind==='illness' ? r.start : r.kind==='med' ? (r.prescribedOn||r.start) : r.date).filter(Boolean).sort(); return ds; }
function caseRow(c){
  const ds = caseDates(c.id), last = ds[ds.length-1];
  return `<div class="row click" data-act="openCase|${c.id}"><div class="medic" style="${c.status==='closed'?'background:#eef1f2;color:#5b6b70':''}">${ic('folder')}</div><div class="main"><div class="ttl">${esc(c.title)}</div><div class="sub">Opened ${fmtD(c.created)}${last && last !== c.created ? ' · last update '+fmtDs(last) : ''}</div><div class="sub">${caseSummary(c.id) || 'Empty'}</div></div>${c.status==='closed'?'<span class="pill grey">Closed</span>':'<span class="pill good">Open</span>'}</div>`;
}

/* ---- case view ---- */
VIEWS.case = () => {
  const c = get(UI.caseId);
  if (!c) { UI.recTab = 'cases'; return `<div class="empty">This case file no longer exists. <button class="link" data-act="nav|files">Back to records</button></div>`; }
  const it = caseItems(c.id);

/* ---------------- period / cycle tracker ---------------- */
const CYCLE_SYMPTOMS = ['Cramps','Headache','Bloating','Back pain','Tender breasts','Mood changes','Acne','Fatigue','Nausea','Cravings','Spotting'];
function cycleOn(){ const pr = profile(); return pr.sex !== 'Male' || list('period').length > 0; }
function periods(){ return list('period').filter(x => x.start).sort((a, b) => a.start.localeCompare(b.start)); }
function cycleStats(){
  const ps = periods(), t = today();
  const lens = []; for (let i = 1; i < ps.length; i++) { const L = daysBetween(ps[i-1].start, ps[i].start); if (L >= 15 && L <= 60) lens.push(L); }
  const recent = lens.slice(-6);
  const avgCycle = recent.length ? Math.round(recent.reduce((a, b) => a + b, 0) / recent.length) : 28;
  const durs = ps.filter(x => x.end).map(x => daysBetween(x.start, x.end) + 1).filter(n => n >= 1 && n <= 15).slice(-6);
  const avgLen = durs.length ? Math.round(durs.reduce((a, b) => a + b, 0) / durs.length) : 5;
  const last = ps[ps.length - 1] || null;
  if (!last) return {avgCycle, avgLen, last: null, n: ps.length};
  const ongoing = !last.end && daysBetween(last.start, t) < 12;
  const next = addDays(last.start, avgCycle);
  const ovu = addDays(next, -14), fertileFrom = addDays(ovu, -5), fertileTo = addDays(ovu, 1);
  const cycleDay = daysBetween(last.start, t) + 1;
  const late = t > next && !ongoing ? daysBetween(next, t) : 0;
  const irregular = recent.length >= 3 && (Math.max(...recent) - Math.min(...recent)) > 9;
  return {avgCycle, avgLen, last, ongoing, next, ovu, fertileFrom, fertileTo, cycleDay, late, irregular, n: ps.length, lens: recent};
}
function cycleDayType(d, st){
  const ps = periods();
  for (const x of ps) { const end = x.end || (daysBetween(x.start, today()) < 12 ? today() : addDays(x.start, st.avgLen - 1)); if (d >= x.start && d <= end) return 'period'; }
  if (!st.last) return '';
  // predicted: next three cycles
  for (let k = 0; k < 3; k++) {
    const ns = addDays(st.next, k * st.avgCycle), ne = addDays(ns, st.avgLen - 1);
    if (d >= ns && d <= ne && d > today()) return 'predicted';
    const ov = addDays(ns, -14);
    if (d === ov) return 'ovulation';
    if (d >= addDays(ov, -5) && d <= addDays(ov, 1)) return 'fertile';
  }
  return '';
}
function cycleHomeCard(){
  if (!cycleOn()) return '';
  const st = cycleStats(); if (!st.last) return '';
  const t = today();
  let msg = '';
  if (st.ongoing) msg = `🩸 Period day ${st.cycleDay}`;
  else if (st.late) msg = `⏰ Period is ${st.late} day${st.late > 1 ? 's' : ''} late`;
  else { const dd = daysBetween(t, st.next); msg = dd === 0 ? '🩸 Period expected today' : dd > 0 && dd <= 7 ? `🩸 Period expected in ${dd} day${dd > 1 ? 's' : ''} (${fmtDs(st.next)})` : t >= st.fertileFrom && t <= st.fertileTo ? '🌸 Fertile window' : ''; }
  return msg ? `<div class="alert info cyclealert" data-act="healthTab|cycle" style="cursor:pointer"><b>${msg}</b>Cycle day ${st.cycleDay} · tap to open your cycle</div>` : '';
}

    ${st.late >= 7 ? `<div class="alert warn" style="margin:10px 0 0;font-size:13px"><b>${st.late} days late</b>Stress, illness, travel and some medicines can delay a period. If you could be pregnant, a home test is reliable from the day your period was due.</div>` : ''}`;

    ${cells.map(d => { const ty = cycleDayType(d, st); return `<div class="d cy-${ty} ${d.slice(0, 7) !== mon ? 'o' : ''} ${d === t ? 'today' : ''}">${+d.slice(8)}</div>`; }).join('')}</div>

  </div>
  <div class="card"><h3>History<span class="sp"></span><span class="small">${st.n} logged</span></h3>
    ${periods().reverse().slice(0, 24).map((x, i, arr) => { const nx = arr[i - 1]; const cyc = nx ? daysBetween(x.start, nx.start) : null; return `<div class="row click" data-act="periodEdit|${x.id}"><div class="medic" style="background:#fbe3ea;color:#8c2343">🩸</div><div class="main"><div class="ttl">${fmtD(x.start)}${x.end ? ' – ' + fmtDs(x.end) : ' · ongoing'}</div><div class="sub">${x.end ? (daysBetween(x.start, x.end) + 1) + ' days' : ''}${x.flow ? ' · ' + esc(x.flow) + ' flow' : ''}${cyc ? ` · ${cyc}-day cycle` : ''}</div>${(x.symptoms || []).length ? `<div class="sub">${esc(x.symptoms.join(', '))}</div>` : ''}</div></div>`; }).join('') || '<div class="empty">No periods logged yet.</div>'}
  </div>
  <label class="switch card" style="cursor:pointer"><div class="main"><div style="font-weight:700">Remind me before my period</div><div class="small">2 days before it's expected</div></div><button type="button" class="tog ${s.remind.period ? 'on' : ''}" data-act="tog|period" aria-label="Period reminder"></button></label>
  <p class="disclaimer">Predictions are estimates from your past cycles. Don't rely on them for contraception. See a doctor about very painful, very heavy, or irregular periods.</p>`;
}

VIEWS.calendar = () => {
  const [y, m] = UI.calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1), startDow = (first.getDay()+6)%7; // Monday first
  const start = new Date(y, m-1, 1 - startDow);
  const t = today();
  const cells = [];
  for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate()+i); cells.push(iso(d)); }
  const visits = list('visit'), ills = list('illness'), files = list('file');
  const dots = d => {
    const out = [];
    if (visits.some(v=>v.date===d)) out.push('var(--info)');
    if (ills.some(i=>i.start<=d && (i.end||t)>=d && d<=t)) out.push('var(--bad)');
    if (dosesFor(d).length) out.push('var(--teal)');
    if (files.some(f=>f.date===d)) out.push('var(--warn)');
    return out;
  };
  const sel = UI.calSel;
  const dv = visits.filter(v=>v.date===sel), di = ills.filter(i=>i.start<=sel && (i.end||t)>=sel && sel<=t), df = files.filter(f=>f.date===sel), dd = dosesFor(sel);
  const started = list('med').filter(x=>x.prescribedOn===sel);
  return `<div class="card">
    <div class="calhead"><button class="iconbtn" data-act="calMove|-1">${ic('back')}</button><b>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="iconbtn" data-act="calMove|1">${ic('back','style="transform:rotate(180deg)"')}</button></div>
    <div class="cal">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<div class="dh">${d}</div>`).join('')}
    ${cells.map(d => `<div class="d ${d.slice(0,7)!==UI.calMonth?'o':''} ${d===t?'today':''} ${d===sel?'sel':''}" data-act="calSel|${d}">${+d.slice(8)}<span class="dots">${dots(d).slice(0,4).map(c=>`<i style="background:${d===sel?'#fff':c}"></i>`).join('')}</span></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--info)"></i>Doctor visit</span><span><i style="background:var(--teal)"></i>Medication</span><span><i style="background:var(--bad)"></i>Sick</span><span><i style="background:var(--warn)"></i>Record</span></div>
  </div>
  <div class="card"><h3>${fmtD(sel)}</h3>
    ${dv.map(visitRow).join('')}
    ${di.map(illRow).join('')}
    ${started.map(x=>`<div class="row click" data-act="viewMed|${x.id}"><div class="medic">${ic('note')}</div><div class="main"><div class="ttl">Prescribed: ${esc(x.name)}</div><div class="sub">${esc([x.doctor,x.facility].filter(Boolean).join(' · '))}</div></div></div>`).join('')}
    ${dd.length ? doseRows(sel, dd) : ''}
    ${df.map(fileRow).join('')}
    ${!dv.length && !di.length && !dd.length && !df.length && !started.length ? '<div class="empty">Nothing on this day.</div>' : ''}
    <div class="btns" style="margin-top:8px"><button class="btn sm sec" data-act="addVisitOn|${sel}">+ Visit on this day</button></div>
  </div>`;
};

ACT.dose = (d, key) => {
  const medId = key.split('@')[0], m = get(medId);
  if (isRecorded(d, key) || d !== today()) return toggleDose(d, key);
  const w = blockingWaits(medId);
  if (!w.length) return toggleDose(d, key);
  const x = w.sort((a, b) => b.due - a.due)[0];
  openSheet('Wait a little?', `<div class="alert warn"><b>${esc(x.label)}</b>${esc(x.sub)} — ${leftText(x.due)} to go (until ${new Date(x.due).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}).</div>
    <div class="btns"><button class="btn" id="remindMe" style="flex:1">Remind me then</button><button class="btn sec" id="takeAnyway">I took it anyway</button></div>`, b => {
    b.querySelector('#remindMe').onclick = () => { const items = [...(timersRec().items || [])]; items.push({id: 'tm' + uid(), src: 'manual', medId: x.medId, kind: 'next', target: medId, start: Date.now(), due: x.due, label: `Take ${m.name}`, sub: 'after waiting', done: false}); saveTimers(items); closeSheet(); toast('⏱ I\'ll remind you when it\'s time.'); };
    b.querySelector('#takeAnyway').onclick = () => { closeSheet(); toggleDose(d, key); };
  });
};
ACT.timerDone = id => { saveTimers((timersRec().items || []).map(x => x.id === id ? {...x, done: true} : x)); };
ACT.timerTake = id => {
  const x = (timersRec().items || []).find(y => y.id === id); if (!x) return;
  const m = get(x.target);
  ACT.timerDone(id);
  if (!m) return;
  if (isPrn(m)) return ACT.prnTake(m.id);
  const t = today(), due = dosesFor(t).filter(y => y.med.id === m.id && !isRecorded(t, y.key)).sort((a, b) => Math.abs(hmToMin(a.time) - hmToMin(nowHM())) - Math.abs(hmToMin(b.time) - hmToMin(nowHM())))[0];
  if (due) { setDose(t, due.key, {s:'taken', at: Date.now()}); toast(`${esc(m.name)} marked as taken.`); }
  else toast(`${esc(m.name)} has no dose scheduled today — nothing to tick.`);
};
ACT.newTimer = () => {

  openSheet('Start a timer', `<label class="f">What for?<input id="tmLabel" placeholder="e.g. Eat breakfast, Rinse off cream, Next eye drops" value=""></label>

    <label class="f" style="margin-top:10px">Or minutes<input id="tmMin" type="number" min="1" max="2880" value="30"></label>

ACT.prnTake = id => {
  const m = get(id); if (!m) return;
  const t = today(), r = repOf(m), uses = prnUses(t, id), last = uses[uses.length-1];
  const record = () => { const rec = day(t), now = Date.now(); save({...rec, prn: {...(rec.prn||{}), [id]: [...uses, now]}}); startAfterTimers(id, now, `prn|${t}|${id}|${now}`); toast(`${esc(m.name)} dose recorded.`, {label:'Undo', fn:() => ACT.prnUndo(id)}); };
  const warn = [];
  if (r.max && uses.length >= +r.max) warn.push(`You've already taken the maximum of ${r.max} today.`);
  if (r.gap && last && (Date.now() - last) < r.gap * 3600e3) warn.push(`It's only been ${((Date.now() - last)/3600e3).toFixed(1)} hours since your last dose — the minimum gap is ${r.gap} hours.`);
  if (!warn.length) return record();
  openSheet('Check before taking', `<div class="alert bad"><b>${esc(m.name)}</b>${warn.join('<br>')}</div><div class="small" style="margin-bottom:12px">If your symptoms are bad enough that you need more, contact your doctor or pharmacist.</div><div class="btns"><button class="btn sec" data-close style="flex:1">Don't take it</button><button class="btn danger" id="anyway">I took it anyway</button></div>`, b => b.querySelector('#anyway').onclick = () => { closeSheet(); record(); });
};
ACT.prnUndo = id => { const t = today(), rec = day(t), uses = [...prnUses(t, id)]; const last = uses.pop(); clearTimersFrom(`prn|${t}|${id}|${last}`); save({...rec, prn: {...(rec.prn||{}), [id]: uses}}); };

function shrinkImage(file, max, q=0.85){
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      if (s === 1 && file.size < 1.5e6 && q >= 0.85) return res(file);
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || file), 'image/jpeg', q);
    };
    img.onerror = () => res(file);
    img.src = URL.createObjectURL(file);
  });
}

  const tmp = parseFloat(i.temp);

  if (+i.severity >= 9) flags.push('Very severe symptoms');
  const tm = (i.notes||'').match(RED_TEXT); if (tm) flags.push(`“${tm[0]}” mentioned`);
  if (flags.length) return {level:'bad', title:'Seek medical care now', text:`Because of: ${flags.join(', ')}. Contact a doctor or go to urgent care today. If symptoms are severe or getting worse fast, call your local emergency number.`};
  const see = [];
  if (tmp >= 38 && days >= 3) see.push('fever lasting 3+ days');
  if (days >= 7) see.push('symptoms for over a week');
  if (+i.severity >= 7) see.push('high severity');
  if ((i.symptoms||[]).some(s => ['Vomiting','Diarrhea'].includes(s)) && days >= 2) see.push('vomiting/diarrhea for 2+ days (dehydration risk)');
  if ((i.symptoms||[]).includes('Painful urination')) see.push('possible urinary infection');
  if ((i.symptoms||[]).includes('Ear pain') && days >= 3) see.push('ear pain for 3+ days');
  const p = profile();
  if (p.conditions) see.push('you have a long-term condition (' + p.conditions.slice(0,40) + ')');
  if (see.length) return {level:'warn', title:'Consider seeing a doctor', text:`Book a visit with your doctor soon: ${see.join('; ')}. Rest and stay hydrated meanwhile.`};
  return {level:'good', title:'Likely OK to recover at home', text:'Rest, drink plenty of fluids and keep logging how you feel. See a doctor if you get worse, develop a high fever, or aren\'t improving after a few days.'};
}
